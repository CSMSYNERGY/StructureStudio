# .github/workflows/merge-beta-to-main.yml
#
# Every Monday: merge beta into main. The merge ALWAYS completes.
# On conflict, beta's version wins and the conflicted files are listed
# in the monday.com report so nothing is silently overwritten.
# Runs on GitHub's servers - nothing needs to be open on your computer.
#
# Cron is UTC-only (no timezone). 13:00 UTC = 9am US Eastern (summer)
# / 8am (winter). Edit the cron to taste (https://crontab.guru).
#
# Reporting: posts an update to the "StructureStudio" item on the
# monday.com "Projects (Repos)" board after every run. Requires a repo
# secret named MONDAY_API_TOKEN (a monday personal API token). If that
# secret is missing, the merge still runs and only the report is skipped.

name: Weekly merge beta into main

on:
  schedule:
    - cron: "0 13 * * 1"   # 13:00 UTC every Monday
  workflow_dispatch: {}      # also runnable on demand from the Actions tab

concurrency:
  group: merge-beta-into-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  MONDAY_ITEM_ID: "12385631316"   # StructureStudio row on "Projects (Repos)"

jobs:
  merge-beta-into-main:
    runs-on: ubuntu-latest
    env:
      MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge beta into main (auto-resolve, beta wins)
        id: merge
        run: |
          set -euo pipefail
          git fetch origin beta:beta

          COMMITS="$(git log --oneline --no-decorate main..beta | head -50)"
          if [ -z "$COMMITS" ]; then
            COMMITS="(nothing new on beta this week)"
          fi

          RESULT="clean"
          CONFLICTS=""

          if git merge --no-ff beta -m "chore: weekly auto-merge of beta into main"; then
            RESULT="clean"
          else
            CONFLICTS="$(git diff --name-only --diff-filter=U | sort -u)"
            git merge --abort
            if git merge --no-ff -X theirs beta -m "chore: weekly auto-merge of beta into main (conflicts auto-resolved, beta won)"; then
              RESULT="conflicts-resolved"
            else
              # -X theirs only auto-resolves CONTENT hunks. What reaches here is modify/delete,
              # rename/rename or add/add — and for a modify/delete path there is no "theirs" stage
              # at all, so the old `git checkout --theirs -- . 2>/dev/null || true` exited non-zero,
              # had its error swallowed, and then `git add -A` staged whatever git had left behind:
              # either beta's deletion silently REVERTED (while the report claimed beta won), or a
              # file still containing literal <<<<<<< / ======= / >>>>>>> markers. That was then
              # pushed to main unconditionally, and for portal.html or index.html a conflict marker
              # is a hard parse failure — every tenant's portal and public designer down, with the
              # workflow reporting success.
              #
              # Resolve each remaining path EXPLICITLY toward beta's intent instead of guessing:
              # take beta's blob where beta has one, honour beta's deletion where it does not.
              while IFS= read -r p; do
                [ -n "$p" ] || continue
                if git cat-file -e "beta:$p" 2>/dev/null; then
                  git checkout beta -- "$p"
                else
                  git rm -q --ignore-unmatch -- "$p"
                fi
              done < <(git diff --name-only --diff-filter=U)

              # FAIL CLOSED. Anything still unmerged, or any conflict marker left anywhere in the
              # tracked tree, aborts the promotion. A week of beta sitting unpromoted is a known,
              # visible, recoverable state; production serving a half-resolved merge is not.
              STILL="$(git diff --name-only --diff-filter=U || true)"
              if [ -n "$STILL" ]; then
                echo "::error::Unresolved paths remain after force-resolve; refusing to promote:"
                echo "$STILL"
                exit 1
              fi
              git add -A
              if git grep -nI -e '^<<<<<<< ' -e '^=======$' -e '^>>>>>>> ' -- . ; then
                echo "::error::Conflict markers present in the merged tree; refusing to promote."
                exit 1
              fi
              git commit -m "chore: weekly auto-merge of beta into main (conflicts force-resolved, beta won)"
              RESULT="conflicts-force-resolved"
            fi
          fi

          # Belt and braces: the marker scan also runs for the clean and -X theirs paths, because
          # a marker can reach main via a beta commit that was pushed with --no-verify.
          if git grep -nI -e '^<<<<<<< ' -e '^>>>>>>> ' -- . ; then
            echo "::error::Conflict markers present after merge; refusing to promote."
            exit 1
          fi

          MERGED_SHA="$(git rev-parse HEAD)"

          {
            echo "result=$RESULT"
            echo "merged_sha=$MERGED_SHA"
            echo "commits<<__EOF__"
            echo "$COMMITS"
            echo "__EOF__"
            echo "conflicts<<__EOF__"
            echo "$CONFLICTS"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      # The repo's only correctness gate. It lints every inline text/babel block plus the two
      # component twins (JSX-aware no-undef and friends) and enforces the CDN version lock and the
      # ?v= cache-buster lockstep — i.e. exactly the class of defect that put the Contacts tab on
      # "Loading…" for every tenant (RANK -> STATUS_RANK, one missed usage). It ran ONLY in the
      # developer-side .githooks/pre-push hook, which a runner does not have configured, so the
      # commit that reaches every paying tenant was never linted, and any beta commit pushed with
      # --no-verify reached production unchecked. Runs BEFORE the push, and a failure means no
      # promotion.
      - name: Set up Node for the preflight gate
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Preflight gate (blocks the promotion on failure)
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run preflight

      - name: Push main
        run: git push origin main

      - name: Report to monday.com
        if: ${{ always() && env.MONDAY_API_TOKEN != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
          RESULT: ${{ steps.merge.outputs.result }}
          MERGED_SHA: ${{ steps.merge.outputs.merged_sha }}
          COMMITS: ${{ steps.merge.outputs.commits }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"

          if [ "$JOB_STATUS" != "success" ]; then
            HEADER="[FAILED] Beta-&gt;Main merge did not complete"
          elif [ "$RESULT" = "clean" ]; then
            HEADER="[OK] Beta-&gt;Main merged cleanly"
          else
            HEADER="[CONFLICTS RESOLVED] Beta-&gt;Main merged (beta won)"
          fi

          esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }

          BODY="<b>${HEADER}</b><br>${DATE}<br>Repo: ${REPO}<br>Result: ${RESULT:-n/a}<br>Merge commit: ${MERGED_SHA:-n/a}<br><br><b>Commits promoted from beta:</b><br>"
          BODY="${BODY}$(printf '%s\n' "$COMMITS" | esc | sed 's/$/<br>/')"
          if [ -n "${CONFLICTS:-}" ]; then
            BODY="${BODY}<br><b>Files that conflicted (auto-resolved in beta's favor - please review):</b><br>"
            BODY="${BODY}$(printf '%s\n' "$CONFLICTS" | esc | sed 's/$/<br>/')"
          fi
          BODY="${BODY}<br><a href=\"${RUN_URL}\">View the workflow run</a>"

          QUERY='mutation ($item: ID!, $body: String!) { create_update (item_id: $item, body: $body) { id } }'
          PAYLOAD="$(jq -n --arg q "$QUERY" --arg item "$MONDAY_ITEM_ID" --arg body "$BODY" '{query:$q, variables:{item:$item, body:$body}}')"

          RESP="$(curl -sS https://api.monday.com/v2 -H "Authorization: $MONDAY_API_TOKEN" -H "Content-Type: application/json" -d "$PAYLOAD")"
          echo "$RESP"
          echo "$RESP" | jq -e '.data.create_update.id' >/dev/null || { echo "monday.com update failed"; exit 1; }
