# .github/workflows/merge-beta-to-main.yml
#
# Every Monday: merge beta into main. The merge ALWAYS completes.
# On conflict, beta's version wins and the conflicted files are listed
# in the Projects report so nothing is silently overwritten.
# Runs on GitHub's servers - nothing needs to be open on your computer.
#
# Cron is UTC-only (no timezone). 10:00 UTC = 6am US Eastern (summer)
# / 5am (winter). Edit the cron to taste (https://crontab.guru).
#
# Reporting: posts an update onto the "Beta->main merge reports" item
# in the internal Projects module (the in-product Monday replacement,
# 2026-08-27) via the Supabase REST API. Requires the existing repo
# secret SUPABASE_SERVICE_ROLE_KEY (already used by the release-notes
# step). If that secret is missing, the merge still runs and only the
# report is skipped.

name: Weekly merge beta into main

on:
  schedule:
    - cron: "0 10 * * 1"   # 10:00 UTC every Monday
  workflow_dispatch: {}      # also runnable on demand from the Actions tab

concurrency:
  group: merge-beta-into-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  # pm_items.id of "Beta->main merge reports" (Roadmap board / Ops group) in the
  # internal Projects module - minted by the 2026-08-27 Monday import. A uuid, not
  # a secret. If Projects is ever reseeded, look the item up by that name.
  PM_MERGE_ITEM_ID: "e5777007-d882-44b0-ac0f-10ffe4c4e04b"

jobs:
  merge-beta-into-main:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge beta into main (auto-resolve, beta wins)
        id: merge
        run: |
          set -euo pipefail
          git fetch origin beta:beta

          # Cap with git's own -50, NEVER "| head -50". Under `set -o pipefail`,
          # head closes the pipe as soon as it has its 50 lines; once beta is
          # more than ~50 commits ahead git log is still writing, takes SIGPIPE,
          # and exits 141 - aborting the step before the merge ever runs. That
          # is what silently skipped the 2026-08-03 promotion (beta was 124
          # ahead). The bug is invisible on small weeks, so do not "simplify"
          # this back into a pipe.
          COMMITS="$(git log --oneline --no-decorate -50 main..beta)"
          if [ -z "$COMMITS" ]; then
            COMMITS="(nothing new on beta this week)"
          fi

          RESULT="clean"
          CONFLICTS=""

          if git merge --no-ff beta -m "chore: weekly auto-merge of beta into main"; then
            RESULT="clean"
          else
            CONFLICTS="$(git diff --name-only --diff-filter=U | sort -u)"
            git merge --abort
            if git merge --no-ff -X theirs beta -m "chore: weekly auto-merge of beta into main (conflicts auto-resolved, beta won)"; then
              RESULT="conflicts-resolved"
            else
              git checkout --theirs -- . 2>/dev/null || true
              git add -A
              git commit -m "chore: weekly auto-merge of beta into main (conflicts force-resolved, beta won)"
              RESULT="conflicts-force-resolved"
            fi
          fi

          git push origin main
          MERGED_SHA="$(git rev-parse HEAD)"

          {
            echo "result=$RESULT"
            echo "merged_sha=$MERGED_SHA"
            echo "commits<<__EOF__"
            echo "$COMMITS"
            echo "__EOF__"
            echo "conflicts<<__EOF__"
            echo "$CONFLICTS"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      # Release notes are published the moment work lands on BETA, carrying an "On beta for
      # testing" badge (status='beta', migration 103) so tenants can see and try things
      # before release. THIS is the moment they become true, so this is where they flip.
      #
      # Deliberately keyed to the merge above rather than to its own cron: a clock-based
      # flip would announce "Live" for code that never shipped on any week the merge failed
      # or was skipped — and this workflow has silently skipped a promotion before (see the
      # -50 / SIGPIPE note in the merge step). If the merge did not run, neither does this.
      #
      # Needs repo secret SUPABASE_SERVICE_ROLE_KEY. Without it the step SKIPS rather than
      # failing the run — the merge itself has already pushed and must not be reported as
      # broken — but it says so, and the Projects report below carries the outcome, which
      # is the channel the team actually reads.
      - name: Flip beta release notes to Live
        id: notes
        if: ${{ success() }}
        env:
          SUPABASE_URL: "https://jzeamjbhdrsbygdnphbm.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not set - release notes still say 'On beta for testing'."
            echo "notes_result=skipped (SUPABASE_SERVICE_ROLE_KEY not set)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PATCH ... ?status=eq.beta  -> every note that beta has now made real.
          # return=representation gives back the rows so we can report a real count.
          RESP="$(curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/release_notes?status=eq.beta" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"status":"shipped"}')" || {
              echo "::error::Could not reach Supabase to flip release notes."
              echo "notes_result=FAILED (network)" >> "$GITHUB_OUTPUT"
              exit 1
            }

          # A PostgREST error is a JSON OBJECT with .message; success is an ARRAY.
          if ! printf '%s' "$RESP" | jq -e 'type == "array"' >/dev/null 2>&1; then
            MSG="$(printf '%s' "$RESP" | jq -r '.message // .hint // "unknown error"' 2>/dev/null || echo "unparseable response")"
            echo "::error::Flipping release notes failed: ${MSG}"
            echo "notes_result=FAILED (${MSG})" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          COUNT="$(printf '%s' "$RESP" | jq 'length')"
          echo "Flipped ${COUNT} release note(s) from beta to Live."
          if [ "$COUNT" = "0" ]; then
            echo "notes_result=none waiting" >> "$GITHUB_OUTPUT"
          else
            echo "notes_result=${COUNT} note(s) now Live" >> "$GITHUB_OUTPUT"
          fi

      # Workstream 4 B3 (2026-10-09): Projects items that a commit's `Projects:` trailer put On Beta
      # move to Done once that commit is in this promotion. release-ci decides per item (only an item
      # whose newest On Beta commit is among the merged shas; anything set by hand is reported, not
      # moved). Skips with a warning while RELEASE_NOTES_FROM_GIT is not "on" or the secret is missing,
      # and never fails the run: the merge has already shipped.
      - name: Move On Beta items to Done
        id: onbeta
        if: ${{ success() }}
        env:
          RELEASE_CI_SECRET: ${{ secrets.RELEASE_CI_SECRET }}
          MODE: ${{ vars.RELEASE_NOTES_FROM_GIT }}
          FUNCTION_URL: "https://jzeamjbhdrsbygdnphbm.supabase.co/functions/v1/release-ci"
        run: |
          set -uo pipefail
          if [ -z "${RELEASE_CI_SECRET:-}" ] || [ "${MODE:-off}" != "on" ]; then
            echo "::warning::On Beta items were not moved (RELEASE_NOTES_FROM_GIT is '${MODE:-unset}', or RELEASE_CI_SECRET is missing)."
            echo "onbeta_result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The commits this merge brought in: first parent (main before) .. second parent (beta).
          # Capped with git's own --max-count, never a pipe into head (see the merge step's note).
          SHAS="$(git rev-list --max-count=5000 HEAD^1..HEAD^2)"
          BODY="$(printf '%s\n' "$SHAS" | jq -R 'select(length > 0)' | jq -s '{action: "released", mergedShas: .}')"
          RESP="$(curl -sS -X POST "$FUNCTION_URL" \
            -H "Content-Type: application/json" \
            -H "x-release-ci-key: ${RELEASE_CI_SECRET}" \
            -d "$BODY")" || {
              echo "::error::Could not reach release-ci to move On Beta items."
              echo "onbeta_result=FAILED (network)" >> "$GITHUB_OUTPUT"
              exit 0
            }
          if ! printf '%s' "$RESP" | jq -e '.ok == true' >/dev/null 2>&1; then
            MSG="$(printf '%s' "$RESP" | jq -r '.error // "unknown error"' 2>/dev/null || echo "unparseable response")"
            echo "::error::release-ci refused the On Beta move: ${MSG}"
            echo "onbeta_result=FAILED (${MSG})" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Counts only: item ids and titles stay out of this public log.
          SUMMARY="$(printf '%s' "$RESP" | jq -r '[.counts // {} | to_entries[] | "\(.value) \(.key)"] | join(", ")')"
          DRY="$(printf '%s' "$RESP" | jq -r 'if .dryRun then " (dry run: RELEASE_CI_WRITES is off)" else "" end')"
          echo "On Beta items: ${SUMMARY:-none on beta}${DRY}"
          echo "onbeta_result=${SUMMARY:-none on beta}${DRY}" >> "$GITHUB_OUTPUT"

      - name: Report to Projects
        if: ${{ always() && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
          NOTES_RESULT: ${{ steps.notes.outputs.notes_result }}
          ONBETA_RESULT: ${{ steps.onbeta.outputs.onbeta_result }}
          RESULT: ${{ steps.merge.outputs.result }}
          MERGED_SHA: ${{ steps.merge.outputs.merged_sha }}
          COMMITS: ${{ steps.merge.outputs.commits }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUPABASE_URL: "https://jzeamjbhdrsbygdnphbm.supabase.co"
        run: |
          set -euo pipefail
          DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"

          if [ "$JOB_STATUS" != "success" ]; then
            HEADER="[FAILED] Beta->Main merge did not complete"
          elif [ "$RESULT" = "clean" ]; then
            HEADER="[OK] Beta->Main merged cleanly"
          else
            HEADER="[CONFLICTS RESOLVED] Beta->Main merged (beta won)"
          fi

          # Plain text - pm_updates bodies render pre-wrap in the Projects item modal.
          BODY="${HEADER}
          ${DATE}
          Repo: ${REPO}
          Result: ${RESULT:-n/a}
          Merge commit: ${MERGED_SHA:-n/a}
          Release notes: ${NOTES_RESULT:-not attempted}
          On Beta items: ${ONBETA_RESULT:-not attempted}

          Commits promoted from beta:
          ${COMMITS}"
          if [ -n "${CONFLICTS:-}" ]; then
            BODY="${BODY}

          Files that conflicted (auto-resolved in beta's favor - please review):
          ${CONFLICTS}"
          fi
          BODY="${BODY}

          Run: ${RUN_URL}"

          PAYLOAD="$(jq -n --arg item "$PM_MERGE_ITEM_ID" --arg body "$BODY" \
            '{item_id:$item, body:$body, client_visible:false, author_email:"github-actions"}')"

          RESP="$(curl -sS -X POST "${SUPABASE_URL}/rest/v1/pm_updates" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "$PAYLOAD")"
          echo "$RESP" | jq -e '.[0].id' >/dev/null || { echo "Projects report failed: $RESP"; exit 1; }
          echo "Reported to Projects."
