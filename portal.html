// ─── Ramps (Options tab → its own section, below Doors) ───
// Two modes: SIMPLE (one ramp, auto-sized to the door it attaches to; priced each or per-foot)
// or CUSTOM (a catalog of ramp styles, category='ramp' in fixture_items — like doors, no swing/
// operation). Mode + simple config live in client_settings; custom styles in fixture_items.
function RampsView({ viewingLabel = null, clientId = null }) {
  const scoped = (body) => (viewingLabel && clientId ? { ...body, targetClientId: clientId } : body);
  const [mode, setMode] = useState("simple");
  const [enabled, setEnabled] = useState(true);   // does this client OFFER a ramp at all
  const [simple, setSimple] = useState({ price: "", method: "each", image_url: null, show_image_on_estimate: true });
  const [rows, setRows] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [imgBusyIdx, setImgBusyIdx] = useState(null);
  const [simpleImgBusy, setSimpleImgBusy] = useState(false);
  const [imgFileKey, setImgFileKey] = useState(0);

  const load = async () => {
    const { data, error } = await sb.functions.invoke("portal-settings", { body: scoped({ action: "catalog" }) });
    if (error || (data && data.error)) { setMsg({ err: (error && error.message) || data.error }); return; }
    const rs = data.rampSettings || {};
    setMode(rs.mode === "custom" ? "custom" : "simple");
    setEnabled(rs.enabled !== false);
    setSimple({ price: rs.price != null ? String(rs.price) : "", method: rs.method || "each", image_url: rs.imageUrl || null, show_image_on_estimate: rs.showImage !== false });
    const ramps = (data.fixtures || []).filter((f) => (f.category || "") === "ramp");
    setRows(ramps.map((d) => ({
      id: d.id, name: d.name || "", plan_label: d.plan_label || "", show_image_on_estimate: d.show_image_on_estimate !== false,
      width_in: d.width_in != null ? fmtFtIn(d.width_in) : "", height_in: d.height_in != null ? fmtFtIn(d.height_in) : "",
      price: d.price != null ? String(d.price) : "", image_url: d.image_url || null, active: d.active !== false, archived: d.archived === true,
    })));
    setLoaded(true);
  };
  useEffect(() => { load(); }, []);

  const setRow = (i, patch) => setRows((rs) => rs.map((r, j) => j === i ? { ...r, ...patch } : r));
  const addRow = () => setRows((rs) => [...rs, { id: null, name: "", plan_label: "", show_image_on_estimate: true, width_in: "", height_in: "", price: "", image_url: null, active: true, archived: false }]);
  const removeRow = (i) => setRows((rs) => rs.filter((_, j) => j !== i));

  const ALLOWED_IMG = ["image/jpeg", "image/png", "image/webp", "image/gif"];
  const uploadImg = async (file) => {
    const base64 = await new Promise((res, rej) => { const r = new FileReader(); r.onerror = () => rej(new Error("Could not read that image.")); r.onload = () => res(r.result); r.readAsDataURL(file); });
    const { data, error } = await sb.functions.invoke("portal-settings", { body: scoped({ action: "upload_fixture_image", imageBase64: base64, imageContentType: file.type || "image/jpeg" }) });
    if (error || (data && data.error)) throw new Error((error && error.message) || data.error);
    return data.url;
  };
  const guardImg = (file) => { if (!ALLOWED_IMG.includes(file.type)) { setMsg({ err: "Use a JPG, PNG, WEBP or GIF image." }); return false; } if (file.size > 3_000_000) { setMsg({ err: "Image too large (max 3MB)." }); return false; } return true; };
  const onRowImg = async (i, file) => {
    if (!file) return; if (!guardImg(file)) { setImgFileKey((k) => k + 1); return; }
    setImgBusyIdx(i); setMsg(null);
    try { const url = await uploadImg(file); setRow(i, { image_url: url }); setMsg({ ok: "Photo added — click Save ramps to apply." }); } catch (e) { setMsg({ err: e.message }); }
    setImgBusyIdx(null); setImgFileKey((k) => k + 1);
  };
  const onSimpleImg = async (file) => {
    if (!file) return; if (!guardImg(file)) { setImgFileKey((k) => k + 1); return; }
    setSimpleImgBusy(true); setMsg(null);
    try { const url = await uploadImg(file); setSimple((s) => ({ ...s, image_url: url })); setMsg({ ok: "Photo added — click Save ramps to apply." }); } catch (e) { setMsg({ err: e.message }); }
    setSimpleImgBusy(false); setImgFileKey((k) => k + 1);
  };

  const save = async () => {
    if (viewingLabel && mode === "custom" && !window.confirm(`Replace ${viewingLabel}'s ENTIRE ramp list with these ${rows.length} ramp style(s)?

Anything not shown here will be removed.`)) return;
    setBusy(true); setMsg(null);
    try {
      const r1 = await sb.functions.invoke("portal-settings", { body: scoped({ action: "save_ramp_settings", mode, enabled, price: simple.price, method: simple.method, imageUrl: simple.image_url || null, showImage: simple.show_image_on_estimate !== false }) });
      if (r1.error || (r1.data && r1.data.error)) throw new Error((r1.error && r1.error.message) || r1.data.error);
      if (mode === "custom") {
        const ramps = rows.map((r, i) => ({ id: r.id || undefined, name: r.name, planLabel: r.plan_label, showImageOnEstimate: r.show_image_on_estimate !== false, widthIn: ftInToInches(r.width_in), heightIn: ftInToInches(r.height_in), price: r.price, imageUrl: r.image_url || null, active: r.active !== false, archived: r.archived === true, sortOrder: i }));
        const r2 = await sb.functions.invoke("portal-settings", { body: scoped({ action: "save_ramps", ramps }) });
        if (r2.error || (r2.data && r2.data.error)) throw new Error((r2.error && r2.error.message) || r2.data.error);
        const skipped = (r2.data && r2.data.skipped) || [];
        setMsg({ ok: `Saved ${(r2.data && r2.data.saved) || 0} ramp style(s)` + ((r2.data && r2.data.deleted) ? `, removed ${r2.data.deleted}` : "") + (skipped.length ? `, ${skipped.length} skipped` : "") + ".", skipped });
      } else { setMsg({ ok: "Simple ramp saved." }); }
      await load();
    } catch (e) { setMsg({ err: e.message }); }
    setBusy(false);
  };

  const errStyle = { background: "#FEF2F2", border: "1px solid #FECACA", borderRadius: 8, padding: "9px 13px", color: "#DC2626", fontSize: 13, fontWeight: 600, marginBottom: 12 };
  const okStyle = { background: "#F0FDF4", border: "1px solid #BBF7D0", borderRadius: 8, padding: "9px 13px", color: "#15803D", fontSize: 13, fontWeight: 600, marginBottom: 12 };
  const thumb = { width: 48, height: 36, borderRadius: 4, background: "#F1F5F9", objectFit: "cover", flexShrink: 0, border: "1px solid #E2E8F0" };
  const cbx = (checked, onChange) => <input type="checkbox" checked={!!checked} onChange={onChange} style={{ width: 16, height: 16, cursor: "pointer", accentColor: DOOR_MINT }} />;
  const sizeInput = (i, field, ph) => <input type="text" value={rows[i][field]} placeholder={ph} onChange={(e) => setRow(i, { [field]: e.target.value.replace(/\s/g, "") })} style={{ ...S.input, width: 64, minWidth: 0, textAlign: "center" }} />;
  const imgCell = (url, busyOn, onPick, onRemove) => url
    ? <div style={{ display: "flex", alignItems: "center", gap: 6 }}><img src={url} alt="" style={thumb} /><button onClick={onRemove} disabled={busy || busyOn} style={S.btn("#F1F5F9", "#334155")}>Remove</button></div>
    : <label style={{ ...S.btn("#F1F5F9", "#334155"), cursor: busyOn ? "default" : "pointer", display: "inline-block", whiteSpace: "nowrap" }}>{busyOn ? "Uploading…" : "Add image"}<input key={imgFileKey} type="file" accept="image/png,image/jpeg,image/webp,image/gif" disabled={busyOn} style={{ display: "none" }} onChange={onPick} /></label>;
  const modeCard = (m, title, text) => (
    <div onClick={() => setMode(m)} style={{ border: `2px solid ${mode === m ? ACCENT : "#E2E8F0"}`, background: mode === m ? "#F5F5FF" : "#FFF", borderRadius: 12, padding: "12px 14px", cursor: "pointer", display: "flex", gap: 10, alignItems: "flex-start" }}>
      <div style={{ width: 16, height: 16, borderRadius: "50%", border: `2px solid ${mode === m ? ACCENT : "#CBD5E1"}`, flex: "0 0 auto", marginTop: 2, position: "relative" }}>{mode === m && <div style={{ position: "absolute", inset: 3, borderRadius: "50%", background: ACCENT }} />}</div>
      <div><div style={{ fontWeight: 700, fontSize: 13.5, color: "#1E293B" }}>{title}</div><div style={{ fontSize: 12, color: "#64748B", marginTop: 2, lineHeight: 1.45 }}>{text}</div></div>
    </div>
  );

  return (
    <>
      {msg && msg.err && <div style={errStyle}>{msg.err}</div>}
      {msg && msg.ok && <div style={okStyle}>{msg.ok}</div>}
      <div style={S.card}>
        <div style={S.h2}>Ramps</div>
        <p style={{ fontSize: 13, color: "#64748B", marginBottom: 14, lineHeight: 1.5 }}>
          Pick how ramps work. <b>Simple</b> is one ramp that's automatically the width of the door it attaches to — you just set
          the price. <b>Custom ramp styles</b> is a catalog with its own sizes and prices, like doors. Enter sizes in feet/inches (8', 6'3", 36").
        </p>
        {!loaded ? <div style={{ fontSize: 13, color: "#94A3B8" }}>Loading…</div> : (<>
          <label style={{ display: "inline-flex", alignItems: "center", gap: 8, marginBottom: 14, fontSize: 14, fontWeight: 700, color: "#334155", cursor: "pointer" }}>
            <input type="checkbox" checked={enabled} onChange={(e) => setEnabled(e.target.checked)} style={{ width: 18, height: 18, cursor: "pointer", accentColor: DOOR_MINT }} />
            Offer a ramp on your buildings
          </label>
          {!enabled && <div style={{ fontSize: 12.5, color: "#B45309", background: "#FEF3C7", border: "1px solid #FDE68A", borderRadius: 8, padding: "8px 12px", marginBottom: 14 }}>Ramps are turned off — customers can't add one to a new build. Any ramp already on a saved design still shows and prices as before. (Click <b>Save ramps</b> to apply.)</div>}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 20, opacity: enabled ? 1 : 0.5, pointerEvents: enabled ? "auto" : "none" }}>
            {modeCard("simple", "Simple ramp", "One ramp, automatically the width of the door it attaches to. No sizes to manage.")}
            {modeCard("custom", "Custom ramp styles", "A catalog of ramp styles with their own sizes, prices, and photos.")}
          </div>

          {mode === "simple" ? (
            <div style={{ display: "flex", gap: 18, flexWrap: "wrap", alignItems: "flex-end" }}>
              <div><div style={{ fontSize: 12, color: "#64748B", fontWeight: 600, marginBottom: 5 }}>How it's priced</div>
                <select value={simple.method} onChange={(e) => setSimple((s) => ({ ...s, method: e.target.value }))} style={{ ...S.input, width: 210 }}>
                  <option value="each">each (per ramp)</option><option value="per_ft">per foot of door width</option>
                </select></div>
              <div><div style={{ fontSize: 12, color: "#64748B", fontWeight: 600, marginBottom: 5 }}>Price</div>
                <div style={{ position: "relative", width: 130 }}><span style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)", color: "#94A3B8" }}>$</span><input type="number" min="0" step="any" value={simple.price} onChange={(e) => setSimple((s) => ({ ...s, price: e.target.value }))} style={{ ...S.input, width: 130, paddingLeft: 22 }} /></div></div>
              <div><div style={{ fontSize: 12, color: "#64748B", fontWeight: 600, marginBottom: 5 }}>Photo (optional)</div>{imgCell(simple.image_url, simpleImgBusy, (e) => onSimpleImg(e.target.files && e.target.files[0]), () => setSimple((s) => ({ ...s, image_url: null })))}</div>
              <label style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 13, color: "#334155", cursor: "pointer" }}>{cbx(simple.show_image_on_estimate, (e) => setSimple((s) => ({ ...s, show_image_on_estimate: e.target.checked })))} On estimate</label>
            </div>
          ) : (
            <>
              {rows.length === 0 ? <div style={{ fontSize: 13, color: "#64748B", marginBottom: 14 }}>No ramp styles yet — click <b>Add ramp style</b> below.</div> : (
                <div style={{ overflowX: "auto", marginBottom: 14 }}>
                  <table style={{ width: "100%", borderCollapse: "collapse" }}>
                    <thead><tr>
                      <th style={S.th}>Photo</th><th style={S.th}>On estimate</th><th style={S.th}>Style</th>
                      <th style={S.th}>Label <span style={{ fontWeight: 400, color: "#94A3B8" }}>on plan</span></th>
                      <th style={S.th}>Size (W × L)</th><th style={S.th}>Price (USD)</th><th style={S.th}>Active</th><th style={S.th}></th>
                    </tr></thead>
                    <tbody>
                      {rows.map((r, i) => ({ r, i })).sort((a, b) => (a.r.archived ? 1 : 0) - (b.r.archived ? 1 : 0)).map(({ r, i }) => (
                        <tr key={r.id || `new-${i}`} style={r.archived ? { opacity: 0.55 } : undefined}>
                          <td style={S.td}>{imgCell(r.image_url, imgBusyIdx === i, (e) => onRowImg(i, e.target.files && e.target.files[0]), () => setRow(i, { image_url: null }))}</td>
                          <td style={{ ...S.td, textAlign: "center" }}>{cbx(r.show_image_on_estimate, (e) => setRow(i, { show_image_on_estimate: e.target.checked }))}</td>
                          <td style={S.td}><input type="text" value={r.name} placeholder="e.g. Aluminum ramp" onChange={(e) => setRow(i, { name: e.target.value })} style={{ ...S.input, width: "100%", minWidth: 120, boxSizing: "border-box" }} /></td>
                          <td style={S.td}><input type="text" value={r.plan_label} placeholder="RMP" maxLength={12} onChange={(e) => setRow(i, { plan_label: e.target.value })} style={{ ...S.input, width: 70, minWidth: 0, boxSizing: "border-box", textAlign: "center" }} /></td>
                          <td style={S.td}><div style={{ display: "flex", alignItems: "center", gap: 5 }}>{sizeInput(i, "width_in", '48"')}<span style={{ color: "#94A3B8" }}>×</span>{sizeInput(i, "height_in", "3'")}</div></td>
                          <td style={S.td}><div style={{ display: "flex", alignItems: "center", gap: 3 }}><span style={{ color: "#94A3B8" }}>$</span><input type="number" min="0" step="any" value={r.price} placeholder="0" onChange={(e) => setRow(i, { price: e.target.value })} style={{ ...S.input, width: 90, minWidth: 0 }} /></div></td>
                          <td style={{ ...S.td, textAlign: "center" }}>{cbx(r.active, (e) => setRow(i, { active: e.target.checked }))}</td>
                          <td style={{ ...S.td, textAlign: "center", whiteSpace: "nowrap" }}><button onClick={() => setRow(i, { archived: !r.archived })} title={r.archived ? "Restore to active" : "Archive: retire from new builds, keep on existing designs"} style={S.btn(r.archived ? "#FEF3C7" : "#F1F5F9", r.archived ? "#B45309" : "#64748B")}>{r.archived ? "Unarchive" : "Archive"}</button>{" "}<button onClick={() => removeRow(i)} style={S.btn("#FEF2F2", "#DC2626")}>✕</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
              <button onClick={addRow} style={S.btn("#1E293B", "#FFF")}>+ Add ramp style</button>
              <span style={{ fontSize: 12, color: "#94A3B8", marginLeft: 10 }}>Same Style name across rows = one style (customer picks the size). Ramps don't swing.</span>
            </>
          )}

          <div style={{ display: "flex", marginTop: 20 }}>
            <div style={{ flex: 1 }} />
            <button onClick={save} disabled={busy} style={S.btn(busy ? "#9CA3AF" : ACCENT, "#FFF")}>{busy ? "Saving…" : "Save ramps"}</button>
          </div>
        </>)}
        {msg && msg.skipped && msg.skipped.length > 0 && (
          <div style={{ marginTop: 12, fontSize: 13 }}>
            <div style={{ color: "#B91C1C", fontWeight: 700 }}>{msg.skipped.length} ramp(s) skipped:</div>
            <ul style={{ margin: "4px 0 0 18px", color: "#B91C1C", maxHeight: 160, overflow: "auto" }}>{msg.skipped.slice(0, 30).map((s, i) => <li key={i}>{s}</li>)}</ul>
          </div>
        )}
      </div>
    </>
  );
}

// ─── Windows (Options tab → its own section, below Ramps) ───
// A straight catalog like doors, minus swing/operation (windows don't swing). category='window'
// in fixture_items; height_in holds the window HEIGHT. Full-list-replace save via save_windows.
function WindowsView({ viewingLabel = null, clientId = null }) {
  const scoped = (body) => (viewingLabel && clientId ? { ...body, targetClientId: clientId } : body);
  const [rows, setRows] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [imgBusyIdx, setImgBusyIdx] = useState(null);
  const [imgFileKey, setImgFileKey] = useState(0);
  const [sort, setSort] = useState({ key: null, dir: 1 });

  const load = async () => {
    const { data, error } = await sb.functions.invoke("portal-settings", { body: scoped({ action: "catalog" }) });
    if (error || (data && data.error)) { setMsg({ err: (error && error.message) || data.error }); return; }
    const wins = (data.fixtures || []).filter((f) => (f.category || "") === "window");
    setRows(wins.map((d) => ({
      id: d.id, name: d.name || "", plan_label: d.plan_label || "", show_image_on_estimate: d.show_image_on_estimate !== false,
      width_in: d.width_in != null ? fmtFtIn(d.width_in) : "",
      height_in: d.height_in != null ? fmtFtIn(d.height_in) : "",
      price: d.price != null ? String(d.price) : "",
      image_url: d.image_url || null, active: d.active !== false, archived: d.archived === true,
    })));
    setLoaded(true);
  };
  useEffect(() => { load(); }, []);

  const setRow = (i, patch) => setRows((rs) => rs.map((r, j) => j === i ? { ...r, ...patch } : r));
  const addRow = () => setRows((rs) => [...rs, { id: null, name: "", plan_label: "", show_image_on_estimate: true, width_in: "", height_in: "", price: "", image_url: null, active: true, archived: false }]);
  const removeRow = (i) => setRows((rs) => rs.filter((_, j) => j !== i));

  const sortBy = (key, getVal) => setSort((s) => {
    const dir = s.key === key ? -s.dir : 1;
    setRows((rs) => rs.map((r) => r).sort((a, b) => { const av = getVal(a), bv = getVal(b); return (av < bv ? -1 : av > bv ? 1 : 0) * dir; }));
    return { key, dir };
  });

  const ALLOWED_IMG = ["image/jpeg", "image/png", "image/webp", "image/gif"];
  const onRowImg = async (i, file) => {
    if (!file) return;
    if (!ALLOWED_IMG.includes(file.type)) { setMsg({ err: "Use a JPG, PNG, WEBP or GIF image." }); setImgFileKey((k) => k + 1); return; }
    if (file.size > 3_000_000) { setMsg({ err: "Image too large (max 3MB)." }); setImgFileKey((k) => k + 1); return; }
    setImgBusyIdx(i); setMsg(null);
    try {
      const base64 = await new Promise((res, rej) => { const r = new FileReader(); r.onerror = () => rej(new Error("Could not read that image.")); r.onload = () => res(r.result); r.readAsDataURL(file); });
      const { data, error } = await sb.functions.invoke("portal-settings", { body: scoped({ action: "upload_fixture_image", imageBase64: base64, imageContentType: file.type || "image/jpeg" }) });
      if (error || (data && data.error)) throw new Error((error && error.message) || data.error);
      setRow(i, { image_url: data.url });
      setMsg({ ok: "Photo added — click “Save windows” to apply." });
    } catch (e) { setMsg({ err: e.message }); }
    setImgBusyIdx(null); setImgFileKey((k) => k + 1);
  };

  const save = async () => {
    if (viewingLabel && !window.confirm(`Replace ${viewingLabel}'s ENTIRE window list with these ${rows.length} window(s)?

Anything not shown here will be removed from their account.`)) return;
    setBusy(true); setMsg(null);
    try {
      const windows = rows.map((r, i) => ({
        id: r.id || undefined, name: r.name, planLabel: r.plan_label, showImageOnEstimate: r.show_image_on_estimate !== false,
        widthIn: ftInToInches(r.width_in), heightIn: ftInToInches(r.height_in), price: r.price,
        imageUrl: r.image_url || null, active: r.active !== false, archived: r.archived === true, sortOrder: i,
      }));
      const { data, error } = await sb.functions.invoke("portal-settings", { body: scoped({ action: "save_windows", windows }) });
      if (error || (data && data.error)) throw new Error((error && error.message) || data.error);
      await load();
      const skipped = data.skipped || [];
      setMsg({ ok: `Saved ${data.saved || 0} window(s)` + (data.deleted ? `, removed ${data.deleted}` : "") + (skipped.length ? `, ${skipped.length} skipped` : "") + ".", skipped });
    } catch (e) { setMsg({ err: e.message }); }
    setBusy(false);
  };

  const errStyle = { background: "#FEF2F2", border: "1px solid #FECACA", borderRadius: 8, padding: "9px 13px", color: "#DC2626", fontSize: 13, fontWeight: 600, marginBottom: 12 };
  const okStyle = { background: "#F0FDF4", border: "1px solid #BBF7D0", borderRadius: 8, padding: "9px 13px", color: "#15803D", fontSize: 13, fontWeight: 600, marginBottom: 12 };
  const thumb = { width: 48, height: 36, borderRadius: 4, background: "#F1F5F9", objectFit: "cover", flexShrink: 0, border: "1px solid #E2E8F0" };
  const cbx = (i, field) => <input type="checkbox" checked={!!rows[i][field]} onChange={(e) => setRow(i, { [field]: e.target.checked })} style={{ width: 16, height: 16, cursor: "pointer", accentColor: DOOR_MINT }} />;
  const numInput = (i, field, ph, w) => <input type="number" min="0" step="any" value={rows[i][field]} placeholder={ph} onChange={(e) => setRow(i, { [field]: e.target.value })} style={{ ...S.input, width: w, minWidth: 0 }} />;
  const sizeInput = (i, field, ph, w) => <input type="text" value={rows[i][field]} placeholder={ph} onChange={(e) => setRow(i, { [field]: e.target.value.replace(/\s/g, "") })} style={{ ...S.input, width: w, minWidth: 0, textAlign: "center" }} />;
  const caret = (key) => sort.key === key ? (sort.dir > 0 ? " ▲" : " ▼") : "";
  const sortableTh = (label, key, getVal) => <th style={{ ...S.th, cursor: "pointer", whiteSpace: "nowrap" }} onClick={() => sortBy(key, getVal)}>{label}{caret(key)}</th>;

  return (
    <>
      {msg && msg.err && <div style={errStyle}>{msg.err}</div>}
      {msg && msg.ok && <div style={okStyle}>{msg.ok}</div>}
      <div style={S.card}>
        <div style={S.h2}>Windows</div>
        <p style={{ fontSize: 13, color: "#64748B", marginBottom: 14, lineHeight: 1.5 }}>
          The windows your customers can drop onto a building. Give each one a <b>Style</b> name (e.g. Slider, Single-hung,
          Picture), a <b>size</b> (width × height), and a <b>price</b>. Add a <b>photo</b> to show the window to the customer
          (and, later, in the 3D view) — tick <b>On estimate</b> to also attach that photo to the window's line on the
          customer's estimate. The <b>Label</b> is the short initials drawn on the window on the floor plan (e.g. SL, DH) —
          leave it blank to auto-use the name. <b>Active</b> shows/hides it. Click a column heading to sort. Enter sizes in
          feet/inches — <b>3'</b>, <b>2'6"</b>, or <b>36"</b> (no spaces). Rows that share the EXACT same <b>Style</b> name are
          one style: on the plan the customer picks the style, then its size.
        </p>
        {!loaded ? <div style={{ fontSize: 13, color: "#94A3B8" }}>Loading…</div> : rows.length === 0 ? (
          <div style={{ fontSize: 13, color: "#64748B", marginBottom: 14 }}>No windows yet — click <b>Add window</b> below to create your first one.</div>
        ) : (
          <div style={{ overflowX: "auto", marginBottom: 14 }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead><tr>
                <th style={S.th}>Photo</th>
                <th style={S.th}>On estimate</th>
                {sortableTh("Style", "name", (r) => (r.name || "").toLowerCase())}
                <th style={S.th}>Label <span style={{ fontWeight: 400, color: "#94A3B8" }}>on plan</span></th>
                {sortableTh("Size (W × H)", "size", (r) => parseFtIn(r.width_in) || 0)}
                {sortableTh("Price (USD)", "price", (r) => Number(r.price) || 0)}
                {sortableTh("Active", "active", (r) => (r.active !== false ? 1 : 0))}
                <th style={S.th}></th>
              </tr></thead>
              <tbody>
                {rows.map((r, i) => ({ r, i })).sort((a, b) => (a.r.archived ? 1 : 0) - (b.r.archived ? 1 : 0)).map(({ r, i }) => (
                  <tr key={r.id || `new-${i}`} style={r.archived ? { opacity: 0.55 } : undefined}>
                    <td style={S.td}>
                      {r.image_url ? (
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          <img src={r.image_url} alt="" style={thumb} />
                          <button onClick={() => setRow(i, { image_url: null })} disabled={busy || imgBusyIdx === i} style={S.btn("#F1F5F9", "#334155")}>Remove</button>
                        </div>
                      ) : (
                        <label style={{ ...S.btn("#F1F5F9", "#334155"), cursor: imgBusyIdx === i ? "default" : "pointer", display: "inline-block", whiteSpace: "nowrap" }}>
                          {imgBusyIdx === i ? "Uploading…" : "Add image"}
                          <input key={imgFileKey} type="file" accept="image/png,image/jpeg,image/webp,image/gif" disabled={imgBusyIdx === i} style={{ display: "none" }} onChange={(e) => onRowImg(i, e.target.files && e.target.files[0])} />
                        </label>
                      )}
                    </td>
                    <td style={{ ...S.td, textAlign: "center" }}>{cbx(i, "show_image_on_estimate")}</td>
                    <td style={S.td}><input type="text" value={r.name} placeholder="e.g. Slider window" onChange={(e) => setRow(i, { name: e.target.value })} style={{ ...S.input, width: "100%", minWidth: 120, boxSizing: "border-box" }} /></td>
                    <td style={S.td}><input type="text" value={r.plan_label} placeholder="SL" maxLength={12} onChange={(e) => setRow(i, { plan_label: e.target.value })} style={{ ...S.input, width: 70, minWidth: 0, boxSizing: "border-box", textAlign: "center" }} /></td>
                    <td style={S.td}>
                      <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                        {sizeInput(i, "width_in", '36"', 64)}<span style={{ color: "#94A3B8" }}>×</span>{sizeInput(i, "height_in", '36"', 64)}
                      </div>
                    </td>
                    <td style={S.td}>
                      <div style={{ display: "flex", alignItems: "center", gap: 3 }}><span style={{ color: "#94A3B8" }}>$</span>{numInput(i, "price", "0", 90)}</div>
                    </td>
                    <td style={{ ...S.td, textAlign: "center" }}>{cbx(i, "active")}</td>
                    <td style={{ ...S.td, textAlign: "center", whiteSpace: "nowrap" }}><button onClick={() => setRow(i, { archived: !r.archived })} title={r.archived ? "Restore to active" : "Archive: retire from new builds, keep on existing designs"} style={S.btn(r.archived ? "#FEF3C7" : "#F1F5F9", r.archived ? "#B45309" : "#64748B")}>{r.archived ? "Unarchive" : "Archive"}</button>{" "}<button onClick={() => removeRow(i)} style={S.btn("#FEF2F2", "#DC2626")}>✕</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <button onClick={addRow} style={S.btn("#1E293B", "#FFF")}>+ Add window</button>
          <div style={{ flex: 1 }} />
          <button onClick={save} disabled={busy} style={S.btn(busy ? "#9CA3AF" : ACCENT, "#FFF")}>{busy ? "Saving…" : "Save windows"}</button>
        </div>
        {msg && msg.skipped && msg.skipped.length > 0 && (
          <div style={{ marginTop: 12, fontSize: 13 }}>
            <div style={{ color: "#B91C1C", fontWeight: 700 }}>{msg.skipped.length} window(s) skipped:</div>
            <ul style={{ margin: "4px 0 0 18px", color: "#B91C1C", maxHeight: 160, overflow: "auto" }}>
              {msg.skipped.slice(0, 30).map((s, i) => <li key={i}>{s}</li>)}
            </ul>
          </div>
        )}
      </div>
    </>
  );
}

function ColorsView({ viewingLabel = null }) {
  const [cat, setCat] = useState(null);
  // One flat list across all categories; a row's category is set by its flags:
  // paint = siding/trim (and not shingle/metal), shingle = shingle, metal = metal.
  const [rows, setRows] = useState([]);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [libOpen, setLibOpen] = useState(null);   // which section's library is open

  const load = async () => {
    const { data, error } = await sb.functions.invoke("portal-settings", { body: { action: "catalog" } });
    if (error || (data && data.error)) { setMsg({ err: (error && error.message) || data.error }); return; }
    setCat(data);
    setRows((data.colors || []).map((c) => ({
      id: c.id, label: c.label, siding: c.siding !== false, trim: c.trim !== false,
      shingle: !!c.shingle, metal: !!c.metal,
      allow_custom: !!c.allow_custom, is_default: !!c.is_default, active: c.active !== false,
      hex: c.hex || null, pricing_method: c.pricing_method || "each", rate: (c.rate != null ? String(c.rate) : "0"),
    })));
  };
  useEffect(() => { load(); }, []);

  const setRow = (gi, field, val) => setRows((rs) => rs.map((r, i) => i === gi ? { ...r, [field]: val } : r));
  // New rows are tagged for the section they're added from.
  const addRow = (preset, category) => setRows((rs) => [...rs, {
    id: null, label: preset ? preset.name : "",
    siding: category === "paint", trim: category === "paint",
    shingle: category === "shingle", metal: category === "metal",
    allow_custom: false, is_default: false, active: true, hex: preset ? preset.hex : null,
    pricing_method: "each", rate: "0",
  }]);
  const removeRow = (gi) => setRows((rs) => rs.filter((_, i) => i !== gi));
  // Swap two rows by their GLOBAL indices (callers pass same-section neighbors to reorder within a section).
  const swap = (gi, gj) => setRows((rs) => { if (gj < 0 || gj >= rs.length) return rs; const next = rs.slice(); [next[gi], next[gj]] = [next[gj], next[gi]]; return next; });

  // One save persists every section at once — the whole list is always sent, so the
  // server's "delete anything not in the payload" stays safe across categories.
  const save = async () => {
    // Full-list replace: the server removes any colour not in this payload. Harmless
    // on your own palette, not harmless on someone else's.
    if (viewingLabel && !window.confirm(`Replace ${viewingLabel}'s ENTIRE colour list with these ${rows.length} colour(s)?

Anything not shown here will be removed from their account.`)) return;
    setBusy(true); setMsg(null);
    try {
      const colors = rows.map((r, i) => ({
        id: r.id || undefined, label: r.label,
        siding: !!r.siding, trim: !!r.trim, shingle: !!r.shingle, metal: !!r.metal,
        allowCustom: !!r.allow_custom, isDefault: !!r.is_default, active: r.active !== false,
        sortOrder: i, hex: r.hex || null, pricingMethod: r.pricing_method || "each", rate: Number(r.rate) || 0,
      }));
      const { data, error } = await sb.functions.invoke("portal-settings", { body: { action: "save_colors", colors } });
      if (error || (data && data.error)) throw new Error((error && error.message) || data.error);
      await load();
      const skipped = data.skipped || [];
      setMsg({ ok: `Saved ${data.saved || 0} colour(s)` + (data.deleted ? `, removed ${data.deleted}` : "") + (skipped.length ? `, ${skipped.length} skipped` : "") + ".", skipped });
    } catch (e) { setMsg({ err: e.message }); }
    setBusy(false);
  };

  const errStyle = { background: "#FEF2F2", border: "1px solid #FECACA", borderRadius: 8, padding: "9px 13px", color: "#DC2626", fontSize: 13, fontWeight: 600, marginBottom: 12 };
  const okStyle = { background: "#F0FDF4", border: "1px solid #BBF7D0", borderRadius: 8, padding: "9px 13px", color: "#15803D", fontSize: 13, fontWeight: 600, marginBottom: 12 };
  const ctr = { ...S.td, padding: "8px 5px", textAlign: "center" };
  const tdc = { ...S.td, padding: "8px 5px" };
  const thc = { ...S.th, padding: "8px 5px", whiteSpace: "normal" };
  const chk = (gi, field) => <input type="checkbox" checked={!!rows[gi][field]} onChange={(e) => setRow(gi, field, e.target.checked)} style={{ width: 16, height: 16, cursor: "pointer" }} />;

  // Render one category card. `ckey` selects which rows show; `showST` adds the paint-only
  // Siding/Trim columns. Defined as a plain function (not a <Component/>) so inputs keep focus.
  const renderSection = (ckey, title, desc, showST) => {
    const entries = rows.map((r, gi) => ({ r, gi })).filter(({ r }) =>
      ckey === "paint" ? (!r.shingle && !r.metal) : ckey === "shingle" ? r.shingle : r.metal);
    // Each section quick-adds from its own supplier palette, not the shared paint set.
    const lib = ckey === "metal" ? METAL_LIBRARY : ckey === "shingle" ? SHINGLE_LIBRARY : COLOR_LIBRARY;
    return (
      <div style={S.card}>
        <div style={S.h2}>{title}</div>
        <p style={{ fontSize: 13, color: "#64748B", marginBottom: 14, lineHeight: 1.5 }}>{desc}</p>
        {entries.length === 0 ? (
          <div style={{ fontSize: 13, color: "#64748B", marginBottom: 12 }}>No colors yet — add one below or pick from the library.</div>
        ) : (
          <table style={{ width: "100%", tableLayout: "fixed", borderCollapse: "collapse", marginBottom: 14 }}>
            <colgroup>
              {showST ? (
                <>
                  <col style={{ width: "8%" }} /><col style={{ width: "7%" }} /><col style={{ width: "21%" }} />
                  <col style={{ width: "7%" }} /><col style={{ width: "7%" }} /><col style={{ width: "17%" }} /><col style={{ width: "11%" }} />
                  <col style={{ width: "8%" }} /><col style={{ width: "7%" }} /><col style={{ width: "7%" }} />
                </>
              ) : (
                <>
                  <col style={{ width: "9%" }} /><col style={{ width: "8%" }} /><col style={{ width: "29%" }} />
                  <col style={{ width: "22%" }} /><col style={{ width: "13%" }} />
                  <col style={{ width: "8%" }} /><col style={{ width: "7%" }} /><col style={{ width: "6%" }} />
                </>
              )}
            </colgroup>
            <thead><tr>
              <th style={thc}>Order</th><th style={thc}>Swatch</th><th style={thc}>Color name</th>
              {showST && <th style={thc}>Siding</th>}
              {showST && <th style={thc}>Trim</th>}
              <th style={thc}>How it’s priced</th><th style={thc}>Rate (USD)</th>
              <th style={thc}>Default</th><th style={thc}>Active</th><th style={thc}></th>
            </tr></thead>
            <tbody>
              {entries.map(({ r, gi }, pos) => (
                <tr key={r.id || `new-${gi}`}>
                  <td style={ctr}>
                    <button onClick={() => { if (pos > 0) swap(gi, entries[pos - 1].gi); }} disabled={pos === 0} style={{ ...S.btn("#F1F5F9", "#334155"), padding: "2px 7px" }}>▲</button>{" "}
                    <button onClick={() => { if (pos < entries.length - 1) swap(gi, entries[pos + 1].gi); }} disabled={pos === entries.length - 1} style={{ ...S.btn("#F1F5F9", "#334155"), padding: "2px 7px" }}>▼</button>
                  </td>
                  <td style={ctr}>
                    <input type="color" value={r.hex || "#CCCCCC"} onChange={(e) => setRow(gi, "hex", e.target.value)} title={r.hex || "Pick this color"}
                      style={{ width: 34, height: 26, padding: 0, border: "1px solid #CBD5E1", borderRadius: 4, background: "#FFF", cursor: "pointer" }} />
                  </td>
                  <td style={tdc}>
                    <input type="text" value={r.label} placeholder="e.g. Barn Red" onChange={(e) => setRow(gi, "label", e.target.value)} style={{ ...S.input, width: "100%", minWidth: 0, boxSizing: "border-box" }} />
                  </td>
                  {showST && <td style={ctr}>{chk(gi, "siding")}</td>}
                  {showST && <td style={ctr}>{chk(gi, "trim")}</td>}
                  <td style={tdc}>
                    <select value={r.pricing_method || "each"} onChange={(e) => setRow(gi, "pricing_method", e.target.value)} style={{ ...S.input, width: "100%", minWidth: 0, boxSizing: "border-box" }}>
                      {LP_METHODS.map((m) => <option key={m.value} value={m.value}>{m.label}</option>)}
                    </select>
                  </td>
                  <td style={ctr}>
                    <input type="number" min="0" step="0.01" value={r.rate ?? "0"} onChange={(e) => setRow(gi, "rate", e.target.value)} style={{ ...S.input, width: "100%", minWidth: 0, boxSizing: "border-box" }} />
                  </td>
                  <td style={ctr}>{chk(gi, "is_default")}</td>
                  <td style={ctr}>{chk(gi, "active")}</td>
                  <td style={ctr}>
                    <button onClick={() => removeRow(gi)} style={S.btn("#FEF2F2", "#DC2626")}>✕</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 4 }}>
          <button onClick={() => addRow(undefined, ckey)} style={S.btn("#1E293B", "#FFF")}>+ Add color</button>
          <button onClick={() => setLibOpen((o) => o === ckey ? null : ckey)} style={S.btn("#F1F5F9", "#334155")}>{libOpen === ckey ? "▴ Hide color library" : "▾ Quick-add from library"}</button>
          <div style={{ flex: 1 }} />
          <button onClick={save} disabled={busy} style={S.btn(busy ? "#9CA3AF" : ACCENT, "#FFF")}>{busy ? "Saving…" : "Save colors"}</button>
        </div>
        {libOpen === ckey && (
          <div style={{ marginTop: 12, padding: 12, background: "#F8FAFC", border: "1px solid #E2E8F0", borderRadius: 8 }}>
            <div style={{ fontSize: 12, color: "#64748B", marginBottom: 10 }}>Click a color to add it to this list (swatches are approximate — rename or set exact codes after adding). Then click <b>Save colors</b>.</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {lib.map((c) => (
                <button key={c.name} onClick={() => { addRow(c, ckey); setMsg({ ok: `Added “${c.name}” — click Save colors to apply.` }); }}
                  style={{ display: "flex", alignItems: "center", gap: 7, background: "#FFF", border: "1px solid #CBD5E1", borderRadius: 20, padding: "5px 12px 5px 6px", fontSize: 12, fontWeight: 600, color: "#334155", cursor: "pointer" }}>
                  <span style={{ width: 18, height: 18, borderRadius: "50%", background: c.hex, border: "1px solid rgba(0,0,0,0.15)", flexShrink: 0 }} />
                  {c.name}
                </button>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  };

  const paintDesc = (<>
    These are the colors your customers pick from for <b>paint</b> in the designer.
    Toggle <b>Siding</b> / <b>Trim</b> to control which dropdown a color appears in (a color can be in both).
    Set <b>How it’s priced</b> + a <b>Rate</b> to charge for a color — it’s added to the estimate automatically when picked
    (leave the rate at <b>0</b> for colors included in the base price). <b>Default</b> pre-selects a color; <b>Active</b> shows/hides it. Drag order with ▲▼.
    <br />Need color ideas? See <b>hayleypaint.com</b> or use the quick-add library below.
  </>);
  const shingleDesc = (<>
    Shingle roof colors your customers pick from when they choose a <b>Shingle</b> roof in the designer.
    Set <b>How it’s priced</b> + a <b>Rate</b> to charge (leave <b>0</b> if included). <b>Default</b> pre-selects one; <b>Active</b> shows/hides it. Drag order with ▲▼.
  </>);
  const metalDesc = (<>
    Metal roof colors your customers pick from when they choose a <b>Metal</b> roof in the designer.
    Set <b>How it’s priced</b> + a <b>Rate</b> to charge (leave <b>0</b> if included). <b>Default</b> pre-selects one; <b>Active</b> shows/hides it. Drag order with ▲▼.
  </>);

  return (
    <>
      {msg && msg.err && <div style={errStyle}>{msg.err}</div>}
      {msg && msg.ok && <div style={okStyle}>{msg.ok}</div>}
      {!cat ? <div style={S.card}><div style={{ fontSize: 13, color: "#94A3B8" }}>Loading…</div></div> : (
        <>
          {renderSection("paint", "Paint colors", paintDesc, true)}
          {renderSection("shingle", "Shingle colors", shingleDesc, false)}
          {renderSection("metal", "Metal colors", metalDesc, false)}
          {msg && msg.skipped && msg.skipped.length > 0 && (
            <div style={{ ...S.card, marginTop: 0, fontSize: 13 }}>
              <div style={{ color: "#B91C1C", fontWeight: 700 }}>{msg.skipped.length} color(s) skipped:</div>
              <ul style={{ margin: "4px 0 0 18px", color: "#B91C1C", maxHeight: 160, overflow: "auto" }}>
                {msg.skipped.slice(0, 30).map((s, i) => <li key={i}>{s}</li>)}
              </ul>
            </div>
          )}
        </>
      )}
    </>
  );
}

// ─── Feedback: bug reports + feature requests ───
// Submissions are filed into Monday (Bugs Queue / Feature Requests (Intake)) by the
// `portal-feedback` edge function, which ALSO records them in `feedback_submissions`
// so the submitter can see the thing they sent instead of it vanishing into Monday.
// Status and team replies come back via the `feedback-monday-webhook` function.
//
// This lives in the PORTAL only — never on the public designer. A submission is
// attributed to the signed-in user and their tenant, both resolved server-side from
// the JWT, which is what makes "who filed this, from which client portal" reliable.

// The client-facing status ladder (see migration 054). Monday's internal labels are
// mapped down to these by the sync function — never rendered raw.
const FB_STATUS = {
  submitted:   { label: "Submitted",       bg: "#F1F5F9", fg: "#475569" },
  in_review:   { label: "In review",       bg: "#FEF3C7", fg: "#B45309" },
  planned:     { label: "Planned",         bg: "#EEF2FF", fg: "#4F46E5" },
  in_progress: { label: "In progress",     bg: "#DBEAFE", fg: "#1D4ED8" },
  needs_info:  { label: "Needs your info", bg: "#FEE2E2", fg: "#B91C1C" },
  // The KEY is the stored value (migration 054's check constraint + both sync
  // functions) and must stay "shipped"; only this label is client-facing. Renamed to
  // "Completed" on 2026-07-27 to match what the team now calls it on the Monday board.
  shipped:     { label: "Completed",       bg: "#DCFCE7", fg: "#15803D" },
  declined:    { label: "Not planned",     bg: "#F1F5F9", fg: "#64748B" },
  duplicate:   { label: "Already tracked", bg: "#F3E8FF", fg: "#7E22CE" },
};
// Sort order for the Status column. Deliberately NOT alphabetical — sorting
// "Already tracked / In progress / In review / Not planned / Planned" by name is
// noise. Ascending walks the pipeline, with "Needs your info" pulled to the very top
// because it's the one state that's waiting on the CLIENT rather than on us.
const FB_STATUS_ORDER = ["needs_info", "submitted", "in_review", "planned", "in_progress", "shipped", "declined", "duplicate"];
const FB_STATUS_RANK = FB_STATUS_ORDER.reduce((m, k, i) => { m[k] = i; return m; }, {});

const fbBadge = (status) => {
  const m = FB_STATUS[status] || FB_STATUS.submitted;
  return <span style={{ background: m.bg, color: m.fg, fontSize: 10, fontWeight: 800, borderRadius: 999, padding: "3px 9px", textTransform: "uppercase", letterSpacing: 0.4, whiteSpace: "nowrap" }}>{m.label}</span>;
};

// Severity choices must match the Monday status labels exactly — portal-feedback
// drops any value the board doesn't know rather than erroring the whole push.
const FB_KINDS = {
  bug: {
    icon: "🐛", label: "Report an Issue", blurb: "Something broken or not working as expected",
    titleHint: "What went wrong?", detailHint: "What did you do, what did you expect, and what happened instead?",
    sevLabel: "How badly is this hurting you?",
    severities: ["Critical", "High", "Medium", "Low"], sevDefault: "Medium",
  },
  feature: {
    icon: "✨", label: "Request a Feature", blurb: "An idea or improvement you'd like to see",
    titleHint: "What would you like to be able to do?", detailHint: "Describe the feature and what it would let you get done.",
    sevLabel: "How important is this to you?",
    severities: ["Nice to have", "Would really help", "Critical for me"], sevDefault: "Would really help",
  },
};

const MAX_ATTACH_BYTES = 25 * 1024 * 1024;   // matches the bucket's file_size_limit

function FeedbackForm({ kind, clientId, onSubmitted, onBack }) {
  const cfg = FB_KINDS[kind];
  const [title, setTitle] = useState("");
  const [detail, setDetail] = useState("");
  const [severity, setSeverity] = useState(cfg.sevDefault);
  const [file, setFile] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const submit = async (e) => {
    e.preventDefault();
    if (!title.trim()) { setErr("Please give this a short title."); return; }
    if (file && file.size > MAX_ATTACH_BYTES) { setErr("That file is larger than 25 MB — please attach a smaller one."); return; }
    setBusy(true); setErr(null);
    try {
      // Upload first: the storage policy pins the object under this tenant's own
      // prefix, and the edge function re-checks the prefix before trusting the path.
      let attachmentPath = null;
      if (file) {
        const safe = file.name.replace(/[^\w.\-]+/g, "_").slice(-80);
        const path = clientId + "/" + crypto.randomUUID() + "-" + safe;
        const up = await sb.storage.from("feedback-attachments").upload(path, file, { contentType: file.type || undefined });
        if (up.error) throw new Error("Attachment upload failed: " + up.error.message);
        attachmentPath = path;
      }
      const { data, error } = await sb.functions.invoke("portal-feedback", {
        body: { action: "submit", kind, title: title.trim(), detail: detail.trim(), severity, attachmentPath },
      });
      if (error) throw error;
      if (data && data.error) throw new Error(data.error);
      onSubmitted(data && data.submission, data && data.pushed);
    } catch (e2) {
      setErr(e2.message || "Something went wrong — please try again.");
      setBusy(false);
    }
  };

  return (
    <form onSubmit={submit} style={{ padding: 16, display: "flex", flexDirection: "column", gap: 12 }}>
      {err && <div style={S.err}>{err}</div>}
      <div>
        <label style={S.lbl}>{cfg.titleHint}</label>
        <input style={S.input} value={title} onChange={(e) => setTitle(e.target.value)} maxLength={250} autoFocus placeholder="A one-line summary" />
      </div>
      <div>
        <label style={S.lbl}>Details</label>
        <textarea style={{ ...S.input, minHeight: 110, fontWeight: 500, resize: "vertical" }}
          value={detail} onChange={(e) => setDetail(e.target.value)} placeholder={cfg.detailHint} />
      </div>
      <div>
        <label style={S.lbl}>{cfg.sevLabel}</label>
        <select style={S.input} value={severity} onChange={(e) => setSeverity(e.target.value)}>
          {cfg.severities.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
      </div>
      <div>
        <label style={S.lbl}>Screenshot or video (optional)</label>
        <input type="file" accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/quicktime,video/webm"
          onChange={(e) => setFile(e.target.files && e.target.files[0] ? e.target.files[0] : null)}
          style={{ ...S.input, padding: "7px 10px", fontWeight: 500 }} />
        <div style={{ fontSize: 11, color: "#94A3B8", marginTop: 4 }}>A picture of the problem helps us fix it much faster. Max 25 MB.</div>
      </div>
      <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
        <button type="button" onClick={onBack} disabled={busy} style={{ ...S.btn("#FFF", "#475569"), border: "1px solid #CBD5E1" }}>Back</button>
        <button type="submit" disabled={busy} style={{ ...S.btn(ACCENT, "#FFF"), flex: 1, opacity: busy ? 0.6 : 1, cursor: busy ? "default" : "pointer" }}>
          {busy ? "Sending…" : "Send it"}
        </button>
      </div>
    </form>
  );
}

// Floating launcher + modal. Mounted once by PortalApp; hidden while an operator is
// viewing someone else's account (the submission would be attributed to the operator's
// own tenant, not the one on screen, which would be misleading in both places).
function FeedbackWidget({ clientId, onSubmitted }) {
  const [view, setView] = useState(null);   // null | "menu" | "bug" | "feature" | "done"
  const [pushed, setPushed] = useState(true);

  useEffect(() => {
    if (!view) return;
    const onKey = (e) => { if (e.key === "Escape") setView(null); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [view]);

  if (!view) {
    return (
      <button onClick={() => setView("menu")} aria-label="Send feedback"
        style={{
          position: "fixed", right: 20, bottom: 20, zIndex: 900,
          background: ACCENT, color: "#FFF", border: "none", borderRadius: 999,
          padding: "10px 16px", fontSize: 13.5, fontWeight: 700, cursor: "pointer",
          boxShadow: "0 4px 14px rgba(0,0,0,0.25)", fontFamily: "inherit",
        }}>
        💬 Feedback
      </button>
    );
  }

  const cfg = FB_KINDS[view] || null;
  const heading = view === "done" ? "✅ Thanks — we've got it"
    : cfg ? cfg.icon + " " + cfg.label : "💬 Send us feedback";

  return (
    <div onClick={() => setView(null)} role="dialog" aria-modal="true" aria-label="Send feedback"
      style={{ position: "fixed", inset: 0, zIndex: 999, background: "rgba(15,23,42,0.55)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
      <div onClick={(e) => e.stopPropagation()}
        style={{ background: "#FFF", borderRadius: 12, overflow: "hidden", width: cfg ? "min(560px, 100%)" : "min(420px, 100%)", maxHeight: "calc(100vh - 32px)", overflowY: "auto", boxShadow: "0 20px 60px rgba(0,0,0,0.35)" }}>
        <div style={{ background: ACCENT, color: "#FFF", padding: "12px 16px", display: "flex", alignItems: "center", gap: 8 }}>
          {cfg && <button onClick={() => setView("menu")} aria-label="Back" style={{ background: "none", border: "none", color: "#FFF", cursor: "pointer", fontSize: 16, padding: 0, lineHeight: 1 }}>←</button>}
          <div style={{ fontSize: 14, fontWeight: 700, flex: 1 }}>{heading}</div>
          <button onClick={() => setView(null)} aria-label="Close" style={{ background: "none", border: "none", color: "#FFF", cursor: "pointer", fontSize: 18, padding: 0, lineHeight: 1 }}>×</button>
        </div>

        {view === "menu" && (
          <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
            {["bug", "feature"].map((k) => (
              <button key={k} onClick={() => setView(k)}
                style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", background: "#F8FAFC", border: "1px solid #E2E8F0", borderRadius: 10, cursor: "pointer", textAlign: "left", fontFamily: "inherit" }}>
                <span style={{ fontSize: 22 }}>{FB_KINDS[k].icon}</span>
                <span>
                  <span style={{ display: "block", fontSize: 14, fontWeight: 700, color: "#0F172A" }}>{FB_KINDS[k].label}</span>
                  <span style={{ display: "block", fontSize: 12, color: "#64748B", marginTop: 2 }}>{FB_KINDS[k].blurb}</span>
                </span>
              </button>
            ))}
            <div style={{ fontSize: 12, color: "#94A3B8", lineHeight: 1.5, marginTop: 2 }}>
              Everything you send shows up under <b>What's New → My Submissions</b>, so you can track where it got to.
            </div>
          </div>
        )}

        {cfg && (
          <FeedbackForm kind={view} clientId={clientId} onBack={() => setView("menu")}
            onSubmitted={(row, wasPushed) => { setPushed(wasPushed !== false); setView("done"); if (onSubmitted) onSubmitted(row); }} />
        )}

        {view === "done" && (
          <div style={{ padding: 20, fontSize: 13.5, color: "#334155", lineHeight: 1.6 }}>
            Your submission is logged and on our board. You can follow it under{" "}
            <b>What's New → My Submissions</b> — the status updates there as we work on it,
            and any reply we post shows up alongside it.
            {!pushed && (
              <div style={{ ...S.err, marginTop: 12, marginBottom: 0 }}>
                Saved — but syncing it to our tracker didn't go through. It's recorded and we'll pick it up; nothing is lost.
              </div>
            )}
            <button onClick={() => setView(null)} style={{ ...S.btn(ACCENT, "#FFF"), marginTop: 16, width: "100%" }}>Done</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── My Submissions: this tenant's bugs + feature requests, with our replies ───
function MySubmissions({ refreshKey }) {
  const [rows, setRows] = useState(null);       // null = loading
  const [comments, setComments] = useState({}); // submission_id -> [comment]
  const [error, setError] = useState(null);
  const [open, setOpen] = useState(null);       // expanded submission id
  const [filter, setFilter] = useState("all");  // all | bug | feature
  const [syncing, setSyncing] = useState(false);
  const [tick, setTick] = useState(0);
  // Column sort, same convention as DesignsTable/LeadsTable (SortTh + sortRows).
  // Default = newest first, matching the created_at DESC load order.
  const [sortKey, setSortKey] = useState("date");
  const [sortDir, setSortDir] = useState("desc");
  const onSort = makeOnSort(sortKey, setSortKey, sortDir, setSortDir);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      // RLS scopes both reads to this tenant — no client_id filter needed here, and
      // adding one would be a false comfort (the policy is the actual boundary).
      const { data, error: err } = await sb
        .from("feedback_submissions")
        .select("id, kind, title, detail, severity, status, submitter_name, attachment_path, monday_item_id, created_at, status_changed_at")
        .order("created_at", { ascending: false });
      if (cancelled) return;
      if (err) { setError(err.message); setRows([]); return; }
      setRows(data || []);
      const ids = (data || []).map((r) => r.id);
      if (!ids.length) { setComments({}); return; }
      const { data: cs } = await sb
        .from("feedback_comments")
        .select("id, submission_id, author_name, body, created_at")
        .in("submission_id", ids)
        .order("created_at", { ascending: true });
      if (cancelled) return;
      const map = {};
      for (const c of cs || []) (map[c.submission_id] = map[c.submission_id] || []).push(c);
      setComments(map);
    })();
    return () => { cancelled = true; };
  }, [refreshKey, tick]);

  // Belt-and-braces against a webhook that never arrived: pull current state from
  // Monday on demand, then re-read. The webhook is the normal path; this is the button
  // a client presses when they think we've gone quiet.
  const resync = async () => {
    setSyncing(true);
    try { await sb.functions.invoke("portal-feedback", { body: { action: "refresh" } }); } catch (_) {}
    setSyncing(false);
    setTick((t) => t + 1);
  };

  const openAttachment = async (path) => {
    const { data, error: err } = await sb.storage.from("feedback-attachments").createSignedUrl(path, 300);
    if (err || !data) { alert("Couldn't open that attachment."); return; }
    window.open(data.signedUrl, "_blank", "noopener");
  };

  const fmtDT = (iso) => {
    if (!iso) return "";
    try { return new Date(iso).toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }); }
    catch { return iso; }
  };

  if (error) return <div style={S.err}>Couldn't load your submissions: {error}</div>;
  if (rows === null) return <div style={{ ...S.card, color: "#64748B" }}>Loading your submissions…</div>;

  const shown = filter === "all" ? rows : rows.filter((r) => r.kind === filter);
  const sortVal = (r) => {
    switch (sortKey) {
      case "name":   return r.title || "";
      case "user":   return r.submitter_name || "";
      case "status": return FB_STATUS_RANK[r.status] ?? 99;
      // ISO timestamps sort chronologically as plain strings — see sortRows.
      case "date":
      default:       return r.created_at || "";
    }
  };
  const sorted = sortRows(shown, sortVal, sortDir);

  return (
    <div style={S.card}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
        <span style={{ ...S.h2, marginBottom: 0 }}>My Submissions</span>
        <span style={{ fontSize: 12, color: "#94A3B8" }}>({rows.length})</span>
        <div style={{ display: "flex", gap: 6, marginLeft: "auto", flexWrap: "wrap" }}>
          {[["all", "All"], ["bug", "🐛 Issues"], ["feature", "✨ Features"]].map(([k, lbl]) => (
            <button key={k} type="button" onClick={() => setFilter(k)}
              style={{ fontFamily: "inherit", fontSize: 12, fontWeight: 700, padding: "5px 11px", borderRadius: 999, cursor: "pointer",
                border: filter === k ? "1px solid " + ACCENT : "1px solid #E2E8F0",
                background: filter === k ? ACCENT : "#FFF", color: filter === k ? "#FFF" : "#475569" }}>{lbl}</button>
          ))}
          <button type="button" onClick={resync} disabled={syncing}
            style={{ fontFamily: "inherit", fontSize: 12, fontWeight: 700, padding: "5px 11px", borderRadius: 999, cursor: syncing ? "default" : "pointer", border: "1px solid #E2E8F0", background: "#FFF", color: "#475569", opacity: syncing ? 0.6 : 1 }}>
            {syncing ? "Checking…" : "↻ Check for updates"}
          </button>
        </div>
      </div>

      {rows.length === 0 ? (
        <div style={{ fontSize: 13, color: "#64748B", padding: "8px 0", lineHeight: 1.6 }}>
          You haven't sent us anything yet. Use the <b>💬 Feedback</b> button in the bottom-right corner
          to report an issue or request a feature — it'll show up here so you can follow what happens to it.
        </div>
      ) : shown.length === 0 ? (
        <div style={{ fontSize: 13, color: "#64748B", padding: "8px 0" }}>Nothing here under this filter.</div>
      ) : (
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr>
              <SortTh label="Submission" col="name"   sortKey={sortKey} sortDir={sortDir} onSort={onSort} />
              <SortTh label="Submitted by" col="user" sortKey={sortKey} sortDir={sortDir} onSort={onSort} />
              <SortTh label="Status" col="status"     sortKey={sortKey} sortDir={sortDir} onSort={onSort} />
              <SortTh label="Date" col="date"         sortKey={sortKey} sortDir={sortDir} onSort={onSort} />
            </tr></thead>
            <tbody>
              {sorted.map((r) => {
                const isOpen = open === r.id;
                const cs = comments[r.id] || [];
                const toggle = () => setOpen(isOpen ? null : r.id);
                return (
                  <React.Fragment key={r.id}>
                  <tr onClick={toggle} tabIndex={0} aria-expanded={isOpen}
                    onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } }}
                    style={{ cursor: "pointer", background: isOpen ? "#F8FAFC" : undefined }}>
                    <td style={{ ...S.td, fontWeight: 700 }}>
                      <span style={{ color: ACCENT, fontSize: 11, marginRight: 6 }}>{isOpen ? "▾" : "▸"}</span>
                      <span style={{ marginRight: 6 }}>{r.kind === "bug" ? "🐛" : "✨"}</span>
                      {r.title}
                      {/* Tooltip names the sender rather than saying "from us": the reader
                          IS the client, so "us" scans as their own team — especially next
                          to a Submitted by column that can read "CSM Synergy". */}
                      {cs.length > 0 && (
                        <span title={cs.length + " repl" + (cs.length === 1 ? "y" : "ies") + " from Structure Studio"}
                          style={{ marginLeft: 8, fontSize: 11, fontWeight: 800, color: ACCENT, background: "#EEF2FF", borderRadius: 999, padding: "2px 8px", whiteSpace: "nowrap" }}>
                          💬 {cs.length}
                        </span>
                      )}
                    </td>
                    <td style={{ ...S.td, whiteSpace: "nowrap", color: "#475569" }}>{r.submitter_name}</td>
                    <td style={S.td}>{fbBadge(r.status)}</td>
                    <td style={{ ...S.td, whiteSpace: "nowrap", color: "#64748B" }}>{fmtDT(r.created_at)}</td>
                  </tr>

                  {isOpen && (
                    <tr style={{ background: "#F8FAFC" }}>
                      <td colSpan={4} style={{ ...S.td, paddingTop: 0 }}>
                        {r.detail && <div style={{ fontSize: 13, color: "#475569", lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{r.detail}</div>}
                        <div style={{ fontSize: 11.5, color: "#94A3B8", marginTop: 8, display: "flex", gap: 12, flexWrap: "wrap" }}>
                          {r.severity && <span>{r.kind === "bug" ? "Severity" : "Importance"}: <b style={{ color: "#64748B" }}>{r.severity}</b></span>}
                          {r.status_changed_at && <span>Last update: <b style={{ color: "#64748B" }}>{fmtDT(r.status_changed_at)}</b></span>}
                          {r.attachment_path && (
                            <button type="button" onClick={(e) => { e.stopPropagation(); openAttachment(r.attachment_path); }}
                              style={{ background: "none", border: "none", padding: 0, color: ACCENT, fontWeight: 700, fontSize: 11.5, cursor: "pointer", fontFamily: "inherit", textDecoration: "underline" }}>
                              View attachment
                            </button>
                          )}
                        </div>
                        {cs.length > 0 && (
                          <div style={{ marginTop: 12, borderLeft: "3px solid #E2E8F0", paddingLeft: 12, display: "flex", flexDirection: "column", gap: 10 }}>
                            {cs.map((c) => (
                              <div key={c.id}>
                                <div style={{ fontSize: 11, fontWeight: 800, color: "#64748B" }}>
                                  {c.author_name || "Structure Studio"} <span style={{ fontWeight: 600, color: "#94A3B8" }}>· {fmtDT(c.created_at)}</span>
                                </div>
                                <div style={{ fontSize: 13, color: "#334155", lineHeight: 1.6, whiteSpace: "pre-wrap", marginTop: 2 }}>{c.body}</div>
                              </div>
                            ))}
                          </div>
                        )}
                      </td>
                    </tr>
                  )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ─── What's New: global product changelog (read-only; team-populated) ───
function ReleasesView({ submissionsKey }) {
  const [rows, setRows] = useState(null); // null = loading
  const [error, setError] = useState(null);
  const [subtab, setSubtab] = useState("features"); // features | fixes | roadmap | mine
  const [mineCount, setMineCount] = useState(0);

  useEffect(() => {
    (async () => {
      const { data, error: err } = await sb
        .from("release_notes")
        .select("id, released_at, version, kind, title, detail, status, sort_order")
        .order("released_at", { ascending: false })
        .order("sort_order", { ascending: false });
      if (err) { setError(err.message); setRows([]); return; }
      setRows(data || []);
    })();
  }, []);

  // Count only — the list itself is fetched by MySubmissions when that tab opens.
  // RLS scopes this to the signed-in user's tenant.
  useEffect(() => {
    (async () => {
      const { count } = await sb.from("feedback_submissions").select("id", { count: "exact", head: true });
      setMineCount(count || 0);
    })();
  }, [submissionsKey]);

  const fmtDT = (iso) => {
    if (!iso) return "";
    try { return new Date(iso).toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }); }
    catch { return iso; }
  };

  // Deliberately NO early return on loading/error: that would also hide the My
  // Submissions tab, which has its own data path and must stay reachable even when
  // the release_notes read fails. Both states are rendered inside the tab body below.
  const list = rows || [];
  const features = list.filter((r) => r.kind === "feature");
  const fixes = list.filter((r) => r.kind === "fix");
  const requested = list.filter((r) => r.kind === "requested");

  const statusBadge = (status) => {
    const map = {
      roadmap:   { bg: "#EEF2FF", fg: "#4F46E5", label: "On the roadmap" },
      planned:   { bg: "#EEF2FF", fg: "#4F46E5", label: "Planned" },
      requested: { bg: "#FEF3C7", fg: "#B45309", label: "Requested" },
    };
    const m = map[status]; if (!m) return null;
    return <span style={{ background: m.bg, color: m.fg, fontSize: 10, fontWeight: 800, borderRadius: 999, padding: "2px 8px", textTransform: "uppercase", letterSpacing: 0.4, whiteSpace: "nowrap" }}>{m.label}</span>;
  };

  const entry = (r) => (
    <div key={r.id} style={{ padding: "12px 0", borderBottom: "1px solid #F1F5F9" }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
        <span style={{ fontSize: 14, fontWeight: 700, color: "#1E293B" }}>{r.title}</span>
        {statusBadge(r.status)}
        <span style={{ marginLeft: "auto", fontSize: 11, color: "#94A3B8", whiteSpace: "nowrap" }}>{fmtDT(r.released_at)}</span>
      </div>
      {r.detail && <div style={{ fontSize: 13, color: "#475569", marginTop: 4, lineHeight: 1.5 }}>{r.detail}</div>}
    </div>
  );

  // Section definitions — one per sub-tab. `empty` shows when that tab has no rows.
  // "mine" is the odd one out: it renders <MySubmissions /> rather than release_notes
  // entries, so it carries its own count instead of a `list`.
  const TABS = [
    { id: "features", label: "New Features", dot: "#10B981", list: features, empty: "No new features yet — check back soon." },
    { id: "fixes",    label: "Bug Fixes",    dot: "#F59E0B", list: fixes,    empty: "No bug fixes to report right now." },
    { id: "roadmap",  label: "Roadmap",      dot: "#6366F1", list: requested, empty: "Nothing on the roadmap yet — check back soon." },
    { id: "mine",     label: "My Submissions", dot: "#7E22CE", count: mineCount },
  ];
  const active = TABS.find((t) => t.id === subtab) || TABS[0];
  const tabCount = (t) => (t.count != null ? t.count : t.list.length);

  return (
