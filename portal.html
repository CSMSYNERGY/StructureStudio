<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>StructureStudio — Business Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F8FAFC}
/* Dashboard shell: fluid, full-width sidebar layout. The sidebar sticks to the viewport
   while the page scrolls; below 900px it collapses to an icon rail. Logged-out views
   center themselves (PortalApp wraps them in a 920px container). */
.ss-shell{display:flex;min-height:100vh;align-items:stretch}
.ss-side{width:240px;flex:0 0 240px;background:linear-gradient(180deg,#3D3672 0%,#2B4C7E 55%,#1B7895 100%);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.ss-brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.ss-logo-ph{width:42px;height:42px;border-radius:10px;background:rgba(117,230,218,0.14);border:1px dashed rgba(117,230,218,0.55);color:#B8F2E9;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ss-logo-ph svg{width:20px;height:20px}
.ss-brand .name{font-size:15.5px;font-weight:800;color:#FFF;line-height:1.15;white-space:nowrap}
.ss-brand .sub{font-size:11px;color:#A9B6D6;margin-top:2px;white-space:nowrap}
.ss-navlabel{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#8091BC;padding:6px 10px;margin-top:6px;white-space:nowrap}
.ss-nav{display:flex;flex-direction:column;gap:2px}
.ss-nav a,.ss-nav button{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-size:13.5px;font-weight:600;color:#CBD5E6;text-decoration:none;cursor:pointer;white-space:nowrap;background:none;border:none;font-family:inherit;width:100%;text-align:left}
.ss-nav a svg,.ss-nav button svg{width:17px;height:17px;flex-shrink:0}
.ss-nav a svg.ext{width:14px;height:14px;margin-left:auto;opacity:.55}
.ss-nav a:hover,.ss-nav button:hover{background:rgba(255,255,255,0.08);color:#FFF}
.ss-nav a.active,.ss-nav button.active{background:#75E6DA;color:#22345B;font-weight:700}
.ss-spacer{flex:1}
.ss-foot{border-top:1px solid rgba(255,255,255,0.12);padding-top:14px}
.ss-newlink{display:flex;align-items:center;gap:6px;font-size:12px;color:#A9B6D6;text-decoration:underline;text-underline-offset:2px;cursor:pointer;margin-bottom:12px;padding:0 4px;white-space:nowrap;background:none;border:none;font-family:inherit;width:100%;text-align:left}
.ss-newlink:hover{color:#FFF}
.ss-newlink svg{width:14px;height:14px;flex-shrink:0}
.ss-user{display:flex;align-items:center;gap:10px;padding:2px 2px 12px}
.ss-avatar{width:34px;height:34px;border-radius:50%;background:rgba(117,230,218,0.16);border:1px solid rgba(117,230,218,0.5);color:#B8F2E9;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0}
.ss-user .uname{font-size:13px;font-weight:700;color:#FFF;line-height:1.15;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.ss-user .umail{font-size:11px;color:#9FADD1;margin-top:1px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss-signout{display:flex;align-items:center;gap:8px;width:100%;justify-content:center;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.22);color:#E7ECF5;font-size:13px;font-weight:700;padding:9px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;font-family:inherit}
.ss-signout:hover{background:rgba(255,255,255,0.16)}
.ss-signout svg{width:15px;height:15px;flex-shrink:0}
.ss-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ss-topbar{background:#FFF;border-bottom:1px solid #E7EBF0;padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40}
.ss-topbar .ttl{font-size:18px;font-weight:800;color:#1E293B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.ss-topbar .ttl span{color:#94A3B8;font-weight:600;font-size:13px;margin-left:8px}
.ss-topbar .tenant{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.ss-clogo{width:34px;height:34px;border-radius:8px;background:#F1F5F9;border:1px dashed #C3CCD8;display:flex;align-items:center;justify-content:center;color:#64748B;flex-shrink:0;font-size:12px;font-weight:800}
.ss-tname{font-size:15.5px;font-weight:800;color:#1E293B;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.ss-body{flex:1;padding:20px 24px}
.ss-inner{max-width:1240px}
@media (max-width:900px){
  .ss-side{width:68px;flex-basis:68px;padding:18px 10px;align-items:center}
  .ss-brand{justify-content:center;padding:4px 0 16px}
  .ss-brand .btext,.ss-navlabel,.ss-nav .lbl,.ss-nav svg.ext,.ss-newlink span,.ss-user .utext,.ss-signout .sotext{display:none}
  .ss-nav{width:100%}
  .ss-nav a,.ss-nav button{justify-content:center;gap:0;padding:10px 0}
  .ss-newlink{justify-content:center;padding:0}
  .ss-user{justify-content:center}
  .ss-foot{width:100%}
  .ss-signout{padding:10px 0}
}
@media (max-width:560px){
  .ss-topbar{padding:12px 14px}
  .ss-topbar .ttl span{display:none}
  .ss-tname{display:none}
  .ss-body{padding:14px 12px}
}
</style>
</head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;
const { createClient } = window.supabase;

// ─── StructureStudio Business Portal ───
// Standalone owner-facing page (login + dashboard). Unlike index.html /
// StructureStudio.jsx — which are hand-mirrored siblings — this file has no
// .jsx twin: it is only ever served by Netlify, never embedded by hosts.
//
// Auth: Supabase email/password. Each owner account maps to one client via the
// client_users table; RLS confines every query to that tenant's rows. Secrets
// (the GHL API key) never reach this page — settings reads/writes go through
// the portal-settings edge function, which masks on read and is write-only for
// the key.

const SUPABASE_URL = "https://jzeamjbhdrsbygdnphbm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6ZWFtamJoZHJzYnlnZG5waGJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNDIwNDMsImV4cCI6MjA5MjkxODA0M30.YawJS7aiyTbQdwVnzndyKwD2ejNGYhdBSiectURvxwY";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── Central error logging → Supabase app_errors (via the log_error RPC). Best-effort:
// never throws, never blocks the UI. Auto-captures uncaught errors + unhandled promise
// rejections, and anything reported explicitly via window.ssLogError(source,msg,code,ctx). ──
const SS_ERR_SOURCE = "portal";
function ssLogError(source, message, code, context) {
  try {
    const params = new URLSearchParams(location.search);
    fetch(SUPABASE_URL + "/rest/v1/rpc/log_error", {
      method: "POST", keepalive: true,
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify({
        p_source: String(source || SS_ERR_SOURCE).slice(0, 100),
        p_message: String(message == null ? "" : (message.message || message)).slice(0, 4000),
        p_code: code == null ? null : String(code).slice(0, 100),
        p_client_id: window.__SS_CLIENT_ID__ || params.get("client") || null,
        p_url: location.href.slice(0, 600),
        p_context: context || null,
      }),
    }).catch(() => {});
  } catch (_) { /* logging must never break the app */ }
}
window.ssLogError = ssLogError;
window.addEventListener("error", (e) => ssLogError(SS_ERR_SOURCE, (e && e.message) || "window.onerror", e && e.error && e.error.name,
  { stack: e && e.error && e.error.stack ? String(e.error.stack).slice(0, 2000) : null, file: e && e.filename, line: e && e.lineno }));
window.addEventListener("unhandledrejection", (e) => { const r = e && e.reason; ssLogError(SS_ERR_SOURCE, (r && r.message) || String(r), r && r.name,
  { stack: r && r.stack ? String(r.stack).slice(0, 2000) : null }); });
// Capture every portal-settings edge-function error in one place by wrapping invoke.
const __ssInvoke = sb.functions.invoke.bind(sb.functions);
sb.functions.invoke = async (name, opts) => {
  const res = await __ssInvoke(name, opts);
  try {
    if (res && (res.error || (res.data && res.data.error))) {
      ssLogError(SS_ERR_SOURCE, (res.error && res.error.message) || (res.data && res.data.error),
        (res.error && res.error.name) || null, { fn: name, action: opts && opts.body && opts.body.action });
    }
  } catch (_) {}
  return res;
};

const ACCENT = "#3D3672";  // brand purple
const S = {
  page: { minHeight: "100vh", display: "flex", flexDirection: "column" },
  header: { background: "linear-gradient(135deg, #3D3672 0%, #1B7895 100%)", color: "#FFF", padding: "16px 24px", display: "flex", alignItems: "center", gap: 12 },
  badge: { background: "#75E6DA", color: "#3D3672", borderRadius: 8, width: 40, height: 40, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 16, flexShrink: 0 },
  card: { background: "#FFF", border: "1px solid #E2E8F0", borderRadius: 12, padding: 20, marginBottom: 16 },
  h2: { fontSize: 15, fontWeight: 800, color: "#1E293B", marginBottom: 12, letterSpacing: 0.3 },
  lbl: { fontSize: 11, fontWeight: 700, color: "#64748B", display: "block", marginBottom: 4, textTransform: "uppercase", letterSpacing: 0.5 },
  input: { width: "100%", border: "1px solid #CBD5E1", borderRadius: 6, padding: "8px 10px", fontSize: 13, fontWeight: 600, color: "#1E293B", background: "#FFF", boxSizing: "border-box" },
  btn: (bg, fg) => ({ background: bg, color: fg, border: "none", borderRadius: 8, padding: "10px 16px", fontSize: 13, fontWeight: 700, cursor: "pointer" }),
  err: { background: "#FEF2F2", border: "1px solid #FECACA", borderRadius: 8, padding: "10px 14px", color: "#DC2626", fontSize: 13, fontWeight: 600, marginBottom: 12 },
  okMsg: { background: "#F0FDF4", border: "1px solid #BBF7D0", borderRadius: 8, padding: "10px 14px", color: "#15803D", fontSize: 13, fontWeight: 600, marginBottom: 12 },
  th: { textAlign: "left", fontSize: 11, fontWeight: 700, color: "#64748B", textTransform: "uppercase", letterSpacing: 0.5, padding: "8px 10px", borderBottom: "2px solid #E2E8F0", whiteSpace: "nowrap" },
  td: { fontSize: 13, color: "#1E293B", padding: "10px", borderBottom: "1px solid #F1F5F9", verticalAlign: "top" },
};

function fmtDate(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); }
  catch { return iso; }
}
// Capitalize each word of a building-style name for display. Designs store the style as
// either its label ("Farmland") or its lowercase key ("cabin"), so normalize to Title Case.
function titleCase(s) {
  return String(s || "").replace(/\b\w/g, (c) => c.toUpperCase());
}

// Password input with a show/hide (eye) toggle. Forwards all input props; `wrapStyle`
// carries any flex/grid sizing onto the positioned wrapper so layouts are preserved.
function PasswordInput({ style, wrapStyle, ...rest }) {
  const [show, setShow] = useState(false);
  return (
    <div style={{ position: "relative", width: "100%", boxSizing: "border-box", ...wrapStyle }}>
      <input {...rest} type={show ? "text" : "password"} style={{ ...style, width: "100%", boxSizing: "border-box", paddingRight: 38 }} />
      <button type="button" tabIndex={-1} aria-label={show ? "Hide password" : "Show password"} title={show ? "Hide password" : "Show password"} onMouseDown={(e) => e.preventDefault()} onClick={() => setShow((v) => !v)} style={{ position: "absolute", top: 0, right: 0, height: "100%", width: 34, display: "flex", alignItems: "center", justifyContent: "center", background: "transparent", border: "none", padding: 0, margin: 0, cursor: "pointer", color: "#64748B" }}>
        {show ? (
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" /><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" /><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" /><line x1="2" x2="22" y1="2" y2="22" /></svg>
        ) : (
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></svg>
        )}
      </button>
    </div>
  );
}

// ─── Login ───
function LoginView({ onRecoverySent }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [info, setInfo] = useState(null);

  const signIn = async (e) => {
    e.preventDefault();
    setError(null); setInfo(null); setBusy(true);
    const { error: err } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    setBusy(false);
    if (err) setError(err.message === "Invalid login credentials" ? "Wrong email or password." : err.message);
    // success: onAuthStateChange in PortalApp takes over
  };

  const forgot = async () => {
    setError(null); setInfo(null);
    if (!email.trim()) { setError("Enter your email above first, then click “Forgot password” again."); return; }
    setBusy(true);
    const { error: err } = await sb.auth.resetPasswordForEmail(email.trim(), {
      redirectTo: window.location.origin + window.location.pathname,
    });
    setBusy(false);
    if (err) setError(err.message);
    else setInfo("Password reset email sent — check your inbox (it can take a minute).");
  };

  return (
    <div style={{ maxWidth: 380, margin: "60px auto", padding: "0 16px" }}>
      <div style={S.card}>
        <div style={{ ...S.h2, fontSize: 18, textAlign: "center" }}>Business Login</div>
        <p style={{ fontSize: 12, color: "#64748B", textAlign: "center", marginBottom: 16 }}>Sign in to see your leads, designs, and settings.</p>
        {error && <div style={S.err}>{error}</div>}
        {info && <div style={S.okMsg}>{info}</div>}
        <form onSubmit={signIn}>
          <div style={{ marginBottom: 12 }}>
            <span style={S.lbl}>Email</span>
            <input style={S.input} type="email" autoComplete="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@yourbusiness.com" />
          </div>
          <div style={{ marginBottom: 16 }}>
            <span style={S.lbl}>Password</span>
            <PasswordInput style={S.input} autoComplete="current-password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" />
          </div>
          <button type="submit" disabled={busy} style={{ ...S.btn(ACCENT, "#FFF"), width: "100%", opacity: busy ? 0.6 : 1 }}>{busy ? "Signing in…" : "Sign In"}</button>
        </form>
        <button onClick={forgot} disabled={busy} style={{ ...S.btn("transparent", "#64748B"), width: "100%", marginTop: 8, fontSize: 12 }}>Forgot password?</button>
      </div>
    </div>
  );
}

// ─── Password reset (arrived via recovery email link) ───
function ResetPasswordView({ onDone }) {
  const [pw1, setPw1] = useState("");
  const [pw2, setPw2] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  const save = async (e) => {
    e.preventDefault();
    setError(null);
    if (pw1.length < 8) { setError("Password must be at least 8 characters."); return; }
    if (pw1 !== pw2) { setError("Passwords don't match."); return; }
    setBusy(true);
    const { error: err } = await sb.auth.updateUser({ password: pw1 });
    setBusy(false);
    if (err) setError(err.message);
    else onDone();
  };

  return (
    <div style={{ maxWidth: 380, margin: "60px auto", padding: "0 16px" }}>
      <div style={S.card}>
        <div style={{ ...S.h2, fontSize: 18, textAlign: "center" }}>Set a New Password</div>
        {error && <div style={S.err}>{error}</div>}
        <form onSubmit={save}>
          <div style={{ marginBottom: 12 }}>
            <span style={S.lbl}>New password</span>
            <PasswordInput style={S.input} autoComplete="new-password" value={pw1} onChange={(e) => setPw1(e.target.value)} />
          </div>
          <div style={{ marginBottom: 16 }}>
            <span style={S.lbl}>Confirm password</span>
            <PasswordInput style={S.input} autoComplete="new-password" value={pw2} onChange={(e) => setPw2(e.target.value)} />
          </div>
          <button type="submit" disabled={busy} style={{ ...S.btn(ACCENT, "#FFF"), width: "100%", opacity: busy ? 0.6 : 1 }}>{busy ? "Saving…" : "Save Password"}</button>
        </form>
      </div>
    </div>
  );
}

// ─── Share link card ───
function ShareLinkCard({ clientId }) {
  const [copied, setCopied] = useState(false);
  const link = `${window.location.origin}/?client=${encodeURIComponent(clientId)}`;
  const copy = () => {
    navigator.clipboard.writeText(link).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    }).catch(() => {});
  };
  return (
    <div style={S.card}>
      <div style={S.h2}>Your Customer Design Link</div>
      <p style={{ fontSize: 12, color: "#64748B", marginBottom: 10 }}>Share this link with customers (or embed it on your website). Every design submitted through it lands in your list below.</p>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <input style={{ ...S.input, flex: "1 1 280px", fontFamily: "monospace", fontSize: 12 }} readOnly value={link} onFocus={(e) => e.target.select()} />
        <button onClick={copy} style={S.btn(copied ? "#15803D" : "#1E293B", "#FFF")}>{copied ? "✓ Copied" : "Copy"}</button>
        <a href={link} target="_blank" rel="noopener" style={{ ...S.btn("#F1F5F9", "#334155"), textDecoration: "none", border: "1px solid #E2E8F0" }}>Open ↗</a>
      </div>
    </div>
  );
}

// ─── Designs table ───
// Fulfillment status (read-only badge). Value is a GHL-derived projection cached on
// designs.status and refreshed by the sync-design-status edge function on load.
const STATUS_LABELS = { sent: "Sent", accepted: "Accepted", invoiced: "Invoiced", delivered: "Delivered" };
const STATUS_COLORS = {
  sent:      { bg: "#EEF2FF", fg: "#3D3672" },
  accepted:  { bg: "#F0FDF4", fg: "#15803D" },
  invoiced:  { bg: "#FFFBEB", fg: "#B45309" },
  delivered: { bg: "#ECFEFF", fg: "#0E7490" },
};
// Lead activity indicator (traffic light) based on the most-recent activity — i.e. the
// newest design update for that lead. Anon shed-shoppers have no live login/session, so
// "active" is recency-based, not real-time presence. Thresholds are easy to tune here.
function activityInfo(lastActivity) {
  const t = lastActivity ? Date.parse(lastActivity) : NaN;
  if (!t || isNaN(t)) return { color: "#94A3B8", label: "No activity yet" };
  const hours = (Date.now() - t) / 3600000;
  if (hours <= 10)  return { color: "#16A34A", label: "Active recently (within 10 hours)" }; // green
  if (hours <= 720) return { color: "#F59E0B", label: "Used within the last 30 days" };      // orange (720h = 30d)
  return { color: "#EF4444", label: "Idle for over a month" };                               // red
}
function DesignsTable({ clientId }) {
  const [rows, setRows] = useState(null); // null = loading
  const [error, setError] = useState(null);
  const [vmap, setVmap] = useState({});         // short_code -> versions (newest first)
  const [expanded, setExpanded] = useState({}); // short_code -> bool (show older versions)

  const load = useCallback(async () => {
    setError(null);
    const { data, error: err } = await sb
      .from("designs")
      .select("short_code, created_at, updated_at, status, contact, selections, ghl_estimate_number, image_url")
      .eq("client_id", clientId)
      .order("created_at", { ascending: false });
    if (err) { setError(err.message); setRows([]); return; }
    const list = data || [];
    setRows(list); // show cached statuses immediately
    // Refresh fulfillment status from GHL (read-only projection). Non-fatal: if the sync
    // errors or GHL isn't configured, the cached designs.status values above stay shown.
    if (list.length > 0) {
      try {
        const { data: sync } = await sb.functions.invoke("sync-design-status", { body: { shortCodes: list.map((r) => r.short_code) } });
        const statuses = sync && sync.statuses;
        if (statuses) setRows((rs) => (rs || []).map((r) => statuses[r.short_code] ? { ...r, status: statuses[r.short_code] } : r));
      } catch (_e) { /* keep cached statuses */ }
    }
    // Version history (newest first), grouped by design. Owner-scoped by RLS.
    const { data: vdata } = await sb
      .from("design_versions")
      .select("short_code, version, created_at, selections, image_url")
      .eq("client_id", clientId)
      .order("version", { ascending: false });
    const map = {};
    (vdata || []).forEach((v) => { (map[v.short_code] = map[v.short_code] || []).push(v); });
    setVmap(map);
  }, []);

  useEffect(() => { load(); }, [load]);

  return (
    <div style={S.card}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
        <div style={{ ...S.h2, marginBottom: 0 }}>Designs {rows ? `(${rows.length})` : ""}</div>
        <button onClick={load} style={{ ...S.btn("#F1F5F9", "#334155"), border: "1px solid #E2E8F0", padding: "6px 12px" }}>↻ Refresh</button>
      </div>
      {error && <div style={S.err}>{error}</div>}
      {rows === null && <p style={{ fontSize: 13, color: "#64748B", padding: 12 }}>Loading…</p>}
      {rows && rows.length === 0 && !error && (
        <p style={{ fontSize: 13, color: "#64748B", padding: 12 }}>No designs yet. Share your customer link above — submitted designs show up here.</p>
      )}
      {rows && rows.length > 0 && (
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr>
              <th style={S.th}>Date</th><th style={S.th}>Customer</th><th style={S.th}>Contact</th>
              <th style={S.th}>Building</th><th style={S.th}>Estimate #</th><th style={S.th}>Status</th><th style={S.th}>Actions</th>
            </tr></thead>
            <tbody>
              {rows.map((r) => {
                const c = r.contact || {}; const sel = r.selections || {};
                const openUrl = `${window.location.origin}/?client=${encodeURIComponent(clientId)}&id=${encodeURIComponent(r.short_code)}`;
                const vs = vmap[r.short_code] || [];       // newest first
                const older = vs.slice(1);                  // everything below the latest
                const isOpen = !!expanded[r.short_code];
                const verUrl = (v) => `${openUrl}&v=${v}`;
                return (
                  <React.Fragment key={r.short_code}>
                  <tr>
                    <td style={{ ...S.td, whiteSpace: "nowrap" }}>{fmtDate(r.created_at)}</td>
                    <td style={{ ...S.td, fontWeight: 700 }}>{c.name || "—"}</td>
                    <td style={S.td}>
                      <div>{c.email || ""}</div>
                      <div style={{ color: "#64748B", fontSize: 12 }}>{c.phone || ""}</div>
                    </td>
                    <td style={{ ...S.td, whiteSpace: "nowrap" }}>
                      {[titleCase(sel.style), sel.size].filter(Boolean).join(" ") || "—"}
                      {older.length > 0 && (
                        <button onClick={() => setExpanded((p) => ({ ...p, [r.short_code]: !p[r.short_code] }))}
                          style={{ marginLeft: 8, background: "transparent", border: "none", padding: 0, cursor: "pointer", color: ACCENT, fontSize: 12, fontWeight: 700 }}>
                          {isOpen ? "▴ hide" : `▾ ${vs.length} versions`}
                        </button>
                      )}
                    </td>
                    <td style={S.td}>{r.ghl_estimate_number ? `EST-${r.ghl_estimate_number}` : "—"}</td>
                    <td style={S.td}>{(() => { const st = STATUS_LABELS[r.status] ? r.status : "sent"; const c = STATUS_COLORS[st]; return <span style={{ background: c.bg, color: c.fg, borderRadius: 20, padding: "4px 12px", fontSize: 12, fontWeight: 700, whiteSpace: "nowrap" }}>{STATUS_LABELS[st]}</span>; })()}</td>
                    <td style={{ ...S.td, whiteSpace: "nowrap" }}>
                      <a href={openUrl} target="_blank" rel="noopener" style={{ color: ACCENT, fontWeight: 700, textDecoration: "none", marginRight: 10 }}>Open</a>
                      {r.image_url && <a href={r.image_url} target="_blank" rel="noopener" style={{ color: "#334155", fontWeight: 700, textDecoration: "none" }}>PDF</a>}
                    </td>
                  </tr>
                  {isOpen && older.map((v) => {
                    const vsel = v.selections || {};
                    return (
                      <tr key={r.short_code + "-v" + v.version} style={{ background: "#F8FAFC" }}>
                        <td style={{ ...S.td, whiteSpace: "nowrap", color: "#64748B" }}>{fmtDate(v.created_at)}</td>
                        <td style={S.td}></td>
                        <td style={S.td}></td>
                        <td style={{ ...S.td, whiteSpace: "nowrap", color: "#64748B" }}>↳ v{v.version} · {[titleCase(vsel.style), vsel.size].filter(Boolean).join(" ") || "—"}</td>
                        <td style={S.td}></td>
                        <td style={S.td}></td>
                        <td style={{ ...S.td, whiteSpace: "nowrap" }}>
                          <a href={verUrl(v.version)} target="_blank" rel="noopener" style={{ color: ACCENT, fontWeight: 700, textDecoration: "none", marginRight: 10 }}>Open</a>
                          {v.image_url && <a href={v.image_url} target="_blank" rel="noopener" style={{ color: "#334155", fontWeight: 700, textDecoration: "none" }}>PDF</a>}
                        </td>
                      </tr>
                    );
                  })}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ─── Leads table (contact-grouped view of designs) ───
// Same RLS-scoped designs read as DesignsTable, but grouped by the person
// (normalized phone → email → name) so a repeat shopper collapses into ONE lead
// with a design count + activity dates. Read-only. "Last activity" = the newest
// design's updated_at (portal logins aren't client-readable); status = the
// highest fulfillment stage across that lead's designs.
function LeadsTable({ clientId }) {
  const [rows, setRows] = useState(null); // null = loading
  const [error, setError] = useState(null);

  const load = useCallback(async () => {
    setError(null);
    const { data, error: err } = await sb
      .from("designs")
      .select("short_code, created_at, updated_at, status, contact, selections, ghl_estimate_number")
      .eq("client_id", clientId)
      .order("created_at", { ascending: false });
    if (err) { setError(err.message); setRows([]); return; }
    let list = data || [];
    // Freshen fulfillment status from GHL (read-only projection); non-fatal.
    if (list.length > 0) {
      try {
        const { data: sync } = await sb.functions.invoke("sync-design-status", { body: { shortCodes: list.map((r) => r.short_code) } });
        const statuses = sync && sync.statuses;
        if (statuses) list = list.map((r) => statuses[r.short_code] ? { ...r, status: statuses[r.short_code] } : r);
      } catch (_e) { /* keep cached statuses */ }
    }
    // Group by person: normalized phone, else email, else name (fallback: short_code).
    const normPhone = (p) => String(p || "").replace(/\D/g, "");
    const RANK = { sent: 0, accepted: 1, invoiced: 2, delivered: 3 };
    const groups = new Map();
    list.forEach((r) => { // list is newest-first
      const c = r.contact || {};
      const key = normPhone(c.phone) || String(c.email || "").trim().toLowerCase() || String(c.name || "").trim().toLowerCase() || r.short_code;
      let g = groups.get(key);
      if (!g) { g = { key, name: "", email: "", phone: "", count: 0, firstSeen: r.created_at, lastActivity: r.created_at, latestCode: r.short_code, topStatus: "sent" }; groups.set(key, g); }
      g.count += 1;
      if (!g.name && c.name) g.name = c.name;       // newest-first → prefer the most recent non-empty value
      if (!g.email && c.email) g.email = c.email;
      if (!g.phone && c.phone) g.phone = c.phone;
      const act = r.updated_at || r.created_at;
      if (act > g.lastActivity) g.lastActivity = act;
      if (r.created_at < g.firstSeen) g.firstSeen = r.created_at;
      const st = STATUS_LABELS[r.status] ? r.status : "sent";
      if (RANK[st] > RANK[g.topStatus]) g.topStatus = st;
    });
    setRows([...groups.values()].sort((a, b) => (b.lastActivity > a.lastActivity ? 1 : b.lastActivity < a.lastActivity ? -1 : 0)));
  }, []);

  useEffect(() => { load(); }, [load]);

  return (
    <div style={S.card}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
        <div style={{ ...S.h2, marginBottom: 0 }}>Leads {rows ? `(${rows.length})` : ""}</div>
        <button onClick={load} style={{ ...S.btn("#F1F5F9", "#334155"), border: "1px solid #E2E8F0", padding: "6px 12px" }}>↻ Refresh</button>
      </div>
      <div style={{ fontSize: 12, color: "#64748B", marginBottom: 10 }}>Everyone who submitted a design, grouped by contact — repeat visitors collapse into one lead. Read-only.
        <span style={{ marginLeft: 6, whiteSpace: "nowrap" }}>
          <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: "#16A34A", margin: "0 4px 0 6px", verticalAlign: "middle" }} />active
          <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: "#F59E0B", margin: "0 4px 0 10px", verticalAlign: "middle" }} />recent
          <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: "#EF4444", margin: "0 4px 0 10px", verticalAlign: "middle" }} />idle
        </span>
      </div>
      {error && <div style={S.err}>{error}</div>}
      {rows === null && <p style={{ fontSize: 13, color: "#64748B", padding: 12 }}>Loading…</p>}
      {rows && rows.length === 0 && !error && (
        <p style={{ fontSize: 13, color: "#64748B", padding: 12 }}>No leads yet. Share your customer link — everyone who submits a design shows up here.</p>
      )}
      {rows && rows.length > 0 && (
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr>
              <th style={S.th}>Customer</th><th style={S.th}>Contact</th><th style={S.th}>Designs</th>
              <th style={S.th}>First seen</th><th style={S.th}>Last activity</th><th style={S.th}>Status</th><th style={S.th}>Actions</th>
            </tr></thead>
            <tbody>
              {rows.map((g) => {
                const openUrl = `${window.location.origin}/?client=${encodeURIComponent(clientId)}&id=${encodeURIComponent(g.latestCode)}`;
                const sc = STATUS_COLORS[g.topStatus] || STATUS_COLORS.sent;
                return (
                  <tr key={g.key}>
                    <td style={{ ...S.td, fontWeight: 700 }}>
                      {(() => { const a = activityInfo(g.lastActivity); return <span title={a.label} style={{ display: "inline-block", width: 9, height: 9, borderRadius: "50%", background: a.color, marginRight: 8, verticalAlign: "middle" }} />; })()}
                      {g.name || "—"}
                    </td>
                    <td style={S.td}>
                      <div>{g.email || ""}</div>
                      <div style={{ color: "#64748B", fontSize: 12 }}>{g.phone || ""}</div>
                    </td>
                    <td style={S.td}>{g.count}</td>
                    <td style={{ ...S.td, whiteSpace: "nowrap" }}>{fmtDate(g.firstSeen)}</td>
                    <td style={{ ...S.td, whiteSpace: "nowrap" }}>{fmtDate(g.lastActivity)}</td>
                    <td style={S.td}><span style={{ background: sc.bg, color: sc.fg, borderRadius: 20, padding: "4px 12px", fontSize: 12, fontWeight: 700, whiteSpace: "nowrap" }}>{STATUS_LABELS[g.topStatus]}</span></td>
                    <td style={{ ...S.td, whiteSpace: "nowrap" }}>
                      <a href={openUrl} target="_blank" rel="noopener" style={{ color: ACCENT, fontWeight: 700, textDecoration: "none" }}>Open latest</a>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ─── Settings (via portal-settings edge function; API key is write-only) ───
function SettingsView() {
  const [status, setStatus] = useState(null);   // response of action:"status"
  const [error, setError] = useState(null);
  const [saved, setSaved] = useState(false);
  const [busy, setBusy] = useState(false);
  // GHL credential inputs are intentionally NOT prefilled: location id + API key
  // come back masked/withheld, so prefilling would save the mask back. Leave
  // blank = keep current value.
  const [ghlLocationId, setGhlLocationId] = useState("");
  const [ghlApiKey, setGhlApiKey] = useState("");
  const [ghlBusy, setGhlBusy] = useState(false);
  const [ghlMsg, setGhlMsg] = useState(null);   // { ok } | { err }
  // Synergy/GHL pipelines + stages for the (post-connect) dropdowns. Fetched via
  // the edge fn using the stored key — the browser never holds it.
  const [pipelines, setPipelines] = useState([]);   // [{id,name,stages:[{id,name}]}]
  const [pipesBusy, setPipesBusy] = useState(false);   // loading pipelines
  const [pipesSaving, setPipesSaving] = useState(false);
  const [pipesMsg, setPipesMsg] = useState(null);   // { ok } | { err }
  const [form, setForm] = useState({
    ghlPipelineId: "", ghlStageSendQuoteId: "",
    ghlStageAcceptedId: "", ghlStageInvoicedId: "", ghlStageDeliveredId: "",
    ghlPipelineAcceptedId: "", ghlPipelineInvoicedId: "", ghlPipelineDeliveredId: "",
    businessName: "", businessPhone: "", businessWebsite: "", businessLogoUrl: "",
    addr1: "", addrCity: "", addrState: "", addrZip: "",
    quoteTerms: "", betaMode: false, betaEmail: "", showPricing: false,
    // designer branding (client_configs — drives the public ?client= link)
    brandName: "", brandTagline: "", brandAccent: "#D97706", brandHeaderBg: "#1E293B",
  });
  const set = (k) => (e) => {
    const v = e && e.target ? (e.target.type === "checkbox" ? e.target.checked : e.target.value) : e;
    setForm((p) => ({ ...p, [k]: v }));
  };
  // Branding logo upload state (separate save → client_configs via save_branding)
  const [logoDataUrl, setLogoDataUrl] = useState("");   // new upload preview/payload
  const [logoCt, setLogoCt] = useState("");
  const [currentLogo, setCurrentLogo] = useState(null);  // saved logo from status
  const [brandBusy, setBrandBusy] = useState(false);
  const [brandMsg, setBrandMsg] = useState(null);
  const onLogoFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (f.size > 2_000_000) { setBrandMsg({ err: "Logo must be under 2MB." }); return; }
    const r = new FileReader();
    r.onload = () => { setLogoDataUrl(r.result); setLogoCt(f.type || "image/png"); setBrandMsg(null); };
    r.readAsDataURL(f);
  };
  const saveBranding = async () => {
    setBrandBusy(true); setBrandMsg(null);
    const body = { action: "save_branding", companyName: form.brandName, tagline: form.brandTagline,
      accentColor: form.brandAccent, headerBg: form.brandHeaderBg };
    if (logoDataUrl) { body.logoBase64 = logoDataUrl; body.logoContentType = logoCt; }
    const { data, error: err } = await sb.functions.invoke("portal-settings", { body });
    setBrandBusy(false);
    if (err || (data && data.error)) { setBrandMsg({ err: (data && data.error) || err.message }); return; }
    setBrandMsg({ ok: "Branding saved — your designer link now reflects it." });
    if (data.logoUrl) setCurrentLogo(data.logoUrl);
    setLogoDataUrl(""); setLogoCt("");
  };
  // Business-logo (estimates) upload → uploads to the branding bucket and fills
  // the Logo URL field with the public URL; persisted by the normal Save action.
  const [bizLogoBusy, setBizLogoBusy] = useState(false);
  const onBizLogoFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (f.size > 2_000_000) { setError("Logo must be under 2MB."); return; }
    const r = new FileReader();
    r.onload = async () => {
      setBizLogoBusy(true); setError(null);
      const { data, error: err } = await sb.functions.invoke("portal-settings", { body: { action: "upload_logo", kind: "business", logoBase64: r.result, logoContentType: f.type || "image/png" } });
      setBizLogoBusy(false);
      if (err || (data && data.error)) { setError((data && data.error) || err.message); return; }
      setForm((p) => ({ ...p, businessLogoUrl: data.url }));
    };
    r.readAsDataURL(f);
  };

  useEffect(() => {
    (async () => {
      const { data, error: err } = await sb.functions.invoke("portal-settings", { body: { action: "status" } });
      if (err || (data && data.error)) { setError((data && data.error) || err.message); return; }
      if (!data) { setError("Couldn't load settings (empty response). Please refresh."); return; }
      setStatus(data);
      if (data.configured) loadPipelines();   // connected → populate the pipeline/stage dropdowns
      const a = data.businessAddress || {};
      const b = data.branding || {};
      setCurrentLogo(b.logoUrl || null);
      setForm({
        ghlPipelineId: data.ghlPipelineId || "",
        ghlStageSendQuoteId: data.ghlStageSendQuoteId || "",
        ghlStageAcceptedId: data.ghlStageAcceptedId || "",
        ghlStageInvoicedId: data.ghlStageInvoicedId || "",
        ghlStageDeliveredId: data.ghlStageDeliveredId || "",
        businessName: data.businessName || "",
        businessPhone: data.businessPhone || "",
        businessWebsite: data.businessWebsite || "",
        businessLogoUrl: data.businessLogoUrl || "",
        addr1: a.addressLine1 || "", addrCity: a.city || "", addrState: a.state || "", addrZip: a.postalCode || "",
        quoteTerms: data.quoteTerms || "",
        betaMode: Boolean(data.betaMode), betaEmail: data.betaEmail || "", showPricing: Boolean(data.showPricing),
        brandName: b.companyName || "", brandTagline: b.tagline || "",
        brandAccent: b.accentColor || "#D97706", brandHeaderBg: b.headerBg || "#1E293B",
      });
    })();
  }, []);

  const save = async (e) => {
    e.preventDefault();
    setError(null); setSaved(false); setBusy(true);
    const hasAddr = form.addr1 || form.addrCity || form.addrState || form.addrZip;
    const body = {
      action: "save",
      businessName: form.businessName,
      businessPhone: form.businessPhone,
      businessWebsite: form.businessWebsite,
      businessLogoUrl: form.businessLogoUrl,
      businessAddress: hasAddr ? { addressLine1: form.addr1, city: form.addrCity, state: form.addrState, postalCode: form.addrZip, countryCode: "US" } : null,
      quoteTerms: form.quoteTerms,
      betaMode: form.betaMode,
      betaEmail: form.betaEmail,
      showPricing: form.showPricing,
    };
    const { data, error: err } = await sb.functions.invoke("portal-settings", { body });
    setBusy(false);
    if (err || (data && data.error)) { setError((data && data.error) || err.message); return; }
    setSaved(true);
    // refresh masked status
    const { data: st } = await sb.functions.invoke("portal-settings", { body: { action: "status" } });
    if (st && !st.error) setStatus(st);
  };

  // GHL connection: verify the location id + API key against GoHighLevel and save
  // only if they're valid. Location/key fall back to the stored values when left
  // blank. Also surfaces a warning when the location has no users (estimates would
  // fail) or no products (line items unpriced).
  const saveGhl = async () => {
    setGhlMsg(null); setGhlBusy(true);
    // Connection step handles credentials only; pipeline + stages are configured
    // in the "Pipeline & Stages" card that appears once connected.
    const body = { action: "verify_save_ghl" };
    if (ghlLocationId.trim()) body.ghlLocationId = ghlLocationId.trim();
    if (ghlApiKey.trim()) body.ghlApiKey = ghlApiKey.trim();
    const { data, error: err } = await sb.functions.invoke("portal-settings", { body });
    setGhlBusy(false);
    if (err || (data && data.error)) { setGhlMsg({ err: (data && data.error) || (err && err.message) || "Verification failed." }); return; }
    setGhlMsg({ ok: data.warning ? `Verified & saved. ${data.warning}` : "Verified & saved — the connection works.", warn: Boolean(data.warning) });
    setGhlApiKey(""); setGhlLocationId("");
    const { data: st } = await sb.functions.invoke("portal-settings", { body: { action: "status" } });
    if (st && !st.error) setStatus(st);
    loadPipelines();   // now connected → load pipelines/stages for the dropdowns
  };

  // Fetch this tenant's Synergy/GHL pipelines + stages (server-side, using the
  // stored key) to populate the dropdowns. Re-run by the "Refresh" button.
  const loadPipelines = async () => {
    setPipesBusy(true); setPipesMsg(null);
    const { data, error: err } = await sb.functions.invoke("portal-settings", { body: { action: "list_ghl_pipelines" } });
    setPipesBusy(false);
    if (err || (data && data.error)) { setPipesMsg({ err: (data && data.error) || (err && err.message) || "Couldn't load pipelines." }); return; }
    setPipelines(Array.isArray(data.pipelines) ? data.pipelines : []);
  };

  // Save just the pipeline + stage selection (no re-verify of credentials).
  const savePipelines = async () => {
    setPipesSaving(true); setPipesMsg(null);
    const { data, error: err } = await sb.functions.invoke("portal-settings", {
      body: {
        action: "save",
        ghlPipelineId: form.ghlPipelineId,
        ghlStageSendQuoteId: form.ghlStageSendQuoteId,
        ghlStageAcceptedId: form.ghlStageAcceptedId,
        ghlStageInvoicedId: form.ghlStageInvoicedId,
        ghlStageDeliveredId: form.ghlStageDeliveredId,
      },
    });
    setPipesSaving(false);
    if (err || (data && data.error)) { setPipesMsg({ err: (data && data.error) || (err && err.message) || "Save failed." }); return; }
    setPipesMsg({ ok: "Pipeline & stages saved." });
    const { data: st } = await sb.functions.invoke("portal-settings", { body: { action: "status" } });
    if (st && !st.error) setStatus(st);
  };

  // The 4 fulfillment stages map to GHL pipeline stages, each optionally in a DIFFERENT
  // pipeline. "Send Quote" also needs its PIPELINE persisted (submit-estimate places the opp
  // there → ghl_pipeline_id). Accepted/Invoiced/Delivered are matched by their globally-unique
  // STAGE id, so only the stage id is persisted; their pipeline dropdown is UI-only, derived
  // from the saved stage id (fallback: the send-quote pipeline).
  const selectedPipeline = pipelines.find((p) => p.id === form.ghlPipelineId) || null;
  const stageOptions = selectedPipeline ? selectedPipeline.stages : [];
  const onPipelineChange = (e) => {
    const pid = e.target.value;
    const ids = new Set(((pipelines.find((x) => x.id === pid) || {}).stages || []).map((s) => s.id));
    setForm((prev) => ({ ...prev, ghlPipelineId: pid,
      ghlStageSendQuoteId: ids.has(prev.ghlStageSendQuoteId) ? prev.ghlStageSendQuoteId : "" }));
  };
  // Render one derived-pipeline stage-mapping row (Accepted / Invoiced / Delivered).
  const derivedRow = (title, transientPipeKey, stageKey) => {
    const pid = form[transientPipeKey]
      || (pipelines.find((p) => (p.stages || []).some((s) => s.id === form[stageKey])) || {}).id
      || form.ghlPipelineId;
    const opts = (pipelines.find((p) => p.id === pid) || {}).stages || [];
    const onPipe = (e) => {
      const np = e.target.value;
      const ids = new Set(((pipelines.find((x) => x.id === np) || {}).stages || []).map((s) => s.id));
      setForm((prev) => ({ ...prev, [transientPipeKey]: np, [stageKey]: ids.has(prev[stageKey]) ? prev[stageKey] : "" }));
    };
    return (
      <div style={{ border: "1px solid #E2E8F0", borderRadius: 8, padding: 12, marginBottom: 10 }}>
        <div style={{ ...S.lbl, marginBottom: 8 }}>{title}</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 12 }}>
          <div><span style={S.lbl}>Pipeline</span>
            <select style={S.input} value={pid} onChange={onPipe}>
              <option value="">— None —</option>
              {pipelines.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
              {pid && !pipelines.some((p) => p.id === pid) && <option value={pid}>saved: {pid} (refresh to update)</option>}
            </select></div>
          <div><span style={S.lbl}>Stage</span>
            <select style={S.input} value={form[stageKey]} onChange={set(stageKey)} disabled={!pid}>
              <option value="">— None —</option>
              {opts.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
              {form[stageKey] && !opts.some((s) => s.id === form[stageKey]) && <option value={form[stageKey]}>saved: {form[stageKey]}</option>}
            </select></div>
