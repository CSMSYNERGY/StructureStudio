        {ADM_TABS.map(([id, label, , scope], i) => (
          <React.Fragment key={id}>
            {i > 0 && ADM_TABS[i - 1][3] !== scope && (
              <span aria-hidden="true" style={{ width: 1, alignSelf: "stretch", background: "#E2E8F0", margin: "8px 10px 0" }} />
            )}
            <button type="button" onClick={() => setSub(id)} aria-current={sub === id ? "page" : undefined}
              style={{
                background: "none", border: "none", cursor: "pointer", fontFamily: "inherit",
                padding: "12px 14px 10px", fontSize: 13, fontWeight: 700, letterSpacing: 0.2,
                color: sub === id ? ACCENT : "#64748B",
                borderBottom: sub === id ? `2px solid ${ACCENT}` : "2px solid transparent",
                marginBottom: -2,
              }}>
              {label}
            </button>
          </React.Fragment>
        ))}
      </div>
      <div style={{ fontSize: 12, color: "#64748B", margin: "0 0 12px 2px", fontWeight: 600, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <span>{active[1]} — {active[2]}</span>
        <AdmChip tone={active[3] === "global" ? "warn" : "neutral"}>
          {active[3] === "global" ? "Platform-wide" : (selRow ? `For ${selRow.company_name || selRow.client_id}` : "Per builder")}
        </AdmChip>
      </div>

      {bootErr && <div style={S.err}>{bootErr}</div>}
      {msg && msg.err && <div style={S.err}>{msg.err}</div>}
      {msg && msg.ok && <div style={S.okMsg}>{msg.ok}</div>}

      {sub === "clients" && (
        <AdmClients clients={clients} features={features} sel={sel}
          onPick={pickClient} onOpenAccount={onOpenAccount} onFlash={flash} onReload={loadClients} />
      )}
      {sub === "master" && <AdmMaster master={master} />}

      {needsClient && !sel && clients && (
        <div style={S.card}>
          <CardHead title="Choose a builder first"
            desc="Styles, items and pricing are per-builder. Pick the tenant you're setting up and this page fills in." />
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button type="button" onClick={() => setPickerOpen(true)} style={S.btn(ACCENT, "#FFF")}>Choose builder</button>
            <button type="button" onClick={() => setSub("clients")} style={S.btn("#F1F5F9", "#334155")}>Browse all builders</button>
          </div>
        </div>
      )}

      {/* The remount key is the single most important line in this port. Every staged,
          uncommitted thing — ticked item pills, a parsed CSV report, a half-filled billing
          or link-owner form, a chosen style image — lives inside AdminClientPanes, so
          changing client destroys it STRUCTURALLY. In admin.html an effect keyed on
          [sel, cat] wiped the ticks while the UI was still rendering "N unsaved changes". */}
      {needsClient && sel && (
        <AdminClientPanes key={"ac-" + sel} sub={sub} clientId={sel} clientRow={selRow}
          master={master} features={features} onFlash={flash}
          onReloadClients={loadClients} onDeleted={() => { setSel(""); setSub("clients"); try { sessionStorage.removeItem("ss.admin.clientId"); } catch (_e) {} }} />
      )}

      {pickerOpen && (
        <AdmClientPicker clients={clients || []} current={sel}
          onPick={pickClient} onClose={() => setPickerOpen(false)} />
      )}
    </div>
  );
}

// ── Clients (global) ─────────────────────────────────────────────────────────
function AdmClients({ clients, features, sel, onPick, onOpenAccount, onFlash, onReload }) {
  const [q, setQ] = useState("");
  const [openNew, setOpenNew] = useState(false);
  const [id, setId] = useState("");
  const [company, setCompany] = useState("");
  const [tpl, setTpl] = useState("__none__");
  const [idTouched, setIdTouched] = useState(false);
  const [exempt, setExempt] = useState(false);
  const [discount, setDiscount] = useState("0");
  const [allFeat, setAllFeat] = useState(true);
  const [picked, setPicked] = useState([]);
  const [busy, setBusy] = useState(false);

  const term = q.trim().toLowerCase();
  const list = (clients || []).filter((c) => !term
    || String(c.company_name || "").toLowerCase().indexOf(term) !== -1
    || String(c.client_id || "").toLowerCase().indexOf(term) !== -1);

  const slug = id.trim().toLowerCase();
  const taken = (clients || []).some((c) => c.client_id === slug);
  const shapeOk = /^[a-z0-9]([a-z0-9-]*[a-z0-9])?$/.test(slug);
  const idErr = !slug ? null : taken ? "That builder id is already taken." : !shapeOk ? "Lowercase letters, numbers and hyphens only — it becomes their subdomain." : null;
  const canCreate = slug && company.trim() && !idErr && !busy;

  const create = async () => {
    if (!canCreate) return;
    setBusy(true);
    try {
      await adminApi("create_client", {
        clientId: slug, companyName: company.trim(), templateClientId: tpl,
        billingExempt: exempt, discountPercent: exempt ? 0 : (Number(discount) || 0),
        discountFeatures: allFeat ? [] : picked,
      });
      await onReload();
      setOpenNew(false); setId(""); setCompany(""); setTpl("__none__"); setIdTouched(false);
      setExempt(false); setDiscount("0"); setAllFeat(true); setPicked([]);
      onFlash({ ok: `Created “${slug}”. Next: give the owner a login on the Account tab, then styles, items and pricing.` });
      onPick(slug);
    } catch (e) { onFlash({ err: e.message }); }
    setBusy(false);
  };

  return (
    <>
      <div style={S.card}>
        <CardHead title="Builder accounts"
          count={clients ? (term ? `${list.length} of ${clients.length}` : clients.length) : null}
          desc="Every tenant on the platform. Manage puts a builder into the tabs above; Open portal takes you into their account as an operator."
          right={<button type="button" onClick={() => setOpenNew((v) => !v)} style={S.btn(ACCENT, "#FFF")}>
            {openNew ? "Cancel" : "+ New builder"}
          </button>} />
        <SearchInput value={q} onChange={setQ} placeholder="Search builders…" />
        {clients === null && <div style={{ fontSize: 13, color: "#94A3B8" }}>Loading builders…</div>}
        {clients && list.length === 0 && (
          <div style={{ fontSize: 13, color: "#94A3B8" }}>{term ? `No builders match “${q}”.` : "No builders yet — create the first one above."}</div>
        )}
        {list.map((c) => (
          <div key={c.client_id} style={ADM_ROW}>
            <AdmTile name={c.company_name || c.client_id} />
            <div style={{ minWidth: 0, flex: 1 }}>
              <div style={{ fontSize: 13.5, fontWeight: 700, color: "#1E293B" }}>{c.company_name || c.client_id}</div>
              <div style={{ fontSize: 11.5, color: "#94A3B8" }}>{c.client_id}</div>
            </div>
            {c.client_id === sel && <AdmChip tone="on">Selected</AdmChip>}
            {c.billingExempt ? <AdmChip tone="good" title="Not billed">Comped</AdmChip>
              : c.discountPercent > 0 ? <AdmChip tone="on" title="Account discount">−{c.discountPercent}%</AdmChip> : null}
            <button type="button" onClick={() => onPick(c.client_id)} title="Administer this builder"
              style={{ ...S.btn("#FFFFFF", ACCENT), border: "1px solid " + ACCENT, padding: "6px 12px", fontSize: 12 }}>Manage</button>
            {onOpenAccount && (
              <button type="button" onClick={() => onOpenAccount({ clientId: c.client_id, companyName: c.company_name || c.client_id })}
                title="Open their portal and act as them"
                style={{ ...S.btn("#F1F5F9", "#334155"), padding: "6px 12px", fontSize: 12 }}>Open portal</button>
            )}
          </div>
        ))}
      </div>

      {openNew && (
        <div style={S.card}>
          <CardHead title="Create a builder" desc="The builder id becomes their subdomain and can't be changed afterwards, so get it right here." />
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(220px,1fr))", gap: 12 }}>
            <div>
              <label style={S.lbl}>Company name</label>
              <input value={company} autoFocus
                onChange={(e) => { setCompany(e.target.value); if (!idTouched) setId(slugify(e.target.value)); }}
                placeholder="Junior Barns" style={S.input} />
            </div>
            <div>
              <label style={S.lbl}>Builder id</label>
              <input value={id} onChange={(e) => { setIdTouched(true); setId(e.target.value); }}
                placeholder="junior-barns" style={{ ...S.input, borderColor: idErr ? "#DC2626" : "#CBD5E1" }} />
              <div style={{ fontSize: 11, color: idErr ? "#DC2626" : "#94A3B8", marginTop: 6 }}>
                {idErr || (idTouched ? "Becomes junior-barns.structurestudio.app." : "Auto-generated from the company name — edit to override.")}
              </div>
            </div>
            <div>
              <label style={S.lbl}>Copy catalog from</label>
              <select value={tpl} onChange={(e) => setTpl(e.target.value)} style={S.input}>
                <option value="__none__">Start empty</option>
                {(clients || []).map((c) => <option key={c.client_id} value={c.client_id}>{c.company_name || c.client_id}</option>)}
              </select>
              <div style={{ fontSize: 11, color: "#94A3B8", marginTop: 6 }}>Copies styles, sizes and items — not designs or settings.</div>
            </div>
          </div>
          <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid #F1F5F9" }}>
            <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: "#1E293B", cursor: "pointer" }}>
              <input type="checkbox" checked={exempt} onChange={(e) => setExempt(e.target.checked)} />
              <span>Non-billable — CSM Synergy's own, demo or testing account (skips the billing gate)</span>
            </label>
            <div style={{ marginTop: 10, maxWidth: 220, opacity: exempt ? 0.5 : 1, pointerEvents: exempt ? "none" : "auto" }}>
              <label style={S.lbl}>Account discount %</label>
              <input value={discount} onChange={(e) => setDiscount(e.target.value)} inputMode="numeric" style={S.input} />
            </div>
            {!exempt && Number(discount) > 0 && (
              <FeatureScope features={features} all={allFeat} setAll={setAllFeat} picked={picked} setPicked={setPicked} />
            )}
          </div>
          <div style={{ marginTop: 16 }}>
            <button type="button" onClick={create} disabled={!canCreate}
              title={!canCreate ? (idErr || "Enter a company name and a builder id") : undefined}
              style={{ ...S.btn(ACCENT, "#FFF"), opacity: canCreate ? 1 : 0.6, cursor: canCreate ? "pointer" : "not-allowed" }}>
              {busy ? "Creating…" : "Create builder"}
            </button>
          </div>
        </div>
      )}
    </>
  );
}

// ── Master catalog (global, read-only) ───────────────────────────────────────
function AdmMaster({ master }) {
  const [q, setQ] = useState("");
  const items = (master && master.layoutItemTypes) || [];
  const term = q.trim().toLowerCase();
  const list = items.filter((i) => !term
    || String(i.label || "").toLowerCase().indexOf(term) !== -1
    || String(i.item_key || "").toLowerCase().indexOf(term) !== -1);
  return (
    <div style={S.card}>
      <CardHead title="Master layout items" count={master ? items.length : null}
        desc="The platform-wide palette. Every builder's Items tab is a selection from this list — nothing here belongs to one tenant, and turning an item on for a builder never edits this." />
      {!master && <div style={{ fontSize: 13, color: "#94A3B8" }}>Loading master catalog…</div>}
      {master && items.length > 0 && <SearchInput value={q} onChange={setQ} placeholder="Search items…" />}
      {master && items.length === 0 && <div style={{ fontSize: 13, color: "#94A3B8" }}>No master items defined yet.</div>}
      {master && items.length > 0 && list.length === 0 && <div style={{ fontSize: 13, color: "#94A3B8" }}>No items match “{q}”.</div>}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
        {list.map((i) => (
          <div key={i.item_key} title={i.item_key}
            style={{ display: "flex", alignItems: "center", gap: 7, border: "1px solid #E2E8F0", background: "#F8FAFC", borderRadius: 9, padding: "7px 11px", fontSize: 12.5, fontWeight: 600, color: "#334155" }}>
            <span style={{ color: "#64748B", display: "flex" }}>{layoutItemGlyph(i)}</span>
            {i.label || i.item_key}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Per-client panes ─────────────────────────────────────────────────────────
// Mounted with key={"ac-" + clientId}. Everything staged and uncommitted lives HERE, so a
// client change destroys it structurally rather than by an effect that races the render.
function AdminClientPanes({ sub, clientId, clientRow, master, features, onFlash, onReloadClients, onDeleted }) {
  const [cat, setCat] = useState(null);
  const [catErr, setCatErr] = useState(null);

  const loadCat = useCallback(async () => {
    setCatErr(null);
    try { setCat(await adminApi("get_client_catalog", { clientId })); }
    catch (e) { setCatErr(e.message || "Could not load this builder's catalog."); }
  }, [clientId]);

  useEffect(() => { loadCat(); }, [loadCat]);

  // Write, then report, then refresh — in that order, and refresh failures are swallowed.
  // Ported deliberately from admin.html's act(): a failing get_client_catalog must never
  // mask a write that actually landed.
  const act = async (action, body, okMsg) => {
    try { await adminApi(action, body); }
    catch (e) { onFlash({ err: e.message }); return false; }
    onFlash({ ok: okMsg || "Saved." });
    try { setCat(await adminApi("get_client_catalog", { clientId })); } catch (_e) { /* catches up next action */ }
    return true;
  };

  const label = (clientRow && clientRow.company_name) || clientId;
  const common = { clientId, clientRow, label, cat, setCat, master, features, onFlash, act, loadCat, onReloadClients };

  if (catErr && sub !== "account") return <div style={S.err}>{catErr}</div>;

  return (
    <>
      {sub === "account" && <AdmAccount {...common} onDeleted={onDeleted} />}
      {sub === "styles" && <AdmStyles {...common} />}
      {sub === "items" && <AdmItems {...common} />}
      {sub === "pricing" && <AdmPricing {...common} />}
    </>
  );
}

function AdmAccount({ clientId, clientRow, label, features, onFlash, onReloadClients, onDeleted }) {
  const [email, setEmail] = useState("");
  const [role, setRole] = useState("owner");
  const [linkBusy, setLinkBusy] = useState(false);
  const [linkResult, setLinkResult] = useState(null);
  const [reassignFrom, setReassignFrom] = useState(null);
  const [copied, setCopied] = useState(null);

  const [pct, setPct] = useState(String((clientRow && clientRow.discountPercent) ?? 0));
  const [exempt, setExempt] = useState(Boolean(clientRow && clientRow.billingExempt));
  const scoped = Array.isArray(clientRow && clientRow.discountFeatures) ? clientRow.discountFeatures : [];
  const [allFeat, setAllFeat] = useState(scoped.length === 0);
  const [picked, setPicked] = useState(scoped);
  const [until, setUntil] = useState(clientRow && clientRow.exemptUntil ? String(clientRow.exemptUntil).slice(0, 10) : "");
  const [billBusy, setBillBusy] = useState(false);

  const [delOpen, setDelOpen] = useState(false);

  const emailOk = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.trim());

  const link = async (reassign) => {
    if (!emailOk || linkBusy) return;
    setLinkBusy(true); setLinkResult(null);
    const addr = email.trim();
    try {
      const r = await adminApi("link_owner", { clientId, email: addr, role, ...(reassign ? { reassign: true } : {}) });
      const roleLabel = (r && r.role === "user") ? "team member (Designs & Leads only)" : "admin";
      setLinkResult({ email: addr, roleLabel, created: !!(r && r.created), emailSent: !!(r && r.emailSent), setupLink: (r && r.setupLink) || null, movedFrom: reassign && reassignFrom ? reassignFrom.fromClient : null });
      setEmail(""); setReassignFrom(null);
      onFlash({ ok: `“${addr}” ${reassign ? "reassigned to" : "linked to"} ${label} as ${roleLabel}.` });
    } catch (e) {
      const m = e.message || String(e);
      if (/reassign\s*:\s*true/i.test(m)) {
        // Tolerates BOTH wordings: the server said "client" before the 2026-08-02
        // builder rename, and an operator's browser can be running a cached page
        // against a newer function (or vice versa) — a strict match would silently
        // stop naming the tenant in the reassign prompt.
        const hit = /already linked to (?:client|builder) "([^"]+)"/.exec(m);
        setReassignFrom({ email: addr, fromClient: hit ? hit[1] : null });
      } else setReassignFrom(null);
      onFlash({ err: m });
    }
    setLinkBusy(false);
  };

  const copy = async (text) => {
    // admin.html fired this unawaited and flashed success unconditionally — it reported
    // "copied" even when the write rejected. Await it, and the link stays on screen either way.
    try { await navigator.clipboard.writeText(text); setCopied(true); }
    catch (_e) { setCopied(false); }
    setTimeout(() => setCopied(null), 4000);
  };

  const saveBilling = async () => {
    const n = Math.round(Number(pct));
    if (!Number.isFinite(n) || n < 0 || n > 100) { onFlash({ err: "Discount must be a whole number from 0 to 100." }); return; }
    if (n > 0 && !exempt && !allFeat && picked.length === 0) { onFlash({ err: "Choose which features the discount applies to, or select “Every feature”." }); return; }
    setBillBusy(true);
    try {
      const r = await adminApi("set_billing", { clientId, billingExempt: exempt, discountPercent: n, discountFeatures: allFeat ? [] : picked, exemptUntil: until });
      await onReloadClients();
      onFlash({ ok: `Billing saved for ${label}. ${(r && r.note) || ""}`.trim() });
    } catch (e) { onFlash({ err: e.message }); }
    setBillBusy(false);
  };

  return (
    <>
      <div style={S.card}>
        <CardHead title="Owner logins" desc="Grant someone access to this builder's portal. A new email gets a one-time set-up link; an email already attached to another builder has to be moved deliberately." />
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div style={{ flex: "1 1 240px", minWidth: 200 }}>
            <label style={S.lbl}>Email</label>
            <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder="owner@theirbusiness.com"
              onKeyDown={(e) => { if (e.key === "Enter" && emailOk) link(false); }} style={S.input} />
          </div>
          <div style={{ width: 200 }}>
            <label style={S.lbl}>Role</label>
            <select value={role} onChange={(e) => setRole(e.target.value)} style={S.input}>
              <option value="owner">Admin — full access</option>
              <option value="user">Team member — Designs &amp; Leads only</option>
            </select>
          </div>
          <button type="button" onClick={() => link(false)} disabled={!emailOk || linkBusy}
            title={!emailOk ? "Enter a valid email address" : undefined}
            style={{ ...S.btn(ACCENT, "#FFF"), opacity: (!emailOk || linkBusy) ? 0.6 : 1, cursor: emailOk && !linkBusy ? "pointer" : "not-allowed" }}>
            {linkBusy ? "Linking…" : "Link login"}
          </button>
        </div>
        {reassignFrom && (
          <div style={{ background: "#FEF3C7", border: "1px solid #F59E0B", borderRadius: 8, padding: "10px 14px", color: "#92400E", fontSize: 12.5, marginTop: 12, lineHeight: 1.5 }}>
            <strong>{reassignFrom.email}</strong> already belongs to <strong>{reassignFrom.fromClient || "another builder"}</strong>.
            Moving them removes their access to that account.
            <div style={{ marginTop: 8 }}>
              <button type="button" onClick={() => { setEmail(reassignFrom.email); link(true); }} disabled={linkBusy}
                style={{ ...S.btn("#92400E", "#FFF"), padding: "6px 12px", fontSize: 12 }}>Move them to {label}</button>
            </div>
          </div>
        )}
        {linkResult && (
          <div style={{ ...S.okMsg, marginTop: 12, marginBottom: 0 }}>
            <div>{linkResult.email} — {linkResult.roleLabel}{linkResult.created ? " · login created" : ""}{linkResult.emailSent ? " · invite emailed" : ""}</div>
            {linkResult.setupLink && (
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8 }}>
                <input readOnly value={linkResult.setupLink} onFocus={(e) => e.target.select()}
                  style={{ ...S.input, fontFamily: "ui-monospace, monospace", fontSize: 11, fontWeight: 400 }} />
                <button type="button" onClick={() => copy(linkResult.setupLink)} style={{ ...S.btn("#F1F5F9", "#334155"), padding: "7px 12px", fontSize: 12, flexShrink: 0 }}>
                  {copied === true ? "Copied" : copied === false ? "Copy failed" : "Copy"}
                </button>
              </div>
            )}
          </div>
        )}
      </div>

      <div style={S.card}>
        <CardHead title="Billing posture" desc="An attribute of the account, not of a purchase — it follows them onto every feature they add later." />
        <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: "#1E293B", cursor: "pointer" }}>
          <input type="checkbox" checked={exempt} onChange={(e) => setExempt(e.target.checked)} />
          <span>Non-billable — skips the billing gate entirely</span>
        </label>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginTop: 12 }}>
          <div style={{ width: 180, opacity: exempt ? 0.5 : 1, pointerEvents: exempt ? "none" : "auto" }}>
            <label style={S.lbl}>Account discount %</label>
            <input value={pct} onChange={(e) => setPct(e.target.value)} inputMode="numeric" style={S.input} />
          </div>
          <div style={{ width: 200 }}>
            <label style={S.lbl}>Free until (optional)</label>
            <input type="date" value={until} onChange={(e) => setUntil(e.target.value)} style={S.input} />
          </div>
        </div>
        {!exempt && Number(pct) > 0 && (
          <FeatureScope features={features} all={allFeat} setAll={setAllFeat} picked={picked} setPicked={setPicked} />
        )}
        <div style={{ marginTop: 16 }}>
          <button type="button" onClick={saveBilling} disabled={billBusy}
            style={{ ...S.btn(ACCENT, "#FFF"), opacity: billBusy ? 0.6 : 1 }}>{billBusy ? "Saving…" : "Save billing"}</button>
        </div>
      </div>

      {/* The only tinted card in the shell, which is what makes the tint mean something.
          Last card on the tab, below a scroll — unreachable by accident, and impossible to
          hit while aiming for "Billing", which is exactly what the old button row made easy. */}
      <div style={{ ...S.card, background: "#FEE2E2", border: "1px solid #DC2626" }}>
        <div style={{ fontSize: 15, fontWeight: 800, color: "#991B1B", letterSpacing: 0.3, marginBottom: 6 }}>Danger zone</div>
        <div style={{ fontSize: 12.5, color: "#991B1B", lineHeight: 1.55, marginBottom: 14 }}>
          Deleting {label} erases their catalog, designs, settings, logins and stored images. It cannot be
          undone, and it still asks for the operator password even though you're signed in.
        </div>
        <button type="button" onClick={() => setDelOpen(true)} style={S.btn("#FEF2F2", "#DC2626")}>Delete this builder…</button>
      </div>

      {delOpen && (
        <AdmDeleteDialog client={clientRow || { client_id: clientId }} onClose={() => setDelOpen(false)}
          onDeleted={async (id, r) => {
            setDelOpen(false);
            const parts = (r && r.deleted) ? Object.entries(r.deleted).filter(([, v]) => v).map(([k, v]) => `${v} ${k}`).join(", ") : "";
            await onReloadClients();
            onFlash({ ok: `Deleted “${id}”${parts ? ` (${parts})` : ""}.` });
            onDeleted();
          }} />
      )}
    </>
  );
}

function AdmStyles({ clientId, label, cat, setCat, onFlash, act }) {
  const [name, setName] = useState("");
  const [img, setImg] = useState(null);
  const [fileKey, setFileKey] = useState(0);
  const [busy, setBusy] = useState(false);
  const [styleBusy, setStyleBusy] = useState({});   // per-row, not page-wide
  const styles = (cat && cat.buildingStyles) || [];
  const sizes = (cat && cat.buildingSizes) || [];
  const ALLOWED = ["image/jpeg", "image/png", "image/webp", "image/gif"];

  const pickImg = (file) => {
    if (!file) { setImg(null); return; }
    if (ALLOWED.indexOf(file.type) === -1) { onFlash({ err: "Use a JPG, PNG, WEBP or GIF image." }); setFileKey((k) => k + 1); return; }
    if (file.size > 3000000) { onFlash({ err: "Image too large — 3 MB maximum." }); setFileKey((k) => k + 1); return; }
    const r = new FileReader();
    r.onerror = () => onFlash({ err: "Could not read that image." });
    r.onload = () => setImg({ base64: r.result, contentType: file.type || "image/jpeg" });
    r.readAsDataURL(file);
  };

  const toggle = async (row) => {
    setStyleBusy((b) => ({ ...b, [row.key]: true }));
    // Optimistic: one idempotent boolean, and the authoritative refresh follows anyway.
    setCat((c) => ({ ...c, buildingStyles: (c.buildingStyles || []).map((s) => s.key === row.key ? { ...s, active: !s.active } : s) }));
    const ok = await act("save_style", { clientId, styleKey: row.key, active: !row.active },
      `${row.label || row.key} is now ${row.active ? "hidden" : "active"}.`);
    if (!ok) setCat((c) => ({ ...c, buildingStyles: (c.buildingStyles || []).map((s) => s.key === row.key ? { ...s, active: row.active } : s) }));
    setStyleBusy((b) => { const n = { ...b }; delete n[row.key]; return n; });
  };

  const create = async () => {
    if (!name.trim() || busy) return;
    setBusy(true);
    try {
      let imageUrl = null;
      if (img) {
        const up = await adminApi("upload_image", { clientId, base64: img.base64, contentType: img.contentType });
        imageUrl = (up && up.url) || null;
      }
      await adminApi("create_style", { clientId, label: name.trim(), ...(imageUrl ? { imageUrl } : {}) });
      setName(""); setImg(null); setFileKey((k) => k + 1);
      onFlash({ ok: `Added “${name.trim()}”.` });
      setCat(await adminApi("get_client_catalog", { clientId }));
    } catch (e) { onFlash({ err: e.message }); }
    setBusy(false);
  };

  return (
    <>
      <div style={S.card}>
        <CardHead title="Building styles" count={cat ? styles.length : null}
          desc={`What ${label} offers on their design page. Hiding a style stops offering it without touching its sizes or prices.`} />
        {!cat && <div style={{ fontSize: 13, color: "#94A3B8" }}>Loading catalog…</div>}
        {cat && styles.length === 0 && <div style={{ fontSize: 13, color: "#94A3B8" }}>No styles yet — add one below.</div>}
        {styles.map((row) => {
          // Sizes join on the style's UUID `id`, NOT its `key`. Getting this wrong is silent:
          // every style renders "0 sizes" while the tenant actually has dozens.
          const mine = sizes.filter((s) => s.style_id === row.id);
          return (
            <div key={row.key} style={{ ...ADM_ROW, alignItems: "flex-start", flexWrap: "wrap" }}>
              <div style={{ minWidth: 0, flex: 1 }}>
                <div style={{ fontSize: 13.5, fontWeight: 700, color: "#1E293B" }}>{row.label || row.key}</div>
                <div style={{ fontSize: 11.5, color: "#94A3B8" }}>
                  {row.key} · {mine.length} size{mine.length === 1 ? "" : "s"}
                  {mine.length > 0 && <> · {mine.slice(0, 6).map((s) => `${s.width_ft}×${s.length_ft}`).join(", ")}{mine.length > 6 ? "…" : ""}</>}
                </div>
              </div>
              <AdmChip tone={row.active ? "good" : "neutral"}>{row.active ? "Active" : "Hidden"}</AdmChip>
              <button type="button" onClick={() => toggle(row)} disabled={!!styleBusy[row.key]} aria-pressed={!!row.active}
                style={{ ...S.btn("#F1F5F9", "#334155"), padding: "6px 12px", fontSize: 12, opacity: styleBusy[row.key] ? 0.6 : 1 }}>
                {styleBusy[row.key] ? "Saving…" : row.active ? "Hide" : "Show"}
              </button>
            </div>
          );
        })}
      </div>

      <div style={S.card}>
        <CardHead title="Add a style" desc="The photo shows on their design page. Sizes and prices come from the Pricing tab once the style exists." />
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div style={{ flex: "1 1 220px", minWidth: 180 }}>
            <label style={S.lbl}>Style name</label>
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Lofted Barn"
              onKeyDown={(e) => { if (e.key === "Enter") create(); }} style={S.input} />
          </div>
          <div style={{ flex: "1 1 220px", minWidth: 180 }}>
            <label style={S.lbl}>Photo (optional, max 3 MB)</label>
            <input key={fileKey} type="file" accept="image/*" onChange={(e) => pickImg(e.target.files && e.target.files[0])}
              style={{ ...S.input, padding: 6, fontWeight: 400 }} />
          </div>
          <button type="button" onClick={create} disabled={!name.trim() || busy}
            style={{ ...S.btn(ACCENT, "#FFF"), opacity: (!name.trim() || busy) ? 0.6 : 1 }}>{busy ? "Adding…" : "Add style"}</button>
        </div>
        {img && <div style={{ fontSize: 11.5, color: "#15803D", marginTop: 8 }}>Image ready — it uploads when you add the style.</div>}
      </div>
    </>
  );
}

function AdmItems({ clientId, label, cat, setCat, master, onFlash }) {
  const assigned = useMemo(() => new Set(((cat && cat.clientLayoutItems) || []).filter((i) => i.active).map((i) => i.item_key)), [cat]);
  const [staged, setStaged] = useState(null);      // null until cat lands
  const [q, setQ] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => { if (cat) setStaged(new Set(assigned)); }, [cat, assigned]);

  const all = (master && master.layoutItemTypes) || [];
  const term = q.trim().toLowerCase();
  const list = all.filter((i) => !term
    || String(i.label || "").toLowerCase().indexOf(term) !== -1
    || String(i.item_key || "").toLowerCase().indexOf(term) !== -1);

  const sel = staged || new Set();
  const toEnable = all.filter((i) => sel.has(i.item_key) && !assigned.has(i.item_key));
  const toDisable = all.filter((i) => !sel.has(i.item_key) && assigned.has(i.item_key));
  const pending = toEnable.length + toDisable.length;

  const save = async () => {
    if (!pending || busy) return;
    setBusy(true);
    try {
      for (const i of toEnable) await adminApi("toggle_item", { clientId, itemKey: i.item_key, active: true });
      for (const i of toDisable) await adminApi("toggle_item", { clientId, itemKey: i.item_key, active: false });
    } catch (e) {
      // N sequential writes with no transaction: say so rather than implying all-or-nothing.
      onFlash({ err: `${e.message} — some changes may already have been applied; the list below has been refreshed.` });
      try { setCat(await adminApi("get_client_catalog", { clientId })); } catch (_e) {}
      setBusy(false); return;
    }
    onFlash({ ok: `Saved ${pending} change${pending === 1 ? "" : "s"}.` });
    try { setCat(await adminApi("get_client_catalog", { clientId })); } catch (_e) {}
    setBusy(false);
  };

  return (
    <div style={S.card}>
      <CardHead title="Layout items" count={cat && master ? `${sel.size} of ${all.length}` : null}
        desc={`Which items ${label}'s customers can place on a building. Ticking is staged — nothing is written until you save.`}
        right={<>
          <button type="button" onClick={() => setStaged(new Set(all.map((i) => i.item_key)))} disabled={!cat || busy} style={{ ...S.btn("#F1F5F9", "#334155"), padding: "6px 12px", fontSize: 12 }}>Select all</button>
          <button type="button" onClick={() => setStaged(new Set())} disabled={!cat || busy} style={{ ...S.btn("#F1F5F9", "#334155"), padding: "6px 12px", fontSize: 12 }}>Clear</button>
        </>} />
      {(!cat || !master) && <div style={{ fontSize: 13, color: "#94A3B8" }}>Loading items…</div>}
      {cat && master && (
        <>
          {pending > 0 && (
            <div style={{ background: "#FEF3C7", border: "1px solid #F59E0B", borderRadius: 8, padding: "10px 14px", color: "#92400E", fontSize: 12.5, fontWeight: 600, marginBottom: 12, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <span>{pending} unsaved change{pending === 1 ? "" : "s"} for {label}{toEnable.length ? ` · +${toEnable.length}` : ""}{toDisable.length ? ` · −${toDisable.length}` : ""}</span>
              <button type="button" onClick={() => setStaged(new Set(assigned))} disabled={busy}
                style={{ ...S.btn("#FEF3C7", "#92400E"), border: "1px solid #F59E0B", padding: "4px 10px", fontSize: 11.5, marginLeft: "auto" }}>Discard</button>
            </div>
          )}
          {all.length > 12 && <SearchInput value={q} onChange={setQ} placeholder="Filter items…" />}
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {list.map((i) => {
              const on = sel.has(i.item_key);
              const changed = on !== assigned.has(i.item_key);
              return (
                <button key={i.item_key} type="button" aria-pressed={on} title={i.item_key}
                  onClick={() => setStaged((prev) => { const n = new Set(prev); n.has(i.item_key) ? n.delete(i.item_key) : n.add(i.item_key); return n; })}
                  style={{
                    display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontFamily: "inherit",
                    borderRadius: 9, padding: "7px 11px", fontSize: 12.5, fontWeight: 700,
                    background: on ? "#DBEAFF" : "#FFF",
                    color: on ? "#3D3672" : "#64748B",
                    border: changed ? "1px solid #F59E0B" : on ? "1px solid #C3D9F7" : "1px solid #E2E8F0",
                    boxShadow: changed ? "0 0 0 2px #FEF3C7" : "none",
                  }}>
                  <span style={{ display: "flex" }}>{layoutItemGlyph(i)}</span>
                  {i.label || i.item_key}
                </button>
              );
            })}
          </div>
          {list.length === 0 && <div style={{ fontSize: 13, color: "#94A3B8" }}>{term ? `No items match “${q}”.` : "The master catalog is empty."}</div>}
          <div style={{ marginTop: 16 }}>
            <button type="button" onClick={save} disabled={!pending || busy}
              title={!pending ? "No changes to save" : undefined}
              style={{ ...S.btn(ACCENT, "#FFF"), opacity: (!pending || busy) ? 0.6 : 1, cursor: pending && !busy ? "pointer" : "not-allowed" }}>
              {busy ? "Saving…" : pending ? `Save ${pending} change${pending === 1 ? "" : "s"}` : "Save"}
            </button>
          </div>
        </>
      )}
    </div>
  );
}

function AdmPricing({ clientId, label, cat, setCat, master, onFlash }) {
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);
  const [fileKey, setFileKey] = useState(0);
  const [warn, setWarn] = useState(null);   // { unmatched[], rows, headers }

  const items = useMemo(() => {
    const active = ((cat && cat.clientLayoutItems) || []).filter((i) => i.active);
    const byKey = {};
    ((master && master.layoutItemTypes) || []).forEach((m) => { byKey[m.item_key] = m.label || m.item_key; });
    return active.map((i) => ({ key: i.item_key, label: byKey[i.item_key] || i.item_key }));
  }, [cat, master]);

  const download = () => {
    const headers = ["style", "width", "length", "price"].concat(items.map((i) => i.label)).concat(["active"]);
    const styles = (cat && cat.buildingStyles) || [];
    const sizes = (cat && cat.buildingSizes) || [];
    const inc = (cat && cat.inclusions) || [];
    const rows = sizes.map((s) => {
      // Join on the style's UUID `id` — buildingSizes carries `style_id`, never `style_key`.
      const st = styles.find((x) => x.id === s.style_id);
      const base = [st ? (st.label || st.key) : "", s.width_ft, s.length_ft, s.base_price];
      const counts = items.map((i) => {
        const hit = inc.find((n) => n.size_id === s.id && n.item_key === i.key);
        return hit ? hit.qty : 0;
      });
      return base.concat(counts).concat([s.active === false ? "no" : "yes"]);
    });
    downloadFile(`${clientId}-pricing.csv`, toCSV(headers, rows));
  };

  const doImport = async (rows) => {
    setBusy(true); setWarn(null);
    try {
      const res = await adminApi("import_pricing_csv", { clientId, rows });
      setResult(res);
      setCat(await adminApi("get_client_catalog", { clientId }));
      onFlash({ ok: `Imported ${res.imported || 0} size(s)${res.skipped && res.skipped.length ? `; ${res.skipped.length} row(s) skipped — listed below.` : "."}` });
    } catch (e) { onFlash({ err: e.message }); }
    setBusy(false);
    setFileKey((k) => k + 1);
  };

  const onFile = async (file) => {
    if (!file) return;
    setResult(null);
    let text = "";
    try { text = await file.text(); } catch (_e) { onFlash({ err: "Could not read that file." }); return; }
    const grid = parseCSV(text);
    if (grid.length < 2) { onFlash({ err: "That file has no data rows." }); setFileKey((k) => k + 1); return; }
    const headers = grid[0].map((h) => String(h || "").trim());
    const RESERVED = ["style", "width", "length", "price", "active"];
    const labelToKey = {};
    items.forEach((i) => { labelToKey[i.label.toLowerCase()] = i.key; labelToKey[i.key.toLowerCase()] = i.key; });
    const unmatched = headers.filter((h) => h && RESERVED.indexOf(h.toLowerCase()) === -1 && !labelToKey[h.toLowerCase()]);
    const rows = grid.slice(1).map((r) => {
      const o = { inclusions: {} };
      headers.forEach((h, i) => {
        const v = r[i];
        const lower = String(h || "").toLowerCase();
        if (lower === "style") o.style = v;
        else if (lower === "width") o.width = v;
        else if (lower === "length") o.length = v;
        else if (lower === "price") o.price = v;
        else if (lower === "active") o.active = v;
        else { const k = labelToKey[lower]; if (k) o.inclusions[k] = v; }
      });
      return o;
    });
    // A template exported for a different client imports its prices happily and drops every
    // inclusion column without a word — the old console gave no signal at all, because
    // unmatched columns never reach the server's `skipped` list.
    const styleNames = new Set(((cat && cat.buildingStyles) || []).map((s) => String(s.label || s.key).toLowerCase()));
    const anyStyleMatch = rows.some((r) => styleNames.has(String(r.style || "").toLowerCase()));
    if (!anyStyleMatch) {
      onFlash({ err: `None of the styles in that file match ${label}'s styles — it looks like it was exported for a different builder. Nothing was imported.` });
      setFileKey((k) => k + 1);
      return;
    }
    if (unmatched.length) { setWarn({ unmatched, rows }); return; }
    doImport(rows);
  };

  return (
    <>
      <div style={S.card}>
        <CardHead title="Sizes &amp; prices" desc={`Download ${label}'s current sizes as a spreadsheet, edit it, and upload it back. Columns are one per active layout item, so the file matches whatever the Items tab has switched on.`} />
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
          <button type="button" onClick={download} disabled={!cat} style={S.btn("#F1F5F9", "#334155")}>Download template</button>
          <div style={{ flex: "1 1 240px", minWidth: 200 }}>
            <label style={S.lbl}>Upload a filled-in file</label>
            <input key={fileKey} type="file" accept=".csv,text/csv" disabled={busy || !cat}
              onChange={(e) => onFile(e.target.files && e.target.files[0])}
              style={{ ...S.input, padding: 6, fontWeight: 400 }} />
          </div>
        </div>
        {busy && <div style={{ fontSize: 12.5, color: "#64748B", marginTop: 10 }}>Importing…</div>}
        {warn && (
          <div style={{ background: "#FEF3C7", border: "1px solid #F59E0B", borderRadius: 8, padding: "12px 14px", color: "#92400E", fontSize: 12.5, marginTop: 12, lineHeight: 1.55 }}>
            <strong>{warn.unmatched.length} column{warn.unmatched.length === 1 ? "" : "s"}</strong> in this file don't match any item switched on for {label}, and will be ignored:
            <div style={{ marginTop: 6, fontWeight: 700 }}>{warn.unmatched.join(", ")}</div>
            <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
              <button type="button" onClick={() => doImport(warn.rows)} style={{ ...S.btn("#92400E", "#FFF"), padding: "6px 12px", fontSize: 12 }}>Import anyway</button>
              <button type="button" onClick={() => { setWarn(null); setFileKey((k) => k + 1); }} style={{ ...S.btn("#FEF3C7", "#92400E"), border: "1px solid #F59E0B", padding: "6px 12px", fontSize: 12 }}>Cancel</button>
            </div>
          </div>
        )}
        {result && (
          <div style={{ marginTop: 12 }}>
            <div style={S.okMsg}>Imported {result.imported || 0} size(s){result.created ? ` · ${result.created} created` : ""}{result.updated ? ` · ${result.updated} updated` : ""}.</div>
            {result.skipped && result.skipped.length > 0 && (
              <div style={{ fontSize: 12, color: "#92400E", background: "#FEF3C7", border: "1px solid #FCD34D", borderRadius: 8, padding: "10px 14px" }}>
                <div style={{ fontWeight: 700, marginBottom: 4 }}>{result.skipped.length} row(s) skipped</div>
                {result.skipped.slice(0, 12).map((s, i) => <div key={i}>{typeof s === "string" ? s : JSON.stringify(s)}</div>)}
                {result.skipped.length > 12 && <div>…and {result.skipped.length - 12} more.</div>}
              </div>
            )}
          </div>
        )}
      </div>
    </>
  );
}

// `sub`/`onSub` are supplied by Dashboard so the sub-page lives in the URL
// (/portal/settings/colors). The internal fallback keeps the shell usable if it is ever
// ─── QuickBooks (Settings → QuickBooks) ─────────────────────────────────────
// Connection card + the estimate-line → QuickBooks-item mapping grid. All data flows
// through portal-settings (qbo_status / list_item_map / save_item_map / list_qbo_items /
// qbo_test / disconnect_qbo) and qbo-oauth-connect; tokens never reach the browser.
//
// The OAuth round trip lands back on /portal/settings/quickbooks?connected=… — this view
// reads that flag once, shows a banner, and strips it from the URL so a refresh doesn't
// re-announce a stale result.
const QBO_KINDS = [
  ["building", "Building", "The base building price line"],
  ["paint", "Paint", "Paint / color upgrade lines"],
  ["roof", "Roof", "Roof upgrade lines"],
  ["door", "Doors", "Catalog doors placed on the design"],
  ["layout_item", "Layout items", "One mapping per placeable item (windows, lofts, workbenches…)"],
  ["custom_option", "Custom options", "Tenant-defined add-on options"],
  ["discount", "Discount", "Optional — QuickBooks' built-in discount is used when unmapped"],
  ["delivery", "Delivery", "Pushed non-taxable"],
  ["fallback", "Fallback", "Used for any line with no mapping of its own"],
];

const QBO_REASONS = {
  denied: "You cancelled the connection at Intuit. Nothing was changed.",
  state: "That connection attempt expired or didn't match. Start it again from this page.",
  exchange: "Intuit didn't accept the connection. Try again.",
  verify: "Connected at Intuit, but QuickBooks couldn't be reached to confirm. Try again.",
  realm_in_use: "That QuickBooks company is already connected to a different StructureStudio account.",
  unconfigured: "QuickBooks isn't fully set up on the server yet. Tell CSM Synergy.",
  save: "The connection couldn't be saved. Try again, and tell CSM Synergy if it persists.",
  // Connected, but the previous company's item mappings couldn't be cleared — so they are stale
  // against the new company and would bill lines against whatever shares those ids.
  item_map_stale: "Connected, but the old company's item mappings couldn't be cleared. Re-check the mappings below before sending an invoice.",
};

function QuickBooksView({ clientId, viewingLabel = null }) {
  const [status, setStatus] = useState(null);   // qbo_status response; null = loading
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);      // connect/test/disconnect in flight
  const [msg, setMsg] = useState(null);         // { ok } | { err } one-shot banner
  // Mapping grid state
  const [grid, setGrid] = useState(null);       // list_item_map response
  const [qboItems, setQboItems] = useState(null); // null = not loaded, [] = loaded empty
  const [itemsErr, setItemsErr] = useState(null);
  const [draft, setDraft] = useState({});       // key(kind|itemKey|styleId) -> qboItemId
  const [saving, setSaving] = useState(false);

  // Reason from a FAILED OAuth landing, kept so `load` can reconcile it against server truth.
  // A ref, not state: it must be readable inside the []-dep `load` without re-creating it.
  const landFailRef = useRef(null);

  // One-shot OAuth landing banner, then strip the params so refresh stays quiet.
  useEffect(() => {
    const p = new URLSearchParams(window.location.search);
    if (!p.has("connected")) return;
    // connected=1 WITH a reason means "it connected, but read this" (today: item_map_stale). Show
    // the reason rather than the cheerful default, or the caveat is lost.
    if (p.get("connected") === "1" && p.get("reason") && QBO_REASONS[p.get("reason")]) setMsg({ err: QBO_REASONS[p.get("reason")] });
    else if (p.get("connected") === "1") setMsg({ ok: "QuickBooks connected. Check the company name below is the right business." });
    else { landFailRef.current = p.get("reason") || ""; setMsg({ err: QBO_REASONS[p.get("reason")] || "The connection didn't complete. Try again." }); }
    p.delete("connected"); p.delete("reason");
    const qs = p.toString();
    window.history.replaceState({}, "", window.location.pathname + (qs ? `?${qs}` : ""));
  }, []);

  const load = useCallback(async () => {
    setError(null);
    const { data: d, error: e } = await sb.functions.invoke("portal-settings", { body: { action: "qbo_status" } });
    if (e || (d && d.error)) { setError((e && e.message) || d.error); setStatus({}); return; }
    setStatus(d || {});
    // The landing banner reports on ONE callback hit; qbo_status reports the tenant's actual state.
    // When they disagree the server wins, or a stale failure sits above a green "Connected" card and
    // reads as a broken connect. `state` specifically: the nonce is one-shot and burned on first
    // match, so a callback that runs twice ALWAYS fails the second time — the first hit is the one
    // that connected us. Scoped to `state` on purpose: `realm_in_use` and `denied` stay visible,
    // because those describe an attempt whose outcome still matters even while connected.
    if (landFailRef.current === "state" && d && d.connected && !d.broken) {
      landFailRef.current = null;
      setMsg((m) => (m && m.err === QBO_REASONS.state ? null : m));  // never clobber a newer message
    }
    if (d && d.connected && !d.broken) {
      const g = await sb.functions.invoke("portal-settings", { body: { action: "list_item_map" } });
      if (!g.error && g.data && !g.data.error) setGrid(g.data);
    }
  }, []);
  useEffect(() => { load(); }, [load]);

  // Invoices that were emailed but never landed in QuickBooks. Before this the push was write-only:
  // send_invoice returned ok, the design read "Invoiced", and an aborted push (usually an unmapped
  // line) left the books untouched with nothing to notice it and no way to retry.
  const [pending, setPending] = useState([]);
  const [retrying, setRetrying] = useState(null);   // shortCode in flight
  const loadPending = useCallback(async () => {
    const { data: d, error: e } = await sb.functions.invoke("portal-settings", { body: { action: "qbo_pending" } });
    if (!e && d && !d.error) setPending(d.pending || []);
  }, []);
  const retryPush = async (shortCode) => {
    setRetrying(shortCode); setMsg(null);
    const { data: d, error: e } = await sb.functions.invoke("portal-settings", { body: { action: "retry_qbo_push", shortCode } });
    setRetrying(null);
    if (e || (d && d.error)) { setMsg({ err: (e && e.message) || d.error }); return; }
    setMsg({ ok: d && d.alreadyPushed ? "That invoice is already in QuickBooks." : "Pushed to QuickBooks." });
    loadPending();
  };

  const loadQboItems = useCallback(async () => {
    setItemsErr(null); setQboItems(null);
    const { data: d, error: e } = await sb.functions.invoke("portal-settings", { body: { action: "list_qbo_items" } });
    if (e || (d && d.error)) { setItemsErr((e && e.message) || d.error); setQboItems([]); return; }
    setQboItems(d.items || []);
  }, []);
  // Fetch the QuickBooks item list once the connection is known-good.
  useEffect(() => { if (status && status.connected && !status.broken && qboItems === null) loadQboItems(); },
    [status, qboItems, loadQboItems]);
  // Only meaningful once connected — an unconnected tenant has no pushes to have failed.
  useEffect(() => { if (status && status.connected) loadPending(); }, [status, loadPending]);

  const connect = async () => {
    setBusy(true); setMsg(null);
    // Land back on THIS host (beta stays on beta). Validated server-side against a hard
    // allowlist — anything else falls back to production.
    const { data: d, error: e } = await sb.functions.invoke("qbo-oauth-connect", { body: { returnTo: window.location.hostname } });
    setBusy(false);
    if (e || (d && d.error) || !(d && d.authorizeUrl)) {
      setMsg({ err: (d && d.error) || (e && e.message) || "Could not start the QuickBooks connection." });
      return;
    }
    window.location.assign(d.authorizeUrl); // full navigation — Intuit refuses to render framed
  };

  const test = async () => {
    setBusy(true); setMsg(null);
    const { data: d } = await sb.functions.invoke("portal-settings", { body: { action: "qbo_test" } });
    setBusy(false);
    if (d && d.ok) setMsg({ ok: `QuickBooks answered${d.companyName ? ` — connected to ${d.companyName}` : ""}.` });
    else setMsg({ err: (d && d.error) || "Could not reach QuickBooks." });
    if (d && d.broken) load();
  };

  const disconnect = async () => {
    if (!window.confirm("Disconnect QuickBooks?\n\nSyncing stops immediately. Your item mappings are kept, so reconnecting the same company later picks up where you left off.")) return;
    setBusy(true); setMsg(null);
    const { data: d, error: e } = await sb.functions.invoke("portal-settings", { body: { action: "disconnect_qbo" } });
    setBusy(false);
    if (e || (d && d.error)) { setMsg({ err: (d && d.error) || e.message }); return; }
    setMsg({ ok: "QuickBooks disconnected. Your mappings were kept." });
    setGrid(null); setQboItems(null); setDraft({});
    load();
  };

  const kFor = (kind, itemKey, styleId) => `${kind}|${itemKey || ""}|${styleId || ""}`;
  const mappedId = (kind, itemKey, styleId) => {
    const k = kFor(kind, itemKey, styleId);
    if (Object.prototype.hasOwnProperty.call(draft, k)) return draft[k];
    const row = (grid && grid.mappings || []).find((m) =>
      m.line_kind === kind && (m.item_key || "") === (itemKey || "") && (m.style_id || "") === (styleId || ""));
    return row ? row.qbo_item_id : "";
  };
  const setMapped = (kind, itemKey, styleId, v) => setDraft((p) => ({ ...p, [kFor(kind, itemKey, styleId)]: v }));

  const saveGrid = async () => {
    if (!grid) return;
    setSaving(true); setMsg(null);
    // Post the FULL grid — server-side validation decides row by row. Name captured from
    // the loaded item list so the grid can label a mapping even if QuickBooks is briefly
    // unreachable next load.
    const nameOf = (id) => { const it = (qboItems || []).find((i) => i.id === id); return it ? it.name : null; };
    const rows = [];
    const pushRow = (kind, itemKey, styleId) => {
      const k = kFor(kind, itemKey, styleId);
      if (!Object.prototype.hasOwnProperty.call(draft, k)) return; // untouched
      rows.push({ lineKind: kind, itemKey: itemKey || "", styleId: styleId || null, qboItemId: draft[k] || "", qboItemName: nameOf(draft[k]) });
    };
    QBO_KINDS.forEach(([kind]) => {
      if (kind === "layout_item") (grid.layoutItems || []).forEach((li) => pushRow(kind, li.item_key, null));
      else pushRow(kind, "", null);
    });
    // Style overrides for the building line.
    (grid.styles || []).forEach((s) => pushRow("building", "", s.id));
    if (!rows.length) { setSaving(false); setMsg({ ok: "Nothing to save." }); return; }
    const { data: d, error: e } = await sb.functions.invoke("portal-settings", { body: { action: "save_item_map", rows } });
    setSaving(false);
    if (e || (d && d.error)) { setMsg({ err: (d && d.error) || e.message }); return; }
    const parts = [];
    if (d.saved) parts.push(`${d.saved} saved`);
    if (d.deleted) parts.push(`${d.deleted} removed`);
    if (d.skipped && d.skipped.length) parts.push(`${d.skipped.length} skipped`);
    setMsg({ ok: `Mappings updated${parts.length ? ` (${parts.join(", ")})` : ""}.` });
    setDraft({});
    const g = await sb.functions.invoke("portal-settings", { body: { action: "list_item_map" } });
    if (!g.error && g.data && !g.data.error) setGrid(g.data);
  };

  // Grouped <select> of QuickBooks items; keeps a saved-but-vanished id selectable so a
  // transient QuickBooks outage can't blank a stored mapping on save (the stage-dropdown
  // idiom used across Settings).
  const ItemSelect = ({ kind, itemKey, styleId, placeholder }) => {
    const val = mappedId(kind, itemKey, styleId);
    const items = qboItems || [];
    const byType = {};
    items.forEach((i) => { (byType[i.type || "Other"] = byType[i.type || "Other"] || []).push(i); });
    const stale = val && !items.some((i) => i.id === val);
    const savedRow = stale ? (grid && grid.mappings || []).find((m) => m.qbo_item_id === val) : null;
    return (
      <select value={val} onChange={(e) => setMapped(kind, itemKey, styleId, e.target.value)}
        style={{ ...S.input, maxWidth: 340 }}>
        <option value="">{placeholder || "— not mapped —"}</option>
        {stale && <option value={val}>{(savedRow && savedRow.qbo_item_name) || val} (saved)</option>}
        {Object.keys(byType).sort().map((t) => (
          <optgroup key={t} label={t}>
            {byType[t].map((i) => <option key={i.id} value={i.id}>{i.name}</option>)}
          </optgroup>
        ))}
      </select>
    );
  };

  if (status === null) return <div style={{ padding: 24, color: "#64748B", fontSize: 13 }}>Loading QuickBooks…</div>;

  const connected = !!status.connected;
  const broken = !!status.broken;
  const ready = status.oauthReady !== false;
  const dirty = Object.keys(draft).length > 0;

  return (
    <div>
      {error && <div style={S.err}>{error}</div>}
      {msg && msg.ok && <div style={S.okMsg}>{msg.ok}</div>}
      {msg && msg.err && <div style={S.err}>{msg.err}</div>}

      {/* ── Card 1: Connection ── */}
      <div style={S.card}>
        <div style={S.h2}>QuickBooks connection</div>
        {!connected && !ready && (
          <div>
            <div style={{ background: "#EFF6FF", border: "1px solid #BFDBFE", borderRadius: 8, padding: "10px 14px", color: "#1D4ED8", fontSize: 13, fontWeight: 600, marginBottom: 12 }}>
              QuickBooks is almost here — we're waiting on Intuit's approval. The button below lights up automatically when it lands.
            </div>
            <button disabled style={{ ...S.btn("#CBD5E1", "#64748B"), cursor: "not-allowed" }}>Connect to QuickBooks</button>
          </div>
        )}
        {!connected && ready && (
          <div>
            <p style={{ fontSize: 13, color: "#64748B", marginBottom: 12 }}>
              Intuit opens in this tab — sign in and approve access there, and you'll land right back
              here. Your QuickBooks password is never seen or stored by StructureStudio.
            </p>
            <button onClick={connect} disabled={busy} style={S.btn(ACCENT, "#FFF")}>
              {busy ? "Starting…" : "Connect to QuickBooks"}
            </button>
          </div>
        )}
        {connected && (
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <span style={{ width: 10, height: 10, borderRadius: 5, background: broken ? "#DC2626" : "#16A34A", flexShrink: 0 }} />
              <div style={{ minWidth: 0, flex: "1 1 260px" }}>
                <div style={{ fontSize: 14, fontWeight: 800, color: broken ? "#DC2626" : "#1E293B" }}>
                  {broken ? "Action needed — reconnect QuickBooks" : `Connected to ${status.companyName || "QuickBooks"}`}
                </div>
                <div style={{ fontSize: 12, color: "#64748B", marginTop: 2 }}>
                  {status.companyName ? `${status.companyName} · ` : ""}Company {status.realmIdMasked || "—"}
                  {status.connectedAt ? ` · connected ${fmtDate(status.connectedAt)}` : ""}
                </div>
              </div>
              <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
                <button onClick={test} disabled={busy} style={{ ...S.btn("#F1F5F9", "#334155"), border: "1px solid #E2E8F0" }}>{busy ? "…" : "Test"}</button>
                <button onClick={disconnect} disabled={busy} style={{ ...S.btn("#FFF", "#DC2626"), border: "1px solid #FECACA" }}>Disconnect</button>
              </div>
            </div>
            {broken && (
              <div style={{ background: "#FFFBEB", border: "1px solid #FDE68A", borderRadius: 8, padding: "10px 14px", marginTop: 12 }}>
                <div style={{ fontSize: 13, color: "#92400E", fontWeight: 600 }}>{status.brokenReason || "QuickBooks refused the saved connection."}</div>
                <button onClick={connect} disabled={busy} style={{ ...S.btn(ACCENT, "#FFF"), marginTop: 8 }}>
                  {busy ? "Starting…" : "Reconnect QuickBooks"}
                </button>
              </div>
            )}
          </div>
        )}
      </div>

      {/* ── Card 1b: invoices that never reached QuickBooks ──
          Deliberately ABOVE the mapping grid: the usual cause is a missing mapping, so the fix is
          the next thing on screen. Renders only when there is something wrong, so a healthy tenant
          never sees an empty scary panel. Before this, send_invoice returned ok and the design read
          "Invoiced" while the books were silently untouched — the outcome was written to
          invoice_sends and a retry action existed, but nothing in the portal read either. */}
      {connected && pending.length > 0 && (
        <div style={{ ...S.card, border: "1px solid #F59E0B", background: "#FFFBEB" }}>
          <div style={{ ...S.h2, color: "#92400E" }}>
            {pending.length} invoice{pending.length === 1 ? "" : "s"} didn’t reach QuickBooks
          </div>
          <p style={{ fontSize: 12, color: "#92400E", marginBottom: 12 }}>
            The customer was emailed and the design shows as invoiced, but the entry was not created
            in QuickBooks. Fix the cause below (usually an unmapped line), then Retry.
          </p>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {pending.map((p) => (
              <div key={p.shortCode} style={{ display: "flex", alignItems: "flex-start", gap: 10, flexWrap: "wrap", background: "#FFF", border: "1px solid #FDE68A", borderRadius: 8, padding: "9px 11px" }}>
                <div style={{ flex: "1 1 260px", minWidth: 0 }}>
                  <div style={{ fontSize: 12.5, fontWeight: 700, color: "#1E293B" }}>
                    {p.invoiceNumber ? `Invoice ${p.invoiceNumber}` : p.shortCode}
                    {p.attempts > 1 && <span style={{ fontWeight: 600, color: "#92400E" }}> · {p.attempts} attempts</span>}
                  </div>
                  <div style={{ fontSize: 11.5, color: "#64748B", marginTop: 3, wordBreak: "break-word" }}>{p.error}</div>
                </div>
                <button type="button" disabled={retrying === p.shortCode} onClick={() => retryPush(p.shortCode)}
                  style={{ ...S.btn("#92400E", "#FFF"), padding: "6px 12px", fontSize: 12, flexShrink: 0 }}>
                  {retrying === p.shortCode ? "Retrying…" : "Retry"}
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── Card 2: Item mappings ── */}
      <div style={{ ...S.card, opacity: connected && !broken ? 1 : 0.55 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, flexWrap: "wrap" }}>
          <div style={S.h2}>Invoice item mappings</div>
          {connected && !broken && (
            <button onClick={loadQboItems} title="Reload the product/service list from QuickBooks"
              style={{ ...S.btn("#F1F5F9", "#334155"), border: "1px solid #E2E8F0", padding: "6px 12px" }}>↻ Refresh items</button>
          )}
        </div>
        <p style={{ fontSize: 12, color: "#64748B", marginBottom: 14 }}>
          Which QuickBooks product or service each line of an estimate is billed as when an invoice
          is pushed to QuickBooks. Lines without a mapping fall back to the Fallback item; if that's
          not set either, the push is skipped for that invoice.
        </p>
        {!connected && <p style={{ fontSize: 13, color: "#64748B" }}>Connect QuickBooks above to set up mappings.</p>}
        {connected && !broken && grid && (
          <div>
            {itemsErr && <div style={S.err}>{itemsErr}</div>}
            {qboItems === null && !itemsErr && <p style={{ fontSize: 12, color: "#64748B" }}>Loading products &amp; services from QuickBooks…</p>}
            {QBO_KINDS.map(([kind, label, hint]) => (
              <div key={kind} style={{ padding: "10px 0", borderBottom: "1px solid #F1F5F9" }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: "#1E293B" }}>{label}</div>
                <div style={{ fontSize: 11.5, color: "#94A3B8", marginBottom: 6 }}>{hint}</div>
                {kind === "layout_item" ? (
                  (grid.layoutItems || []).length
                    ? (grid.layoutItems || []).map((li) => (
                        <div key={li.item_key} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6, flexWrap: "wrap" }}>
                          <span style={{ fontSize: 12.5, fontWeight: 600, color: "#475569", minWidth: 140 }}>{li.label || li.item_key}</span>
                          <ItemSelect kind="layout_item" itemKey={li.item_key} styleId={null} />
                        </div>
                      ))
                    : <p style={{ fontSize: 12, color: "#94A3B8" }}>No active layout items.</p>
                ) : kind === "building" ? (
                  <div>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6, flexWrap: "wrap" }}>
                      <span style={{ fontSize: 12.5, fontWeight: 600, color: "#475569", minWidth: 140 }}>Default (all styles)</span>
                      <ItemSelect kind="building" itemKey="" styleId={null} />
                    </div>
                    {(grid.styles || []).map((s) => (
                      <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6, flexWrap: "wrap" }}>
                        <span style={{ fontSize: 12.5, fontWeight: 600, color: "#94A3B8", minWidth: 140 }}>{s.label}</span>
                        <ItemSelect kind="building" itemKey="" styleId={s.id} placeholder="— use default —" />
                      </div>
                    ))}
                  </div>
                ) : (
                  <ItemSelect kind={kind} itemKey="" styleId={null} />
                )}
              </div>
            ))}
            <div style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 10 }}>
              <button onClick={saveGrid} disabled={saving || !dirty} style={S.btn(dirty ? ACCENT : "#CBD5E1", "#FFF")}>
                {saving ? "Saving…" : "Save mappings"}
              </button>
              {dirty && <span style={{ fontSize: 12, color: "#64748B" }}>Unsaved changes</span>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// mounted without them.
// ─── Commission structure (owner-only Settings sub-tab) ───
// The tenant's commission RULES: who earns by default, the base, the earned-on date, the
// payout cadence, and the cancel-clawback rule. Owner-only — the row is RLS-gated to the
// owner (commission_settings_owner_* + current_user_is_owner()), so a direct read/write
// here is safe. The confidential per-user RATES and the payouts report are separate slices
// (service-role only), built next. See migration 076_commission_settings.
function CommissionStructure({ clientId }) {
  const [s, setS] = useState(null);       // settings row (or defaults if none saved yet)
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState(null);   // { ok } | { err }

  const load = useCallback(async () => {
    setLoading(true); setMsg(null);
    const { data, error } = await sb.from("commission_settings").select("*").eq("client_id", clientId).limit(1);
    if (error) setMsg({ err: error.message });
    setS((data && data[0]) || { enabled: false, base_type: "pretax_subtotal", earned_on: "collected", payout_frequency: "biweekly", custom_days: null, clawback_on_cancel: true });
    setLoading(false);
  }, [clientId]);
  useEffect(() => { load(); }, [load]);

  const set = (k, v) => setS((p) => ({ ...p, [k]: v }));

  const save = async () => {
    setSaving(true); setMsg(null);
    let uid = null;
    try { const { data } = await sb.auth.getUser(); uid = data && data.user ? data.user.id : null; } catch (_e) {}
    const row = {
      client_id: clientId, enabled: !!s.enabled, base_type: s.base_type, earned_on: s.earned_on,
      payout_frequency: s.payout_frequency,
      custom_days: s.payout_frequency === "custom" ? (Number(s.custom_days) || null) : null,
      clawback_on_cancel: !!s.clawback_on_cancel, updated_at: new Date().toISOString(), updated_by: uid,
    };
    const { error } = await sb.from("commission_settings").upsert(row, { onConflict: "client_id" });
    setSaving(false);
    setMsg(error ? { err: error.message } : { ok: "Commission structure saved." });
  };

  // Segmented single-choice control bound to a field. opts: [value, label, disabled?].
  const seg = (field, opts) => (
    <div style={{ display: "inline-flex", border: "1px solid #E2E8F0", borderRadius: 9, overflow: "hidden", flexWrap: "wrap" }}>
      {opts.map(([val, label, disabled]) => (
        <button key={String(val)} type="button" disabled={disabled} onClick={() => set(field, val)}
          style={{ background: s[field] === val ? ACCENT : (disabled ? "#F8FAFC" : "#FFF"), color: s[field] === val ? "#FFF" : (disabled ? "#94A3B8" : "#475569"), border: "none", borderRight: "1px solid #E2E8F0", padding: "8px 14px", fontSize: 12.5, fontWeight: 700, cursor: disabled ? "not-allowed" : "pointer", fontFamily: "inherit" }}>
          {label}
        </button>
      ))}
    </div>
  );
  const lab = (t) => <span style={{ ...S.lbl, display: "block", marginBottom: 7 }}>{t}</span>;

  if (loading || !s) return <div style={{ ...S.card, color: "#64748B", fontSize: 13 }}>Loading commission structure…</div>;

  return (
    <div style={{ ...S.card, maxWidth: 720 }}>
      {msg && msg.err && <div style={S.err}>{msg.err}</div>}
      {msg && msg.ok && <div style={S.okMsg}>{msg.ok}</div>}

      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
        <div style={{ ...S.h2, marginBottom: 0 }}>Commission structure</div>
        <span style={{ background: "#EDE9FE", color: "#5B21B6", fontSize: 10, fontWeight: 800, textTransform: "uppercase", letterSpacing: 0.5, borderRadius: 999, padding: "3px 9px" }}>Owner only</span>
      </div>
      <p style={{ fontSize: 12.5, color: "#64748B", lineHeight: 1.5, margin: "0 0 16px" }}>
        Set the rules once — they decide who earns and what they're owed on every order. Splits, reassignments, and adjustments happen per sale on the Commissions report.
      </p>

      <label style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18, cursor: "pointer" }}>
        <input type="checkbox" checked={!!s.enabled} onChange={(e) => set("enabled", e.target.checked)} />
        <span style={{ fontSize: 13.5, fontWeight: 700 }}>Turn on commission tracking for this account</span>
      </label>

      <div style={{ marginBottom: 16 }}>
        {lab("Who earns by default")}
        <div style={{ background: "#F8FAFC", border: "1px solid #E2E8F0", borderRadius: 9, padding: "12px 14px", fontSize: 12.5, color: "#475569", lineHeight: 1.5 }}>
          The user who <b>submits</b> the order. A public customer self-design (no rep) is <b>non-commissionable until you assign an earner</b> on the report.
        </div>
      </div>

      <div style={{ marginBottom: 16 }}>
        {lab("Commission is a % of")}
        {seg("base_type", [["pretax_subtotal", "Pre-tax subtotal"], ["gross_profit", "Gross profit (soon)", true]])}
      </div>

      <div style={{ marginBottom: 16 }}>
        {lab("Commission is earned on the …")}
        {seg("earned_on", [["sold", "Sold date"], ["delivered", "Delivered date (soon)", true], ["collected", "Money-collected date"]])}
      </div>

      <div style={{ marginBottom: 16 }}>
        {lab("Pay commissions")}
        {seg("payout_frequency", [["weekly", "Weekly"], ["biweekly", "Every 2 weeks"], ["monthly", "Monthly"], ["custom", "Custom"]])}
        {s.payout_frequency === "custom" && (
          <div style={{ marginTop: 8, fontSize: 12.5, color: "#475569" }}>
            Every <input value={s.custom_days || ""} onChange={(e) => set("custom_days", e.target.value.replace(/[^0-9]/g, ""))} style={{ ...S.input, width: 70, display: "inline-block", textAlign: "right", margin: "0 6px" }} /> days
          </div>
        )}
      </div>

      <div style={{ marginBottom: 18 }}>
        {lab("If an order is cancelled after its commission was already paid")}
        {seg("clawback_on_cancel", [[true, "Claw it back"], [false, "Leave it — no clawback"]])}
        <div style={{ fontSize: 11.5, color: "#94A3B8", marginTop: 6, lineHeight: 1.5 }}>
          A clawback is deducted in the pay period the cancellation happens in.
        </div>
      </div>

      <button onClick={save} disabled={saving} style={{ ...S.btn(saving ? "#9CA3AF" : ACCENT, "#FFF") }}>
        {saving ? "Saving…" : "Save commission structure"}
      </button>
      <div style={{ fontSize: 11.5, color: "#94A3B8", marginTop: 12, lineHeight: 1.5 }}>
        Per-person rates and the Commissions report come next — this sets the rules they'll run on. Every period is still reviewed and approved by you before it's payable.
      </div>
    </div>
  );
}

// ─── Team & commission rates (owner + admin Settings sub-tab) ───
// Tenant-facing team management. Everything routes through the portal-commissions edge fn
// (service-role), which is the ONLY thing that can read/write the confidential
// commission_members table. Admins can add/remove people but see rates as ••• and cannot
// touch grants; only the owner sees rates and flips the two grants. clientId is resolved
// server-side from the caller's JWT — the prop is display-only here.
function CommissionTeam() {
  const [data, setData] = useState(null);       // { members, canSeeRates, isOwner, role } | { members: [] }
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);         // { ok } | { err }
  const [add, setAdd] = useState({ fullName: "", email: "", role: "user" });
  const [edits, setEdits] = useState({});       // userId -> in-progress rate string
  const [removing, setRemoving] = useState(null); // member awaiting unlink/deactivate choice
  const [invite, setInvite] = useState(null);   // { email, link, emailSent } after an add

  const call = async (body) => {
    const { data: r, error } = await sb.functions.invoke("portal-commissions", { body });
    if (error) { let m = error.message; try { const c = await error.context.json(); if (c && c.error) m = c.error; } catch (_x) {} throw new Error(m); }
    if (r && r.error) throw new Error(r.error);
    return r;
  };
  const load = useCallback(async () => {
    setErr(null);
    try { setData(await call({ action: "list" })); }
    catch (e) { setErr(e.message); setData({ members: [] }); }
  }, []);
  useEffect(() => { load(); }, [load]);

  const addUser = async () => {
    if (!add.email.trim()) { setMsg({ err: "Enter an email address." }); return; }
    setBusy(true); setMsg(null); setInvite(null);
    try {
      const r = await call({ action: "add_user", email: add.email.trim(), fullName: add.fullName.trim(), role: add.role });
      if (r.alreadyOnTeam) setMsg({ ok: `${add.email.trim()} is already on your team.` });
      else { setMsg({ ok: `Invited ${add.email.trim()}.` }); if (r.setupLink) setInvite({ email: add.email.trim(), link: r.setupLink, emailSent: r.emailSent }); }
      setAdd({ fullName: "", email: "", role: "user" });
      await load();
    } catch (e) { setMsg({ err: e.message }); }
    setBusy(false);
  };
  const commitRate = async (m) => {
    const raw = edits[m.userId];
    if (raw === undefined) return;                       // nothing typed
    const norm = raw.trim();
    const current = m.commissionPercent == null ? "" : String(m.commissionPercent);
    setEdits((p) => { const n = { ...p }; delete n[m.userId]; return n; });
    if (norm === current) return;                        // unchanged
    setBusy(true); setMsg(null);
    try { await call({ action: "set_rate", userId: m.userId, percent: norm === "" ? null : norm }); await load(); }
    catch (e) { setMsg({ err: e.message }); }
    setBusy(false);
  };
  const setGrant = async (m, field, value) => {
    setBusy(true); setMsg(null);
    try { await call({ action: "set_grants", userId: m.userId, [field]: value }); await load(); }
    catch (e) { setMsg({ err: e.message }); }
    setBusy(false);
  };
  const doRemove = async (m, mode) => {
    setBusy(true); setMsg(null); setRemoving(null);
    try { await call({ action: "remove_user", userId: m.userId, mode }); setMsg({ ok: `${m.fullName || m.email} ${mode === "deactivate" ? "removed — their login is deactivated" : "removed from your team"}.` }); await load(); }
    catch (e) { setMsg({ err: e.message }); }
    setBusy(false);
  };

  const th = { textAlign: "left", fontSize: 11, fontWeight: 700, color: "#64748B", textTransform: "uppercase", letterSpacing: 0.5, padding: "8px 10px", borderBottom: "1px solid #E2E8F0", whiteSpace: "nowrap" };
  const td = { fontSize: 13, padding: "10px 10px", borderBottom: "1px solid #F1F5F9", verticalAlign: "middle" };
  const roleChip = (r) => { const c = { owner: ["#EDE9FE", "#5B21B6"], admin: ["#DBEAFE", "#1E40AF"], user: ["#F1F5F9", "#475569"] }[r] || ["#F1F5F9", "#475569"]; return <span style={{ background: c[0], color: c[1], borderRadius: 20, padding: "3px 10px", fontSize: 11, fontWeight: 700, textTransform: "capitalize" }}>{r}</span>; };
  const sw = (on) => <span style={{ display: "inline-block", width: 34, height: 20, borderRadius: 20, background: on ? ACCENT : "#CBD5E1", position: "relative", verticalAlign: "middle", transition: "background .12s" }}><span style={{ position: "absolute", top: 2, [on ? "right" : "left"]: 2, width: 16, height: 16, borderRadius: "50%", background: "#FFF" }} /></span>;

  if (data === null) return <div style={{ ...S.card, color: "#64748B", fontSize: 13 }}>Loading team…</div>;
  const isOwner = !!data.isOwner;
  const canSeeRates = !!data.canSeeRates;
  const members = data.members || [];

  return (
    <div style={{ ...S.card, maxWidth: 860 }}>
      {err && <div style={S.err}>{err}</div>}
      {msg && msg.err && <div style={S.err}>{msg.err}</div>}
      {msg && msg.ok && <div style={S.okMsg}>{msg.ok}</div>}

      <div style={{ ...S.h2, marginBottom: 3 }}>Team &amp; commission rates</div>
      <p style={{ fontSize: 12.5, color: "#64748B", lineHeight: 1.5, margin: "0 0 16px" }}>
        {isOwner
          ? "Add the people who work in your account and set each one's commission rate. Rates and other people's payouts are visible to you only — grant an admin access per person with the toggles."
          : "Add teammates for your account. Commission rates are set by the owner and shown as ••• here."}
      </p>

      {/* Add a teammate */}
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end", background: "#F8FAFC", border: "1px solid #E2E8F0", borderRadius: 10, padding: 14, marginBottom: 16 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
          <span style={S.lbl}>Full name</span>
          <input value={add.fullName} onChange={(e) => setAdd((p) => ({ ...p, fullName: e.target.value }))} placeholder="Jordan Blake" style={{ ...S.input, width: 150 }} />
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
          <span style={S.lbl}>Email</span>
          <input value={add.email} onChange={(e) => setAdd((p) => ({ ...p, email: e.target.value }))} placeholder="jordan@company.com" style={{ ...S.input, width: 200 }} />
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
          <span style={S.lbl}>Role</span>
          <select value={add.role} onChange={(e) => setAdd((p) => ({ ...p, role: e.target.value }))} style={{ ...S.input, width: 120 }}>
            <option value="user">User</option>
            {isOwner && <option value="admin">Admin</option>}
            {isOwner && <option value="owner">Owner</option>}
          </select>
        </div>
        <button onClick={addUser} disabled={busy} style={{ ...S.btn(busy ? "#9CA3AF" : ACCENT, "#FFF") }}>Add &amp; send invite</button>
      </div>

      {invite && (
        <div style={{ background: "#EEF2FF", border: "1px solid #C7D2FE", borderRadius: 9, padding: "11px 13px", marginBottom: 14, fontSize: 12.5, color: "#3730A3" }}>
          <b>{invite.email}</b> {invite.emailSent ? "was emailed a setup link." : "was added."} Share this one-time set-password link if the email doesn't arrive:
          <div style={{ marginTop: 6 }}><input readOnly value={invite.link} onFocus={(e) => e.target.select()} style={{ ...S.input, width: "100%", fontSize: 11.5, color: "#475569" }} /></div>
        </div>
      )}

      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead><tr>
            <th style={th}>Name</th><th style={th}>Email</th><th style={th}>Role</th><th style={th}>Commission&nbsp;%</th>
            {isOwner && <th style={th}>Sees all payouts</th>}
            {isOwner && <th style={th}>Full access</th>}
            <th style={th}></th>
          </tr></thead>
          <tbody>
