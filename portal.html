<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>StructureStudio — Business Portal</title>
<!-- PWA: the portal is the installable "StructureStudio" app (one branded app,
     tenants log in). The customer-facing designer stays a plain web link — it
     deliberately has NO manifest, so visitors never see an install prompt. -->
<!-- Open the connection to Supabase while the page is still parsing. Every screen in the
     portal starts with a call there (the session check, then the tab's own read), and
     without this the first one pays DNS + TCP + TLS before it can even ask. `crossorigin`
     is required, not decoration: supabase-js issues non-credentialed CORS requests, and
     those can only reuse a connection opened in the anonymous pool — drop the attribute and
     the browser warms a socket the app never touches. -->
<link rel="preconnect" href="https://jzeamjbhdrsbygdnphbm.supabase.co" crossorigin/>
<link rel="dns-prefetch" href="https://jzeamjbhdrsbygdnphbm.supabase.co"/>
<link rel="icon" type="image/png" href="/assets/favicon.png"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#3D3672"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="StructureStudio"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F6F9FE}
/* PLACEHOLDERS RECEDE. Carolyn, 2026-09-02: "I want it VERY light and barely
   readable" — a placeholder is a hint, not content, and the UA default (#757575,
   and inheriting the field's 600 weight) reads as heavily as a real value. Set
   here rather than in S.input because ::placeholder is not reachable from an
   inline style object. `opacity:1` is load-bearing for Firefox, which applies its
   own placeholder opacity on top of the colour. TYPED TEXT IS UNTOUCHED — S.input
   keeps #1E293B, so what someone actually writes stays fully legible. */
input::placeholder,textarea::placeholder{color:#CBD5E1;opacity:1;font-weight:500}
/* Dashboard shell: fluid, full-width sidebar layout. The sidebar sticks to the viewport
   while the page scrolls; below 900px it collapses to an icon rail. Logged-out views
   center themselves (PortalApp wraps them in a 920px container). */
.ss-shell{display:flex;min-height:100vh;align-items:stretch}
.ss-side{width:240px;flex:0 0 240px;background:#FFF;border-right:1px solid #E7EBF0;display:flex;flex-direction:column;padding:16px 14px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.ss-brand{display:block;padding:2px 4px 14px;border-bottom:1px solid #F1F5F9;margin-bottom:10px}
.ss-logo{display:block;width:100%;height:auto}

.ss-navlabel{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#94A3B8;padding:10px 10px 4px;margin-top:4px;white-space:nowrap}
.ss-nav{display:flex;flex-direction:column;gap:2px}
.ss-nav a,.ss-nav button{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:8px;font-size:13.5px;font-weight:600;color:#475569;text-decoration:none;cursor:pointer;white-space:nowrap;background:none;border:none;font-family:inherit;width:100%;text-align:left}
.ss-nav a svg,.ss-nav button svg{width:17px;height:17px;flex-shrink:0;stroke:#94A3B8}
.ss-nav a:hover,.ss-nav button:hover{background:#F1F5F9;color:#1E293B}
.ss-nav a:hover svg,.ss-nav button:hover svg{stroke:#475569}
.ss-nav a.active,.ss-nav button.active{background:#DBEAFF;color:#3D3672;font-weight:700}
.ss-nav a.active svg,.ss-nav button.active svg{stroke:#3D3672}
/* Label fills the row and truncates so the status pill always pins to the same far-right
   edge — long labels (Delivery Schedule, Self Serve Displays) would otherwise shove their
   pill out of the column. Full text stays available via each button's title tooltip. */
.ss-nav .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ss-nav .soon{margin-left:auto;white-space:nowrap;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#0F4C46;background:#75E6DA;border-radius:6px;padding:2px 6px;flex-shrink:0}
.ss-nav .lock{width:13px;height:13px;margin-left:auto;flex-shrink:0;opacity:.6;stroke:#94A3B8}
.ss-nav .soon + .lock{margin-left:6px}
.ss-nav .active .soon{background:#3D3672;color:#75E6DA}
.ss-spacer{flex:1}
.ss-foot{border-top:1px solid #F1F5F9;padding-top:12px}
.ss-newlink{display:flex;align-items:center;gap:6px;font-size:12px;color:#64748B;text-decoration:underline;text-underline-offset:2px;cursor:pointer;margin-bottom:12px;padding:0 4px;white-space:nowrap;background:none;border:none;font-family:inherit;width:100%;text-align:left}
.ss-newlink:hover{color:#1B7895}
.ss-newlink svg{width:14px;height:14px;flex-shrink:0}
.ss-user-wrap{position:relative;margin-bottom:2px}
.ss-user{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer;outline:none}
.ss-user-wrap:hover .ss-user,.ss-user-wrap:focus-within .ss-user{background:#F1F5F9}
.ss-user .uchev{width:13px;height:13px;margin-left:auto;color:#94A3B8;flex-shrink:0}
.ss-user-menu{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:#FFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,0.28);padding:5px;display:none;z-index:80}
.ss-user-wrap:hover .ss-user-menu,.ss-user-wrap:focus-within .ss-user-menu{display:block}
.ss-user-menu button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:#334155;font-size:13px;font-weight:700;padding:9px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;font-family:inherit;text-align:left}
.ss-user-menu button:hover{background:#FEF2F2;color:#DC2626}
/* Operator account switcher — click-toggled (NOT hover: the hover menu popping over
   content is what Carolyn flagged), opens UPWARD like .ss-user-menu. Its initials tile
   restyles .ss-clogo for the white rail (the original is white-on-dark for the topbar). */
.ss-switch-wrap{position:relative;margin-bottom:10px}
.ss-switch{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:9px;border:1px solid #E2E8F0;background:#F8FAFC;cursor:pointer;font-family:inherit;text-align:left}
.ss-switch:hover{background:#F1F5F9}
.ss-switch .ss-clogo{width:30px;height:30px;background:#3D3672;border-color:#3D3672;color:#FFF;font-size:11px}
.ss-switch .stext{min-width:0;display:flex;flex-direction:column}
.ss-switch .sname{font-size:12.5px;font-weight:800;color:#1E293B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-switch .srole{font-size:10.5px;font-weight:600;color:#94A3B8;white-space:nowrap}
.ss-switch .uchev{width:13px;height:13px;margin-left:auto;color:#94A3B8;flex-shrink:0}
.ss-switch-menu{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:#FFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,0.28);padding:6px;z-index:90}
.ss-switch-menu input{width:100%;box-sizing:border-box;border:1px solid #CBD5E1;border-radius:7px;padding:7px 9px;font-size:12.5px;font-family:inherit;margin-bottom:5px}
.ss-switch-list{max-height:264px;overflow-y:auto}
.ss-switch-list button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:#334155;font-size:12.5px;font-weight:700;padding:7px 8px;border-radius:7px;cursor:pointer;font-family:inherit;text-align:left}
.ss-switch-list button:hover{background:#F1F5F9}
.ss-switch-list button.cur{background:#FEF3C7}
.ss-switch-list .ss-clogo.sm{width:24px;height:24px;background:#EEF2FF;border-color:#C7D2FE;color:#3D3672;font-size:10px}
.ss-switch-list .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-switch-list .vw{margin-left:auto;font-size:10.5px;font-weight:800;color:#92400E;background:#FEF3C7;border-radius:6px;padding:2px 7px;flex-shrink:0}
.ss-switch-note{font-size:12px;color:#94A3B8;font-weight:600;padding:8px}
.ss-switch-exit{display:block;width:100%;margin-top:5px;background:#FFF7ED;border:1px solid #FDBA74;color:#9A3412;font-size:12.5px;font-weight:800;padding:8px 10px;border-radius:7px;cursor:pointer;font-family:inherit;text-align:left}
.ss-switch-exit:hover{background:#FFEDD5}
/* Sign Out owns the red hover; a neutral item must not look destructive. */
.ss-user-menu button.neutral:hover{background:#F1F5F9;color:#1E293B}
.ss-user-menu button svg{width:15px;height:15px;flex-shrink:0}
.ss-avatar{width:34px;height:34px;border-radius:50%;background:#DBEAFF;border:1px solid #C3D9F7;color:#3D3672;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;flex-shrink:0}
.ss-user .uname{font-size:13px;font-weight:700;color:#1E293B;line-height:1.15;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.ss-user .umail{font-size:11px;color:#94A3B8;margin-top:1px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ss-topbar{background:linear-gradient(100deg,#3D3672 0%,#2B4C7E 52%,#1B7895 100%);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40}
.ss-topbar .ttl{font-size:18px;font-weight:800;color:#FFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.ss-topbar .ttl span{color:#C9DCEA;font-weight:600;font-size:13px;margin-left:10px}
.ss-topbar .tenant{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.ss-clogo{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.32);display:flex;align-items:center;justify-content:center;color:#FFF;flex-shrink:0;font-size:12px;font-weight:800}
.ss-tname{font-size:15.5px;font-weight:800;color:#FFF;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.ss-body{flex:1;padding:20px 24px}
.ss-inner{max-width:1240px}
/* Designer tab: fixed-height shell, the embedded designer scrolls inside its host
   (body scroll would double-scroll under the sticky topbar). */
.ss-main.ss-designer-active{height:100vh;height:100dvh}
.ss-main.ss-designer-active .ss-body{padding:0;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.ss-designer-host{flex:1;min-height:0;width:100%;overflow:auto;background:#F8FAFC}
/* (The .ss-admin-active / .ss-admin-host rules that used to live here existed only to give
   the Admin IFRAME a full-height, single-scroller host. Admin is native as of 2026-07-30 —
   it renders inside .ss-inner like Settings, so it needs no special layout at all.) */
.ss-main.ss-viewing{box-shadow:inset 0 3px 0 #B45309}
.ss-stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:2px}
@media (max-width:680px){.ss-stage-grid{grid-template-columns:1fr}}
@media (max-width:900px){
  .ss-side{width:68px;flex-basis:68px;padding:18px 10px;align-items:center}
  /* The lockup is 3.65:1 — at 48px wide it would be a 13px sliver, unreadable and
     mistakable for a stray line. There is no square mark in this logo (the favicon is
     deliberately favicon-only), so the collapsed rail goes purely to icons. */
  .ss-brand{display:none}
  /* The switcher needs readable tenant names; a 48px-wide list serves nobody, and the
     sidebar's own overflow-y would clip a fly-out. The Accounts page covers this mode. */
  .ss-navlabel,.ss-nav .lbl,.ss-nav .soon,.ss-nav .lock,.ss-newlink span,.ss-user .utext,.ss-user .uchev,.ss-user-menu .mtext,.ss-switch-wrap{display:none}
  .ss-nav{width:100%}
  .ss-nav a,.ss-nav button{justify-content:center;gap:0;padding:10px 0}
  .ss-newlink{justify-content:center;padding:0}
  .ss-user{justify-content:center}
  .ss-foot{width:100%}
  .ss-user-menu button{justify-content:center;padding:10px 0}
}
@media (max-width:560px){
  .ss-topbar{padding:12px 14px}
  .ss-topbar .ttl span{display:none}
  .ss-tname{display:none}
  .ss-body{padding:14px 12px}
}
/* Options-tab catalog tables: tighter gutters so the wide fixture tables (Doors/Windows/Ramps,
   now carrying the Internal-only column) fit without a horizontal scroll bar. Scoped to the
   .tight wrapper so the shared S.td padding is untouched for every other table. */
.tight th,.tight td{padding-left:6px;padding-right:6px}
.tight td{padding-top:8px;padding-bottom:8px}
.tight input{box-sizing:border-box}
</style>
</head><body><div id="root"></div>
<!-- SELF-HOSTED, deliberately not a CDN. These four are this page's only dependencies and there
     is no build step, so one blocked or failed third-party request used to blank the page
     entirely - twice in the wild (2026-08-04, 2026-08-05), the second time to Googlebot. Serving
     them same-origin removes that failure mode instead of reporting it, and pins supabase-js,
     which was floating on @2 and could change under us on any npm publish (it resolved to
     2.112.1 the day these were vendored). ROOT-ABSOLUTE on purpose: portal.html is served at
     /portal/<page>/<sub> too, where a relative src resolves against the URL depth and gets
     swallowed by the /portal/* splat - the bug that once blanked the whole portal. Version is in
     the filename so a bump is a visible rename, never a silent byte change. No crossorigin
     attribute: same-origin scripts already give window.onerror full error detail, which is the
     only thing that attribute bought us across a CDN. Keep all three pages identical and keep
     the files present - preflight enforces both. Provenance + update recipe: vendor/README.md. -->
<script src="/vendor/react-18.2.0.production.min.js"></script>
<script src="/vendor/react-dom-18.2.0.production.min.js"></script>
<script src="/vendor/supabase-js-2.112.1.umd.min.js"></script>

<!-- The ONE shared designer module (also loaded by index.html). Publishes
     window.StructureStudio for the in-portal Designer tab; must load before the
     main block below. Keep the ?v= cache-buster in lockstep with index.html.

     ROOT-ABSOLUTE, and it must stay that way. This page is now served at
     /portal/<page>/<sub> as well as /portal.html, so a relative src resolves against
     whatever depth the URL happens to have — at /portal/settings/colors it asked for
     /portal/settings/structure-studio.component.js, which the /portal/* splat rewrote to
     portal.html, so Babel was handed "<!DOCTYPE html>" and threw. The whole page rendered
     blank. index.html keeps its relative src because it is only ever served from the root.
     (Everything else here — favicon, manifest, apple-touch-icon, sw.js — was already
     root-absolute, which is why this was the only casualty.) -->
<script defer src="/structure-studio.component.compiled.js?v=738251b0" onerror="(window.__ssScriptFail=window.__ssScriptFail||[]).push(this.src)"></script>
<script defer src="/portal.app.compiled.js?v=85e7b543" onerror="(window.__ssScriptFail=window.__ssScriptFail||[]).push(this.src)"></script>
<script>
// PWA service worker (see sw.js — minimal, no app-asset caching so pushes to
// beta still deploy instantly). Registered at root scope so the offline
// fallback also covers designer pages opened from inside the installed app.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js").catch(function () { /* non-fatal: app works without it */ });
  });
}
</script><script data-ss-app="portal">
/* ── Dependency boot guard ────────────────────────────────────────────────────────────────
   The three /vendor/ tags above are this page's only library dependencies, and the app
   itself arrives as COMPILED, defer'd classic scripts (built offline by scripts/compile.mjs
   - in-browser Babel was removed from the pages on 2026-08-13). If a library does not
   load, the app scripts still run, throw on the first missing global, and the visitor gets
   a PERMANENTLY BLANK PAGE - no message, nothing to act on. That happened twice in the wild
   while the libraries came from CDNs ("Uncaught ReferenceError: ReactDOM is not defined",
   2026-08-04 and 2026-08-05), the second time to GOOGLEBOT, i.e. a tenant's public
   shopfront was crawled blank.

   The libraries are SELF-HOSTED under /vendor/, which removes the third-party failure mode
   that caused both incidents. This guard stays because same-origin is not the same as
   infallible, and the remaining causes are ones this repo has actually shipped: an asset
   that 404s because of a routing rule (the /portal/* splat once swallowed the component's
   relative src and blanked the entire portal), a deploy that uploaded an incomplete tree, a
   host exclusion list that grew a bad pattern, or a connection dropped mid-load.

   HOW NEUTRALISING WORKS: the compiled app scripts are defer'd, so they execute after
   parsing - after this guard. Every artifact opens with `if (window.__ssBootBlocked)
   return;` (scripts/compile.mjs adds it), so setting that flag here is what stops the app
   running on top of the failure screen. The old guard re-typed text/babel tags before
   Babel compiled them; there are no such tags anymore.

   THE APP-RAN SENTINEL: each page's own app source ends with `window.__ssAppBooted = true`.
   Deferred scripts finish before DOMContentLoaded, so a page reaching DOMContentLoaded with
   no sentinel and no blocked flag means the app artifact itself never ran - 404'd, or
   served as HTML by a routing rule (the /portal/* splat answers any non-asset path with
   portal.html at HTTP 200, which a classic script parses as a SyntaxError). The old
   inline-babel world could not even see that class - Babel's abort killed the reporter too.
   Now it reports boot_app_missing and shows this same screen.

   WHY THIS IS PLAIN JS AT THE END OF THE BODY:
     * It must work when everything else failed, so it may depend on nothing.
     * A plain inline script runs during parsing - BEFORE the defer'd app scripts execute -
       so the blocked flag is already set by the time they check it.
     * The /vendor/ tags block parsing, so all three have resolved (loaded or failed) by now.

   KEEP THIS BLOCK BYTE-IDENTICAL ACROSS index.html / portal.html / admin.html - preflight
   enforces it, exactly as it enforces the vendored-dependency lock. The app sources are NOT
   twinned, so nothing else would notice one page drifting. The only per-page difference
   is the data-ss-app label on the tag above, which names the app in the message.
*/
(function () {
  try {
    var app = (document.currentScript && document.currentScript.getAttribute("data-ss-app")) || "page";

    // A THROW AND A FAILED DOWNLOAD PRODUCE THE SAME SILENCE at DOMContentLoaded, and telling
    // them apart is the whole diagnosis. This guard runs during parsing, before any defer'd
    // app script executes, so the listener is armed in time to catch what they raise -
    // including the SyntaxError a truncated script throws partway through.
    var ssFirstError = null;
    try {
      window.addEventListener("error", function (ev) {
        if (ssFirstError || !ev) return;
        ssFirstError = {
          message: String(ev.message || "").slice(0, 300),
          file: String(ev.filename || "").slice(0, 200),
          line: ev.lineno || 0
        };
      }, true);
    } catch (_eTrap) { /* a guard that throws is worse than no guard */ }

    // WHAT WE KNOW, as opposed to what we are guessing. Resource Timing records one entry per
    // fetched script with the bytes that arrived and whether they came off the network or out
    // of the browser cache. Reported alongside the filenames, it is the difference between
    // "these two files did not load" (which on 2026-09-05 was false, and sent a whole
    // investigation at a server that was serving both of them correctly on every retry) and
    // "both arrived, in full, from cache - so the app threw".
    function ssScriptFacts() {
      var out = [];
      try {
        var tags = document.querySelectorAll("script[src]");
        for (var i = 0; i < tags.length; i++) {
          var raw = tags[i].getAttribute("src") || "";
          if (raw.indexOf(".compiled.js") === -1 && raw.indexOf("/vendor/") === -1) continue;
          var name = raw.split("?")[0].replace(/^\//, "");
          var e = null;
          var all = performance.getEntriesByName(new URL(raw, location.href).href, "resource");
          if (all && all.length) e = all[all.length - 1];
          if (!e) out.push(name + ": never fetched");
          else if (!e.responseEnd) out.push(name + ": fetch never finished");
          // transferSize 0 with a body means the HTTP cache answered it. That is the reading
          // that matters most here: a cached copy is the one thing a plain reload cannot fix.
          // decodedBodySize, not encodedBodySize: the decoded length is the one a reader can
          // hold against the real file (880085 for the component today), so a copy that
          // stopped short announces itself. encoded is the compressed size and matches
          // nothing anyone can look up.
          else out.push(name + ": " + (e.decodedBodySize || 0) + "B "
            + (e.transferSize === 0 ? "from browser cache" : "over the network"));
        }
      } catch (_eRT) { /* no Resource Timing - the filenames still go out */ }
      return out;
    }

    // PUBLISHED so a page's own app script can reuse this exact failure screen for the one
    // dependency this guard cannot check itself: the shared component module. index.mount
    // checks window.StructureStudio before rendering (a compiled module that 404s leaves it
    // undefined) and calls in here with boot_component_missing; the portal deliberately only
    // REPORTS that case, because there the module backs one tab of a working page. The
    // MESSAGE lives here because a second hand-written copy per page is exactly the drift
    // preflight exists to catch. `missing` names the file(s); `code` separates the causes
    // in app_errors.
    function ssBootFail(missing, code, detail) {
      // Stop the app scripts running on top of the failure screen. Every compiled artifact
      // checks this flag as its first statement (scripts/compile.mjs adds the check); the
      // guard runs during parsing, before any defer'd script executes, so the flag is
      // always seen. A script that is ALREADY running (the module-missing caller) is
      // unaffected, so both callers can share this path.
      window.__ssBootBlocked = true;

      // A broken render must never be indexed. Googlebot executes this; the healthy path
      // never calls in here, so a working page never gets the tag.
      var meta = document.createElement("meta");
      meta.setAttribute("name", "robots");
      meta.setAttribute("content", "noindex");
      document.head.appendChild(meta);

      // Plain HTML and no framework - the framework is what failed. The font is inherited from
      // the page's own body rule, which is in the document, not in a separate file.
      var host = document.getElementById("root") || document.body;
      host.innerHTML =
        '<div style="max-width:560px;margin:12vh auto;padding:0 24px;color:#1E293B">'
        + '<h1 style="font-size:20px;line-height:1.35;margin:0 0 10px">Couldn\'t load the ' + app + '</h1>'
        + '<p style="margin:0 0 16px;font-size:16px;line-height:1.5;color:#475569">Check your connection and reload the page.</p>'
        + '<p style="margin:0 0 22px;font-size:14px;line-height:1.5;color:#64748B">'
        + (detail && detail.unproven
            ? 'The app did not start. Reloading past the cache did not help, so this may be your '
              + 'network or a browser extension blocking a large file.'
            : 'A file this page needs did not load (' + missing.join(", ")
              + '). This is usually a temporary network problem, so reloading should fix it.')
        + '</p>'
        + '<button type="button" id="ss-boot-reload" style="font:inherit;font-size:15px;padding:9px 18px;'
        + 'border:0;border-radius:8px;background:#2563EB;color:#FFF;cursor:pointer">Reload</button>'
        + '</div>';
      var btn = document.getElementById("ss-boot-reload");
      if (btn) btn.addEventListener("click", function () {
        // A PLAIN location.reload() IS NOT ENOUGH, and that is why this screen came back
        // once a minute for three minutes on 2026-09-05 while the server answered every one
