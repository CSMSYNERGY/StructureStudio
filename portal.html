<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>StructureStudio — Business Portal</title>
<!-- PWA: the portal is the installable "StructureStudio" app (one branded app,
     tenants log in). The customer-facing designer stays a plain web link — it
     deliberately has NO manifest, so visitors never see an install prompt. -->
<!-- Open the connection to Supabase while the page is still parsing. Every screen in the
     portal starts with a call there (the session check, then the tab's own read), and
     without this the first one pays DNS + TCP + TLS before it can even ask. `crossorigin`
     is required, not decoration: supabase-js issues non-credentialed CORS requests, and
     those can only reuse a connection opened in the anonymous pool — drop the attribute and
     the browser warms a socket the app never touches. -->
<link rel="preconnect" href="https://jzeamjbhdrsbygdnphbm.supabase.co" crossorigin/>
<link rel="dns-prefetch" href="https://jzeamjbhdrsbygdnphbm.supabase.co"/>
<!-- The Designer tab's type (redesign 2026-09-15): DM Sans + Play, display=swap with system
     fallbacks in the designer's own stylesheet, so a blocked font never moves a control.
     NON-BLOCKING on purpose, same as index.html: a plain stylesheet link holds first paint and every
     script below until Google answers, so a dropped (not refused) request blanked the whole portal
     for the connection timeout. preload + onload applies it whenever it arrives; the font files
     themselves are only fetched once the Designer tab puts DM Sans / Play on screen. -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Play:wght@700&display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Play:wght@700&display=swap"/></noscript>
<link rel="icon" type="image/png" href="/assets/favicon.png"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#3D3672"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="StructureStudio"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F6F9FE}
/* PLACEHOLDERS RECEDE. Carolyn, 2026-09-02: "I want it VERY light and barely
   readable" — a placeholder is a hint, not content, and the UA default (#757575,
   and inheriting the field's 600 weight) reads as heavily as a real value. Set
   here rather than in S.input because ::placeholder is not reachable from an
   inline style object. `opacity:1` is load-bearing for Firefox, which applies its
   own placeholder opacity on top of the colour. TYPED TEXT IS UNTOUCHED — S.input
   keeps #1E293B, so what someone actually writes stays fully legible. */
input::placeholder,textarea::placeholder{color:#CBD5E1;opacity:1;font-weight:500}
/* Dashboard shell: fluid, full-width sidebar layout. The sidebar sticks to the viewport
   while the page scrolls; below 900px it collapses to an icon rail. Logged-out views
   center themselves (PortalApp wraps them in a 920px container). */
.ss-shell{display:flex;min-height:100vh;align-items:stretch}
.ss-side{width:240px;flex:0 0 240px;background:#FFF;border-right:1px solid #E7EBF0;display:flex;flex-direction:column;padding:16px 14px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.ss-brand{display:block;padding:2px 4px 14px;border-bottom:1px solid #F1F5F9;margin-bottom:10px}
.ss-logo{display:block;width:100%;height:auto}

.ss-navlabel{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#94A3B8;padding:10px 10px 4px;margin-top:4px;white-space:nowrap}
.ss-nav{display:flex;flex-direction:column;gap:2px}
.ss-nav a,.ss-nav button{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:8px;font-size:13.5px;font-weight:600;color:#475569;text-decoration:none;cursor:pointer;white-space:nowrap;background:none;border:none;font-family:inherit;width:100%;text-align:left}
.ss-nav a svg,.ss-nav button svg{width:17px;height:17px;flex-shrink:0;stroke:#94A3B8}
.ss-nav a:hover,.ss-nav button:hover{background:#F1F5F9;color:#1E293B}
.ss-nav a:hover svg,.ss-nav button:hover svg{stroke:#475569}
.ss-nav a.active,.ss-nav button.active{background:#DBEAFF;color:#3D3672;font-weight:700}
.ss-nav a.active svg,.ss-nav button.active svg{stroke:#3D3672}
/* Label fills the row and truncates so the status pill always pins to the same far-right
   edge — long labels (Delivery Schedule, Self Serve Displays) would otherwise shove their
   pill out of the column. Full text stays available via each button's title tooltip. */
.ss-nav .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ss-nav .soon{margin-left:auto;white-space:nowrap;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#0F4C46;background:#75E6DA;border-radius:6px;padding:2px 6px;flex-shrink:0}
.ss-nav .lock{width:13px;height:13px;margin-left:auto;flex-shrink:0;opacity:.6;stroke:#94A3B8}
.ss-nav .soon + .lock{margin-left:6px}
.ss-nav .active .soon{background:#3D3672;color:#75E6DA}
/* Settings takes over the rail (2026-09-11). BOTH navs are always in the markup and CSS picks
   one, so there is no resize listener and no second render path in the shell — and the
   collapsed rail below needs to know nothing about modes.
   display:contents, NOT block: the groups stay DIRECT flex children of .ss-side, so the
   rail's spacing and the .ss-spacer push-down are exactly what they were. */
.ss-ws-nav{display:contents}
.ss-set-nav{display:none}
.ss-side-settings .ss-ws-nav{display:none}
.ss-side-settings .ss-set-nav{display:contents}
.ss-back{display:flex;align-items:center;gap:9px;width:100%;box-sizing:border-box;padding:8px 10px;margin-bottom:10px;border:1px solid #E2E8F0;border-radius:8px;background:#F8FAFC;color:#475569;font-size:12.5px;font-weight:700;font-family:inherit;text-decoration:none;cursor:pointer;white-space:nowrap}
.ss-back:hover{background:#F1F5F9;color:#1E293B}
.ss-back svg{width:15px;height:15px;flex-shrink:0;stroke:#94A3B8}
.ss-back:hover svg{stroke:#475569}
/* Four headings in a rail this long are four 30px gaps. Tightened here only — the workspace
   rail has two headings and room to breathe, so its rhythm is untouched. */
.ss-set-nav .ss-navlabel{padding-top:8px;margin-top:0}
.ss-spacer{flex:1}
/* STICKY, because the Settings rail is taller than a laptop. Seventeen items and five
   headings measure ~990px against the ~720px .ss-side gets on a 1366x768 screen, and the
   rail has always been overflow-y:auto — so the footer, which holds SIGN OUT, sat below the
   fold and needed a scroll to reach. That would have quietly undone the hover fix below, on
   the very screen it was written for. The list scrolls; the identity block does not.
   Also an improvement for the workspace rail on a short window, where the same overflow
   exists today with twelve items. Opaque background is load-bearing: the nav scrolls BEHIND
   this, and z-index keeps it over the rows (the user menu is 80, above both).
   ⚠️ The rail's 12px BOTTOM PADDING moved onto this element (.ss-side is `16px 14px 0` now).
   A sticky element cannot be pushed past its containing block's padding edge, so with the
   padding still on .ss-side there was a 12px strip underneath the footer that scrolling nav
   items slid through — a sliver of the last nav row under the signed-in user's name. Same 12px, same
   look, but now it belongs to the opaque box. */
.ss-foot{position:sticky;bottom:0;background:#FFF;z-index:60;border-top:1px solid #F1F5F9;padding:12px 0}
.ss-newlink{display:flex;align-items:center;gap:6px;font-size:13.5px;color:#64748B;text-decoration:underline;text-underline-offset:2px;cursor:pointer;margin-bottom:12px;padding:0 4px;white-space:nowrap;background:none;border:none;font-family:inherit;width:100%;text-align:left}
.ss-newlink:hover{color:#1B7895}
.ss-newlink svg{width:14px;height:14px;flex-shrink:0}
.ss-user-wrap{position:relative;margin-bottom:2px}
.ss-user{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer;outline:none}
.ss-user-wrap:hover .ss-user,.ss-user-wrap:focus-within .ss-user{background:#F1F5F9}
/* On My Profile. Same treatment an active nav row gets, because that is what this is:
   the page deliberately leaves the rail alone, so the control you clicked marks itself.
   After the hover rule so it survives hovering its own row. */
.ss-user-wrap .ss-user.active{background:#DBEAFF}
.ss-user-wrap .ss-user.active .uname{color:#3D3672}
.ss-user .uchev{width:13px;height:13px;margin-left:auto;color:#94A3B8;flex-shrink:0}
/* Opens to the RIGHT of the identity row, not upward (Carolyn 2026-10-23).
   ⚠️ position:FIXED, not absolute, and that is load-bearing: .ss-side is
   overflow-y:auto, which makes it a scroll container on BOTH axes, so an
   absolutely-positioned fly-out past its right edge is clipped (and adds a
   horizontal scrollbar) — the very thing the collapsed-rail comment above warns
   about for the account switcher. Fixed escapes the clip, and the geometry is
   predictable without JS: the rail is sticky at top:0 with height:100vh, so its
   footer always sits at the viewport bottom — 12px of .ss-foot padding plus the
   wrap's 2px margin, hence bottom:14px, which lines the menu's last row up with
   the name it belongs to. `left` is the rail width + a 6px gap, so it moves with
   the collapsed rail in the <=900px block below. Nothing between here and the
   viewport may gain transform/filter/contain, or fixed re-anchors to that element. */
.ss-user-menu{position:fixed;bottom:14px;left:246px;min-width:212px;background:#FFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,0.28);padding:5px;display:none;z-index:80}
.ss-user-wrap:hover .ss-user-menu,.ss-user-wrap:focus-within .ss-user-menu{display:block}
/* The 6px gap beside the row (now horizontal — it was above until the menu moved to the
   right) used to be a dead zone: a child rendered outside its parent's box does not extend
   that parent's hover region, so moving the
   mouse off the name toward the menu left :hover before reaching it and the menu vanished
   mid-travel. Sign Out was reachable only by CLICKING the name first — which merely focuses
   it, pinning the menu open through :focus-within. Carolyn, 2026-09-11: "that is not
   intuitive ... we should be able to mouse over your name and click on the nav popup."
   This bridges the gap with a transparent strip that belongs to the MENU, so crossing it
   keeps the wrap hovered (hover still propagates up the DOM, so the menu being position:fixed
   changes nothing here). Wider than the gap on purpose — a 6px bridge against a 6px gap
   loses to sub-pixel rounding at fractional zoom levels. */
.ss-user-menu::before{content:"";position:absolute;top:0;bottom:0;right:100%;width:12px}
.ss-user-menu button,.ss-user-menu a{display:flex;text-decoration:none;align-items:center;gap:8px;width:100%;background:none;border:none;color:#334155;font-size:13px;font-weight:700;padding:9px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;font-family:inherit;text-align:left}
/* Sign Out owns the red hover; My Profile is an <a> (it navigates rather than acting) and
   opts out via .neutral, same as Contact support. */
.ss-user-menu button:hover,.ss-user-menu a:hover{background:#FEF2F2;color:#DC2626}
/* Operator account switcher — click-toggled (NOT hover: the hover menu popping over
   content is what Carolyn flagged), opens UPWARD — .ss-user-menu did too until 2026-10-23. Its initials tile
   restyles .ss-clogo for the white rail (the original is white-on-dark for the topbar). */
.ss-switch-wrap{position:relative;margin-bottom:10px}
.ss-switch{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:9px;border:1px solid #E2E8F0;background:#F8FAFC;cursor:pointer;font-family:inherit;text-align:left}
.ss-switch:hover{background:#F1F5F9}
.ss-switch .ss-clogo{width:30px;height:30px;background:#3D3672;border-color:#3D3672;color:#FFF;font-size:11px}
.ss-switch .stext{min-width:0;display:flex;flex-direction:column}
.ss-switch .sname{font-size:12.5px;font-weight:800;color:#1E293B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-switch .srole{font-size:10.5px;font-weight:600;color:#94A3B8;white-space:nowrap}
.ss-switch .uchev{width:13px;height:13px;margin-left:auto;color:#94A3B8;flex-shrink:0}
.ss-switch-menu{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:#FFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,0.28);padding:6px;z-index:90}
.ss-switch-menu input{width:100%;box-sizing:border-box;border:1px solid #CBD5E1;border-radius:7px;padding:7px 9px;font-size:12.5px;font-family:inherit;margin-bottom:5px}
.ss-switch-list{max-height:264px;overflow-y:auto}
.ss-switch-list button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:#334155;font-size:12.5px;font-weight:700;padding:7px 8px;border-radius:7px;cursor:pointer;font-family:inherit;text-align:left}
.ss-switch-list button:hover{background:#F1F5F9}
.ss-switch-list button.cur{background:#FEF3C7}
.ss-switch-list .ss-clogo.sm{width:24px;height:24px;background:#EEF2FF;border-color:#C7D2FE;color:#3D3672;font-size:10px}
.ss-switch-list .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-switch-list .vw{margin-left:auto;font-size:10.5px;font-weight:800;color:#92400E;background:#FEF3C7;border-radius:6px;padding:2px 7px;flex-shrink:0}
.ss-switch-note{font-size:12px;color:#94A3B8;font-weight:600;padding:8px}
/* ACTING AS a person (2026-10-23). Each account row carries a flyout of the people on it;
   picking one opens the account wearing THEIR access. */
.ss-switch-row{position:relative}
.ss-switch-row .rchev{width:13px;height:13px;margin-left:4px;color:#CBD5E1;flex-shrink:0}
.ss-switch-row:hover .rchev{color:#64748B}
/* Opens to the LEFT. The menu it hangs off is right-aligned under a pill in the top-right
   corner, so a submenu on the right would start off the edge of the window. */
/* ⛔ position:FIXED, not absolute, and this is the whole reason the flyout exists at all.
   `.ss-switch-list` above is `overflow-y:auto`, so an absolutely-positioned child of a ROW
   is clipped to that scroll box — and this opens to the LEFT of it, entirely outside. It
   rendered, it had a size, and not one pixel of it was ever painted: measured at
   left/right -24/240 against a list spanning 244/544. Carolyn: "it has the appearance of
   being there, but isn't actually there."
   Fixed positioning escapes the clip; the coordinates come from the hovered row, so there
   is no top/right here to fight with them. */
.ss-switch-sub{position:fixed;width:250px;background:#FFF;
  border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,0.28);padding:6px;z-index:95;
  max-height:320px;overflow-y:auto}
.ss-switch-sub button{display:block;width:100%;background:none;border:none;color:#334155;font-size:12.5px;
  font-weight:700;padding:7px 8px;border-radius:7px;cursor:pointer;font-family:inherit;text-align:left}
.ss-switch-sub button:hover{background:#F1F5F9}
.ss-switch-sub button.cur{background:#FEF3C7}
.ss-switch-sub button.whole{border-bottom:1px solid #E2E8F0;border-radius:7px 7px 0 0;margin-bottom:4px;padding-bottom:9px}
.ss-switch-sub .sub{display:block;font-size:10.5px;font-weight:600;color:#94A3B8;margin-top:1px}
.ss-switch-sub .vw{float:right;font-size:10.5px;font-weight:800;color:#92400E;background:#FEF3C7;border-radius:6px;padding:2px 7px}
.ss-switch-exit{display:block;width:100%;margin-top:5px;background:#FFF7ED;border:1px solid #FDBA74;color:#9A3412;font-size:12.5px;font-weight:800;padding:8px 10px;border-radius:7px;cursor:pointer;font-family:inherit;text-align:left}
.ss-switch-exit:hover{background:#FFEDD5}
/* Sign Out owns the red hover; a neutral item must not look destructive. */
.ss-user-menu button.neutral:hover,.ss-user-menu a.neutral:hover{background:#F1F5F9;color:#1E293B}
.ss-user-menu button svg,.ss-user-menu a svg{width:15px;height:15px;flex-shrink:0}
.ss-avatar{width:34px;height:34px;border-radius:50%;background:#DBEAFF;border:1px solid #C3D9F7;color:#3D3672;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;flex-shrink:0}
.ss-user .uname{font-size:13px;font-weight:700;color:#1E293B;line-height:1.15;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.ss-user .umail{font-size:11px;color:#94A3B8;margin-top:1px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ss-topbar{background:linear-gradient(100deg,#3D3672 0%,#2B4C7E 52%,#1B7895 100%);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40}
.ss-topbar .ttl{font-size:18px;font-weight:800;color:#FFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.ss-topbar .ttl span{color:#C9DCEA;font-weight:600;font-size:13px;margin-left:10px}
.ss-topbar .tenant{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
/* The operator account switcher, moved out of the rail's foot and into this corner
   (2026-10-23). The base .ss-switch rules above are written for the WHITE rail; these
   repaint it for the dark gradient and flip the menu to open downward. */
.ss-topbar .ss-switch-wrap{margin:0 0 0 auto;min-width:0}
.ss-topbar .ss-switch{width:auto;min-width:0;background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.28);padding:5px 10px 5px 7px;gap:10px}
.ss-topbar .ss-switch:hover{background:rgba(255,255,255,0.22)}
.ss-topbar .ss-switch .ss-clogo{width:34px;height:34px;background:rgba(255,255,255,0.16);border-color:rgba(255,255,255,0.32);color:#FFF;font-size:12px}
.ss-topbar .ss-switch .sname{color:#FFF;font-size:15.5px;max-width:220px}
.ss-topbar .ss-switch .srole{color:rgba(255,255,255,0.74)}
.ss-topbar .ss-switch .uchev{color:rgba(255,255,255,0.85)}
/* Opens DOWNWARD now, and right-aligned under the pill rather than stretched to its
   width: left:0;right:0 made sense against a fixed-width rail and would make this as
   narrow as the business name here. */
.ss-topbar .ss-switch-menu{top:calc(100% + 8px);bottom:auto;left:auto;right:0;width:300px;color:#0F172A}
/* THE SUPPORT BUTTON (2026-10-27, SupportMenu in portal/04-orders.jsx), replacing the floating
   Feedback pill. It sits just before the switcher / tenant badge and takes the auto margin they
   used to take, so the pair stays at the right. The chat panel and the ticket dialog render into
   <body> (createPortal): a fixed child of this sticky bar would stack under page content above 40. */
.ss-topbar .ss-support{position:relative;margin-left:auto;flex-shrink:0}
.ss-topbar .ss-support ~ .ss-switch-wrap,.ss-topbar .ss-support ~ .tenant{margin-left:0}
.ss-sup-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.28);color:#FFF;border-radius:9px;padding:8px 12px;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.ss-sup-btn:hover{background:rgba(255,255,255,0.22)}
.ss-sup-btn svg{width:17px;height:17px;flex-shrink:0}
.ss-sup-menu{position:absolute;top:calc(100% + 8px);right:0;width:280px;background:#FFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,0.28);padding:6px;z-index:90;color:#0F172A}
.ss-sup-menu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:8px 9px;border-radius:7px;cursor:pointer;font-family:inherit;text-align:left}
.ss-sup-menu button:hover,.ss-sup-menu button:focus-visible{background:#F1F5F9}
.ss-sup-menu .ic{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.ss-sup-menu .tx{display:flex;flex-direction:column;min-width:0}
.ss-sup-menu .lb{font-size:13px;font-weight:700;color:#1E293B}
.ss-sup-menu .sb{font-size:11.5px;color:#64748B}
/* My Synergy Phone's download pop-up (11-sms SsPhoneAppPromo): the full-size card grows out of the corner card. */
.ss-app-promo-pop{animation:ssAppPromoIn .18s ease-out;transform-origin:bottom right}
@keyframes ssAppPromoIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ss-app-promo-pop{animation:none}}
/* On a narrow screen the account menu opens under the small card's corner (the card draws above the
   sticky rail), so the card steps aside while that menu is open. */
.ss-shell:has(.ss-user-wrap:hover,.ss-user-wrap:focus-within) [data-ss-app-promo="small"]{visibility:hidden}
.ss-sup-chat{position:fixed;top:70px;right:16px;width:400px;height:min(620px,calc(100vh - 86px));background:#FFF;border:1px solid #E2E8F0;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.3);display:flex;flex-direction:column;z-index:950;color:#0F172A;overflow:hidden;font-family:inherit}
.ss-sup-head{display:flex;align-items:center;gap:8px;padding:12px 14px;background:linear-gradient(100deg,#3D3672 0%,#1B7895 100%);color:#FFF}
.ss-sup-title{flex:1;min-width:0;display:flex;flex-direction:column}
.ss-sup-title>span:first-child{font-size:14.5px;font-weight:800}
.ss-sup-sub{font-size:11px;opacity:.85}
.ss-sup-ghost{background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.3);color:#FFF;border-radius:7px;padding:4px 9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.ss-sup-x{background:none;border:none;color:#FFF;font-size:22px;line-height:1;cursor:pointer;padding:0 2px}
.ss-sup-note{font-size:11.5px;color:#64748B;background:#F8FAFC;border-bottom:1px solid #E2E8F0;padding:7px 14px;line-height:1.4}
.ss-sup-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.ss-sup-me,.ss-sup-bot{max-width:88%;padding:8px 11px;border-radius:10px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.ss-sup-me{align-self:flex-end;background:#3D3672;color:#FFF;border-bottom-right-radius:3px}
.ss-sup-bot{align-self:flex-start;background:#F1F5F9;color:#1E293B;border-bottom-left-radius:3px}
.ss-sup-muted{align-self:flex-start;font-size:12.5px;color:#94A3B8;font-style:italic;padding:2px 4px}
.ss-sup-link{color:#1B7895;font-weight:700;text-decoration:underline}
.ss-sup-card{align-self:stretch;border:1px solid #C7D2FE;background:#EEF2FF;border-radius:10px;padding:10px 12px}

.ss-sup-card-b{font-size:13px;color:#1E293B;margin-top:3px}
.ss-sup-rate{align-self:flex-start;display:flex;align-items:center;gap:2px;margin:-5px 0 0 2px;font-size:11.5px;color:#64748B}
.ss-sup-rate button{background:none;border:1px solid transparent;border-radius:6px;padding:1px 5px;font-size:13px;line-height:1.3;cursor:pointer;opacity:.75;filter:grayscale(.6);font-family:inherit}
.ss-sup-rate button:hover,.ss-sup-rate button:focus-visible{opacity:1;filter:none;border-color:#E2E8F0}
.ss-sup-rate button[aria-pressed="true"]{opacity:1;filter:none;background:#EEF2FF;border-color:#C7D2FE}
.ss-sup-rate span{margin-left:4px}
.ss-sup-why{align-self:stretch;display:flex;gap:6px;margin-top:-2px}
.ss-sup-why input{flex:1;min-width:0;border:1px solid #CBD5E1;border-radius:7px;padding:6px 9px;font-size:12.5px;font-family:inherit}
.ss-sup-why button{background:#3D3672;color:#FFF;border:none;border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.ss-sup-form{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid #E2E8F0}
.ss-sup-form textarea{flex:1;min-width:0;resize:none;border:1px solid #CBD5E1;border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;line-height:1.4}
.ss-clogo{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.32);display:flex;align-items:center;justify-content:center;color:#FFF;flex-shrink:0;font-size:12px;font-weight:800}
.ss-tname{font-size:15.5px;font-weight:800;color:#FFF;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.ss-body{flex:1;padding:20px 24px}
.ss-inner{max-width:1240px}
/* Pipeline board (2026-10-12, Carolyn: "I am going to make this like the designer where it can be
   as wide as it needs to be"): while the board shows, the page drops its 1240px cap, and the stage
   columns share the full width or wrap onto another row, never a scroll bar (SalesPipelines,
   ssBoardColumns). Keyed on the board itself, so whichever page hosts it gets the width. */
.ss-inner:has([data-ss-board-wide]){max-width:none}
/* The Contacts hub's tab row (SsHubTabs, 02-sales.jsx). Ahsan, 2026-10-13: "design and contacts
   should be different from the pipelines visually so its easier to see and they should be on the
   right side of the screen may be with a bubble". The pipelines are underline tabs from the left;
   Contacts and Design list are a rounded two-part bubble at the far right. Carolyn's order from
   10-12 put those two first, on the left: to go back to it, set .ss-hub-lists's order to -1 (the
   pipelines' line grows to fill whatever the bubble leaves, on either side).
   The pipelines' line is flex-basis 0, so the bubble never wraps for want of room; the hub folds
   pipelines into the ▾ drop-down instead (ssHubLayout takes the bubble's width off the row, using
   the column-gap below as read from here). In a narrow row SsHubTabs sets data-ss-hub-stacked and
   the bubble takes its own line above the pipelines, still at the right. Only one thing in the row
   looks picked: the open pipeline's underline, or the bubble's white part (aria-selected). */
.ss-hub-row{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:16px;border-bottom:2px solid #E2E8F0;margin-bottom:14px;min-width:0}
.ss-hub-pipes{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;flex:1 1 0;min-width:0}
.ss-hub-lists{order:1;flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:3px;margin-bottom:4px;background:#F1F5F9;border:1px solid #E2E8F0;border-radius:999px}
.ss-hub-row[data-ss-hub-stacked] .ss-hub-lists{order:-1;margin:0 0 8px auto}
.ss-hub-row[data-ss-hub-stacked] .ss-hub-pipes{flex-basis:100%}
.ss-hub-seg{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.2px;line-height:18px;color:#475569;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background-color .12s,color .12s,box-shadow .12s}
.ss-hub-seg .ico{display:inline-flex}
.ss-hub-seg svg{width:15px;height:15px;flex-shrink:0}
.ss-hub-seg.locked{color:#94A3B8}
.ss-hub-seg:hover{background:rgba(255,255,255,.6);color:#1E293B}
.ss-hub-seg[aria-selected="true"]{background:#FFF;color:#3D3672;box-shadow:0 1px 3px rgba(15,23,42,.14),0 0 0 1px rgba(61,54,114,.18)}
.ss-hub-seg:focus-visible{outline:2px solid #1B7895;outline-offset:2px}
/* Designer tab: fixed-height shell, the embedded designer scrolls inside its host
   (body scroll would double-scroll under the sticky topbar). */
.ss-main.ss-designer-active{height:100vh;height:100dvh}
.ss-main.ss-designer-active .ss-body{padding:0;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.ss-designer-host{flex:1;min-height:0;width:100%;overflow:auto;background:#F8FAFC}
/* Advanced tab (2026-09-29): full-bleed like the Designer, but the WINDOW scrolls (no fixed-height
   shell), so its 3D column can stay sticky under the topbar. Beats the phone rule's padding too. */
.ss-main.ss-advanced-active .ss-body{padding:0;background:#F8FAFC}
/* Projects tab (2026-09-12): same fixed-height shell as the designer, but the card keeps its
   padding and its own chrome. The board's table is the only thing that scrolls, so its
   column header can pin (a sticky <th> is inert while the page scrolls past its wrapper).
   These three rules are LOAD-BEARING for the pinned header: without them .ss-main has no
   height cap, the table wrapper never scrolls, and the sticky header does nothing — which is
   exactly what shipped for ~20 minutes on 2026-09-12 when a rebase conflict on this file's
   cache-buster was resolved by taking upstream and the rules went with it. */
.ss-main.ss-projects-active{height:100vh;height:100dvh}
.ss-main.ss-projects-active .ss-body{min-height:0;display:flex;flex-direction:column}
.ss-main.ss-projects-active .ss-inner{flex:1;min-height:0;display:flex;flex-direction:column}
/* (The .ss-admin-active / .ss-admin-host rules that used to live here existed only to give
   the Admin IFRAME a full-height, single-scroller host. Admin is native as of 2026-07-30 —
   it renders inside .ss-inner like Settings, so it needs no special layout at all.) */
.ss-main.ss-viewing{box-shadow:inset 0 3px 0 #B45309}
.ss-stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:2px}
@media (max-width:680px){.ss-stage-grid{grid-template-columns:1fr}}
@media (max-width:900px){
  .ss-side{width:68px;flex-basis:68px;padding:18px 10px;align-items:center}
  /* The lockup is 3.65:1 — at 48px wide it would be a 13px sliver, unreadable and
     mistakable for a stray line. There is no square mark in this logo (the favicon is
     deliberately favicon-only), so the collapsed rail goes purely to icons. */
  .ss-brand{display:none}
  /* The switcher needs readable tenant names; a 48px-wide list serves nobody, and the
     sidebar's own overflow-y would clip a fly-out. The Accounts page covers this mode. */
  .ss-navlabel,.ss-nav .lbl,.ss-nav .soon,.ss-nav .lock,.ss-newlink span,.ss-back span,.ss-user .utext,.ss-user .uchev,.ss-side .ss-switch-wrap{display:none}
  /* ⚠️ `.ss-switch-wrap` was UNSCOPED here until 2026-10-23, when the switcher moved
     into the topbar. Left as it was, this rule would have hidden it on every screen under
     900px — nothing to click, no error, and only findable by opening a tablet. Scoped to
     the rail, which is all it ever meant. */
  .ss-nav{width:100%}
  .ss-nav a,.ss-nav button{justify-content:center;gap:0;padding:10px 0}
  /* The settings rail collapses like the workspace one — every sub-page has a glyph
     (SETTINGS_ICONS) precisely so it can, and each item keeps its full label in `title`. */
  .ss-back{justify-content:center;gap:0;padding:8px 0}
  .ss-newlink{justify-content:center;padding:0}
  /* The fly-out is position:fixed, so it does not follow the narrow rail on its own.
     `bottom` is 14px + the 18px BOTTOM PADDING this block puts back on .ss-side — the
     wide rail is `16px 14px 0` precisely so .ss-foot can own its bottom edge, and this
     override restores padding on all four sides, lifting the footer 18px off the
     viewport floor. Measured, not guessed; re-measure if either padding changes. */
  .ss-user-menu{left:74px;bottom:32px}
  .ss-user{justify-content:center}
  .ss-foot{width:100%}
  /* The menu KEEPS its labels in the collapsed rail (2026-10-23). They were hidden, and
     the rows centred, back when it opened upward inside a 68px rail — there was no room
     for words. It now flies out to the right at its full width, so hiding them left three
     lone icons floating in a 212px panel. Nothing else in this block changes: the NAV is
     still icon-only, because those rows really are 68px wide. */
}
@media (max-width:560px){
  .ss-topbar{padding:12px 14px}
  .ss-topbar .ttl span{display:none}
  .ss-tname{display:none}
  /* Same rule for the switcher: the avatar and chevron stay tappable, the words go. */
  .ss-topbar .ss-switch .stext{display:none}
  .ss-topbar .ss-switch-menu{width:min(300px,calc(100vw - 28px))}
  /* No room beside the menu at this width, so the people sit under their account rather
     than beside it — a flyout here would open off-screen. */
  .ss-switch-sub{position:static;width:auto;box-shadow:none;border:none;border-left:2px solid #E2E8F0;
    border-radius:0;margin:4px 0 4px 10px;padding:2px 0 2px 6px;max-height:none}
  .ss-body{padding:14px 12px}
}
/* Support on a phone: the button is its icon, and the chat is a full-screen sheet. */
@media (max-width:640px){
  .ss-sup-btn{padding:7px 9px}
  .ss-sup-btn-t{display:none}
  .ss-sup-menu{width:min(280px,calc(100vw - 28px))}
  .ss-sup-chat{top:0;right:0;bottom:0;left:0;width:auto;height:auto;border-radius:0;border:none}
}
/* Options-tab catalog tables: tighter gutters so the wide fixture tables (Doors/Windows/Ramps,
   now carrying the Internal-only column) fit without a horizontal scroll bar. Scoped to the
   .tight wrapper so the shared S.td padding is untouched for every other table. */
.tight th,.tight td{padding-left:6px;padding-right:6px}
.tight td{padding-top:8px;padding-bottom:8px}
.tight input{box-sizing:border-box}
/* ── THE SIZES & PRICES TABLE (/settings/sheds-table; 03-catalog.jsx PricingTablePage, 2026-10-30) ──
   A window-high column whose grid box is the only thing that scrolls, both ways. 100dvh where the
   browser has it: iOS Safari's 100vh runs under its own bar. Every class is .ss-pg-*; nothing else
   in this file uses that prefix. */
.ss-pg{height:100vh;height:100dvh;display:flex;flex-direction:column;background:#F6F9FE;color:#1E293B;overflow:hidden}
.ss-pg-bar{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 14px;background:#FFF;border-bottom:1px solid #E2E8F0;flex-shrink:0;min-width:0}
.ss-pg-back{font-size:12.5px;font-weight:700;color:#475569;text-decoration:none;border:1px solid #E2E8F0;background:#F8FAFC;border-radius:8px;padding:6px 10px;white-space:nowrap}
.ss-pg-back:hover{background:#F1F5F9}
.ss-pg-title{font-size:15px;font-weight:800;white-space:nowrap}
.ss-pg-co{font-size:12.5px;font-weight:700;color:#991B1B;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss-pg-jump{font:inherit;font-size:12.5px;font-weight:600;color:#334155;border:1px solid #CBD5E1;border-radius:7px;padding:5px 8px;background:#FFF;max-width:180px}
.ss-pg-tog{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:#475569;white-space:nowrap;cursor:pointer}
.ss-pg-readout{flex:1;min-width:0;font-size:12.5px;font-weight:700;color:#334155;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.ss-pg-badge{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;border:1px solid;flex-shrink:0}
.ss-pg-badge-green{background:#F0FDF4;border-color:#BBF7D0;color:#15803D}
.ss-pg-badge-grey{background:#F1F5F9;border-color:#E2E8F0;color:#475569}
.ss-pg-badge-red{background:#FEF2F2;border-color:#FECACA;color:#B91C1C}
.ss-pg-badge-blue{background:#EFF6FF;border-color:#BFDBFE;color:#1D4ED8}
.ss-pg-badge-amber{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
.ss-pg-badge-btn{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-decoration:underline}
.ss-pg-bact{font:inherit;font-size:12px;font-weight:700;border:1px solid #CBD5E1;background:#FFF;color:#334155;border-radius:7px;padding:3px 8px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.ss-pg-q{width:28px;height:28px;border-radius:50%;border:1px solid #CBD5E1;background:#FFF;font:inherit;font-weight:800;color:#475569;cursor:pointer;flex-shrink:0}
.ss-pg-op{background:#FEE2E2;border-bottom:1px solid #DC2626;color:#991B1B;font-size:12.5px;font-weight:700;padding:6px 14px;flex-shrink:0}
.ss-pg-status{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:6px 14px;border-bottom:1px solid #E2E8F0;flex-shrink:0;line-height:1.4}
.ss-pg-status-grey{background:#F8FAFC;color:#475569}
.ss-pg-status-amber{background:#FEF3C7;color:#92400E}
.ss-pg-status-red{background:#FEF2F2;color:#991B1B}
.ss-pg-status button,.ss-pg-fail button,.ss-pg-narrow button{font:inherit;font-size:12.5px;font-weight:700;border:1px solid #CBD5E1;background:#FFF;color:#334155;border-radius:7px;padding:4px 10px;cursor:pointer;flex-shrink:0}
.ss-pg-legend{font-size:12.5px;color:#475569;background:#FFF;border-bottom:1px solid #E2E8F0;padding:6px 14px;flex-shrink:0;line-height:1.4}
.ss-pg-narrow{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:12.5px;color:#1B7895;background:#DBEAFF;border-bottom:1px solid #75E6DA;padding:6px 14px;flex-shrink:0}
.ss-pg-optbox{background:#FEF3C7;border-bottom:1px solid #FDE68A;color:#92400E;font-size:13px;line-height:1.5;padding:9px 14px;flex-shrink:0}
.ss-pg-optbox a{color:#92400E;font-weight:800}
.ss-pg-msg{margin:40px auto;max-width:460px;padding:0 16px;text-align:center;font-size:14px;color:#475569;line-height:1.5}
.ss-pg-msg-inline{margin:16px auto}
.ss-pg-msg a{color:#3D3672;font-weight:700}
.ss-pg-box{flex:1;min-height:0;overflow:auto;position:relative;background:#FFF;overscroll-behavior:contain}
.ss-pg-fail{padding:40px 16px;text-align:center;font-size:14px;color:#475569;display:flex;flex-direction:column;gap:10px;align-items:center}
.ss-pg-fail-why{font-size:12px;color:#94A3B8}
.ss-pg-skel{padding:12px}
/* The grid. border-collapse:separate so a sticky cell keeps its borders; one scroller for both axes. */
.ss-pg-grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;font-variant-numeric:tabular-nums;outline:none}
.ss-pg-grid th,.ss-pg-grid td{border-right:1px solid #E2E8F0;border-bottom:1px solid #E2E8F0;background:#FFF;overflow:hidden}
.ss-pg-grid td{height:28px;padding:0 4px;white-space:nowrap;text-overflow:ellipsis;text-align:center;cursor:default}
.ss-pg-grid td.ss-pg-size{text-align:left;font-weight:700}
.ss-pg-grid td.ss-pg-price{text-align:right}
.ss-pg-grid td.ss-pg-off{color:#15803D;font-weight:800}
/* Layers (plan 3.6): corner 7, header 6, the selection over a frozen column 5, frozen body 4, the
   selection over an option column 2. Section band at top 0, names at 22px. */
.ss-pg-sec th{position:sticky;top:0;z-index:6;height:22px;padding:0 6px;font-size:10.5px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;text-overflow:ellipsis;text-align:left}
/* A section narrower than its name (ssPgSecNarrow; one 44 px column fits none of them in capitals):
   the name in its own case at 9.5 px, centred on up to two 9.5 px lines inside the same 22 px band,
   a long word breaking only at its soft hyphen (ssPgSecText). Never cut, and the band never grows.
   Measured (10-31): two 10 px lines put the second line's text box half a pixel past the band. */
.ss-pg-sec th.ss-pg-secn{padding:0 1px;font-size:9.5px;line-height:9.5px;letter-spacing:0;text-transform:none;white-space:normal;text-align:center;-webkit-hyphens:manual;hyphens:manual}
/* height = the measured --ss-pg-hh exactly: 8 px of padding top and bottom, no bottom border (the
   divider is a shadow), so a name's box is the height less 16 px, which is what .ss-pg-vh allows. */
.ss-pg-names th{position:sticky;top:22px;z-index:6;height:var(--ss-pg-hh,64px);padding:8px 4px;vertical-align:top;text-align:center;border-bottom:0;box-shadow:inset 0 -2px 0 #CBD5E1}
.ss-pg-names th.ss-pg-fh{vertical-align:bottom;text-align:left;font-size:11px;font-weight:800;color:#64748B;text-transform:uppercase;letter-spacing:.4px}
.ss-pg-names th.ss-pg-s0{border-left:2px solid #CBD5E1}
.ss-pg-grid .ss-pg-f0{position:sticky;left:0;z-index:4}
.ss-pg-grid .ss-pg-f1{position:sticky;left:64px;z-index:4}
.ss-pg-grid .ss-pg-f2{position:sticky;left:140px;z-index:4;border-right:2px solid #CBD5E1}
.ss-pg-grid .ss-pg-corner{position:sticky;left:0;top:0;z-index:7;border-right:2px solid #CBD5E1}
.ss-pg-grid thead .ss-pg-f0,.ss-pg-grid thead .ss-pg-f1,.ss-pg-grid thead .ss-pg-f2{z-index:7}
/* A name stands on end, top to bottom, and wraps onto a second line inside its column rather
   than being cut. The header's height (--ss-pg-hh) is MEASURED to the longest name (PricingTablePage).
   vertical-RL, not -lr: both turn the letters the same way, but -lr puts a name's second line to the
   RIGHT of its first, so a reader who tilts their head to the right reads the two lines bottom one
   first ("and Kickplate (6'x7')" above "Double Door with Transom"). -rl is the whole name turned a
   quarter clockwise, second line to the left. Bottom-to-top instead is transform:rotate(180deg). */
.ss-pg-vh{display:inline-block;vertical-align:top;writing-mode:vertical-rl;white-space:normal;line-height:15px;max-inline-size:calc(var(--ss-pg-hh,64px) - 16px);font-size:12px;font-weight:700;color:#1E293B;text-align:start}
.ss-pg-grid .ss-pg-rtp{background:#F1F5F9;color:#64748B}
/* A price Real-Time Pricing sets is grey AND locked (plan 3.13: a shape as well as a colour). The
   lock sits in the cell's top-left corner, out of the right-aligned number's way; the sticky cell is
   its box, and below 700 px, where the price is no longer frozen, position:relative keeps it so. */
.ss-pg-grid tbody td.ss-pg-rtp::before{content:"\1F512";position:absolute;left:2px;top:2px;font-size:9px;line-height:1;opacity:.75}
.ss-pg-grid td.ss-pg-dis{background:#F8FAFC}
/* Hidden from the designer: 55% text, not opacity, because a frozen cell must stay opaque over
   whatever scrolls under it. */
.ss-pg-grid tr.ss-pg-hid td{color:rgba(30,41,59,.55)}
/* THE SELECTION, THE EDITOR AND THE MARKS (Phase 3, 2026-10-31). The ring and the range are one
   overlay placed by the page (PgSelectionOverlay), never a class on a cell: .ss-pg-sheet is their
   frame (the grid's own width), and .ss-pg-lane is a zero-size sticky strip at its left edge that
   rides along with the frozen columns, so a ring over Price stays on Price while the options scroll. */
.ss-pg-sheet{position:relative}
.ss-pg-lane{position:sticky;left:0;width:0;height:0;z-index:5}
.ss-pg-ring,.ss-pg-range{position:absolute;display:none;box-sizing:border-box;pointer-events:none;z-index:2}
.ss-pg-ring{box-shadow:inset 0 0 0 2px #3D3672}
.ss-pg-range{background:rgba(61,54,114,.08);border:1px solid rgba(61,54,114,.45)}
.ss-pg-ed{position:absolute;z-index:3;box-sizing:border-box;margin:0;border:2px solid #3D3672;border-radius:0;padding:0 4px;font:inherit;font-size:13px;font-variant-numeric:tabular-nums;color:#1E293B;background:#FFF;outline:none;text-align:center;min-width:0}
.ss-pg-ed-price{text-align:right}
/* Marks: a shape as well as a colour (plan 3.13). Waiting to save: a blue corner. Refused or not
   valid: a red outline and "!". Changed elsewhere: an amber outline and "↺". Backgrounds, not
   ::after, so a frozen cell stays sticky. A saved box flashes green for 600 ms (.ss-pg-ok). */

        // of those requests correctly. Chrome revalidates the DOCUMENT on a normal reload and
        // takes subresources from cache; the compiled bundles are served

        // to a year - and the only escape is a hard reload the user has no reason to know
        // about. So re-fetch with cache:"reload", which bypasses the HTTP cache AND overwrites
        // the entry, and only then reload, onto the repaired copies.
        //

        // outliving several deploys is the other way this page gets stuck.
