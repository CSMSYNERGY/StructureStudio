function Dashboard({ session }) {
  const [tenant, setTenant] = useState(null);   // { clientId, businessName } | "none" | null(loading)
  const [tab, setTab] = useState("designs");

  useEffect(() => {
    (async () => {
      // limit(1)+array instead of maybeSingle(): maybeSingle() ERRORS when >1 row
      // matches (a duplicate/multi-tenant client_users row), which would lock the
      // user out of their own dashboard; take the first mapping instead. (audit #F6)
      const { data: cuRows, error } = await sb.from("client_users").select("client_id, role").limit(1);
      const mapping = cuRows && cuRows[0];
      if (error || !mapping) { setTenant("none"); return; }
      let businessName = mapping.client_id;
      // client_configs is now column-structured (no monolithic `config` blob);
      // read the dedicated company_name column for the dashboard heading.
      const { data: cfg } = await sb.from("client_configs").select("company_name").eq("client_id", mapping.client_id).maybeSingle();
      if (cfg && cfg.company_name) {
        businessName = cfg.company_name;
      }
      setTenant({ clientId: mapping.client_id, businessName, role: mapping.role || "user" });
    })();
  }, [session]);

  const signOut = () => sb.auth.signOut();

  if (tenant === null) {
    return <div style={{ padding: 40, textAlign: "center", color: "#64748B", fontSize: 14 }}>Loading your business…</div>;
  }
  if (tenant === "none") {
    return (
      <div style={{ maxWidth: 420, margin: "60px auto", padding: "0 16px" }}>
        <div style={{ ...S.card, textAlign: "center" }}>
          <div style={{ ...S.h2, fontSize: 16 }}>No business linked to this account</div>
          <p style={{ fontSize: 13, color: "#64748B", marginBottom: 16 }}>Your login works, but it isn't connected to a business yet. Contact CSM Synergy to finish your setup.</p>
          <button onClick={signOut} style={S.btn("#1E293B", "#FFF")}>Sign Out</button>
        </div>
      </div>
    );
  }

  // Only owners/admins manage Pricing + Settings; regular team members see only
  // Designs & Leads. Gate both the tabs and the rendered content (so a non-admin
  // can't reach the other views even by forcing the tab state).
  const isAdmin = tenant.role === "owner" || tenant.role === "admin";
  // Non-admins are confined to the designs list, plus the read-only "What's New" tab (product news).
  const activeTab = (!isAdmin && tab !== "designs" && tab !== "releases") ? "designs" : tab;

  const tabBtn = (id, label) => (
    <button onClick={() => setTab(id)} style={{
      ...S.btn(activeTab === id ? "#75E6DA" : "transparent", activeTab === id ? "#3D3672" : "#75E6DA"),
      borderRadius: "8px 8px 0 0", padding: "10px 18px",
    }}>{label}</button>
  );

  return (
    <div>
      <div style={{ background: "linear-gradient(135deg, #3D3672 0%, #1B7895 100%)", padding: "0 24px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "16px 0 12px" }}>
          <div style={S.badge}>SS</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 800, fontSize: 17, color: "#FFF" }}>{tenant.businessName}</div>
            <div style={{ fontSize: 12, color: "#94A3B8" }}>Business Portal · {session.user.email}</div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6 }}>
            <button onClick={signOut} style={{ ...S.btn("rgba(255,255,255,0.1)", "#E2E8F0"), border: "1px solid rgba(255,255,255,0.2)" }}>Sign Out</button>
            <span onClick={() => setTab("releases")}
              style={{ fontSize: 12, color: "#94A3B8", cursor: "pointer", textDecoration: "underline", whiteSpace: "nowrap" }}>
              New features / Bug fixes
            </span>
          </div>
        </div>
        <div style={{ display: "flex", gap: 4 }}>
          {tabBtn("designs", "Designs & Leads")}
          {isAdmin && tabBtn("pricing", "Pricing")}
          {isAdmin && tabBtn("layout-pricing", "Layout Pricing")}
          {isAdmin && tabBtn("colors", "Colors")}
          {isAdmin && tabBtn("settings", "Settings")}
        </div>
      </div>
      <div style={{ padding: "20px 24px" }}>
        {activeTab === "designs" && (<><ShareLinkCard clientId={tenant.clientId} /><DesignsTable clientId={tenant.clientId} /></>)}
        {activeTab === "releases" && <ReleasesView />}
        {activeTab === "pricing" && isAdmin && <PricingCsv />}
        {activeTab === "layout-pricing" && isAdmin && <LayoutPricing />}
        {activeTab === "colors" && isAdmin && <ColorsView />}
        {activeTab === "settings" && isAdmin && <SettingsView />}
      </div>
    </div>
  );
}

// ─── App root: session + recovery routing ───
function PortalApp() {
  const [session, setSession] = useState(undefined); // undefined = booting
  const [recovery, setRecovery] = useState(false);

  useEffect(() => {
    // A recovery- or invite-email link lands here with #…type=recovery or
    // #…type=invite. supabase-js exchanges the token automatically
    // (detectSessionInUrl); we route both to the set-password view so a freshly
    // invited owner sets a password instead of dropping into the dashboard with none.
    const h = window.location.hash;
    if (h.includes("type=recovery") || h.includes("type=invite")) setRecovery(true);
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((event, sess) => {
      setSession(sess || null);
      if (event === "PASSWORD_RECOVERY") setRecovery(true);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  if (session === undefined) {
    return <div style={{ padding: 60, textAlign: "center", color: "#64748B", fontSize: 14 }}>Loading…</div>;
  }
  if (session && recovery) return <ResetPasswordView onDone={() => { setRecovery(false); window.location.hash = ""; }} />;
  if (!session) return (
    <div>
      <div style={S.header}>
        <div style={S.badge}>SS</div>
        <div>
          <div style={{ fontWeight: 800, fontSize: 17 }}>StructureStudio</div>
          <div style={{ fontSize: 12, color: "#94A3B8" }}>Business Portal</div>
        </div>
      </div>
      <LoginView />
    </div>
  );
  return <Dashboard session={session} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<PortalApp />);
</script></body></html>
