// ─── Orders & payments ───
// An order appears automatically once a design's status reaches accepted (the
// designs_ensure_order trigger, migration 053). This view is the money view:
// what each job is worth, what's been collected, and what's still owed.
//
// Phase 1 is RECORD-ONLY — cash / check / card-taken-elsewhere. Nothing is charged
// here, so no payment gateway is involved; balances are still real. Card charging
// drops in later on the same payments table (its gateway_* columns are already there).
//
// Totals come from the GHL estimate via sync-design-status (GHL applies tax, so our
// pre-tax subtotal is not a safe substitute). When GHL hasn't given us one, the total
// reads "Set total" and the owner types it — we never show a guessed number.
const money = (cents) => cents == null ? "—" : "$" + (cents / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// Dollars → cents. Returns NaN for anything without a digit: Number("") is 0, so a
// blank or junk field would otherwise read as a legitimate $0.00 and get saved.
const centsFrom = (txt) => {
  const s = String(txt == null ? "" : txt);
  if (!/\d/.test(s)) return NaN;
  const n = Number(s.replace(/[^0-9.\-]/g, ""));
  return Number.isFinite(n) ? Math.round(n * 100) : NaN;
};
// Today in the LOCAL calendar (en-CA renders YYYY-MM-DD). Not toISOString(), which is
// UTC — that files an evening payment under tomorrow's date for every US timezone.
const todayLocal = () => new Date().toLocaleDateString("en-CA");
const PAY_METHODS = [["cash", "Cash"], ["check", "Check"], ["card", "Card"], ["ach", "Bank / ACH"], ["other", "Other"]];

function OrdersView({ clientId }) {
  const [rows, setRows] = useState(null);   // null = loading; [{order, design, paid}]
  const [error, setError] = useState(null);
  const [openId, setOpenId] = useState(null);
  const [query, setQuery] = useState("");
  const [filter, setFilter] = useState("all");

  const load = useCallback(async () => {
    setError(null);
    const { data: ords, error: oErr } = await sb
      .from("orders").select("*").eq("client_id", clientId).order("ordered_at", { ascending: false }).limit(2000);
    if (oErr) { setError(oErr.message); setRows([]); return; }
    const list = ords || [];
    const codes = list.map((o) => o.short_code).filter(Boolean);
    // designs + payments are separate reads: orders.short_code is a soft link (a
    // future manual order has none), so there's no FK for PostgREST to embed.
    const [{ data: dsn }, { data: pays }] = await Promise.all([
      codes.length
        ? sb.from("designs").select("short_code, contact, selections, status, image_url, ghl_estimate_number").in("short_code", codes).limit(2000)
        : Promise.resolve({ data: [] }),
      // ALL payments, voided included — voided rows stay visible in the history (the
      // void dialog promises exactly that); they're excluded from the math below, not
      // from the fetch. Explicit limits so a large tenant fails loudly in testing
      // rather than silently truncating and understating what a customer still owes.
      sb.from("payments").select("*").eq("client_id", clientId).order("received_at", { ascending: false }).limit(5000),
    ]);
    const byCode = {}; (dsn || []).forEach((d) => { byCode[d.short_code] = d; });
    const payByOrder = {}; (pays || []).forEach((p) => { (payByOrder[p.order_id] = payByOrder[p.order_id] || []).push(p); });
    setRows(list.map((o) => {
      const ps = payByOrder[o.id] || [];
      return {
        o, d: byCode[o.short_code] || null, pays: ps,
        paid: ps.reduce((s, p) => s + (p.voided_at ? 0 : (p.amount_cents || 0)), 0),
      };
    }));
  }, [clientId]);

  // Pull fresh totals + externally-collected payments from GHL, then re-read.
  // Kept separate from load(): recording a payment re-reads the tables (instant),
  // while this hits the GHL API and only runs on mount and on Refresh.
  const [syncing, setSyncing] = useState(false);
  const syncFromGhl = useCallback(async () => {
    setSyncing(true);
    try {
      const { data: ords } = await sb.from("orders").select("short_code").eq("client_id", clientId).limit(2000);
      const codes = (ords || []).map((o) => o.short_code).filter(Boolean);
      if (codes.length) await sb.functions.invoke("sync-design-status", { body: { shortCodes: codes } });
    } catch (_e) { /* non-fatal: the tables still render what we already have */ }
    setSyncing(false);
    await load();
  }, [clientId, load]);

  const didSync = useRef(false);
  useEffect(() => {
    load();
    if (!didSync.current) { didSync.current = true; syncFromGhl(); }
  }, [load, syncFromGhl]);

  const nameOf = (r) => ((r.d && r.d.contact && r.d.contact.name) || "—");
  const bldgOf = (r) => {
    const sel = (r.d && r.d.selections) || {};
    return [titleCase(sel.style), sel.size].filter(Boolean).join(" ") || "—";
  };
  const balOf = (r) => (r.o.total_cents == null ? null : r.o.total_cents - r.paid);
  const stateOf = (r) => {
    const bal = balOf(r);
    if (bal == null) return { key: "nototal", label: "Needs total", bg: "#F1F5F9", fg: "#475569" };
    // Collected more than the total — say so plainly instead of "Paid in full",
    // which would hide that a refund/credit is owed back to the customer.
    if (bal < 0) return { key: "over", label: "Overpaid", bg: "#FFEDD5", fg: "#9A3412" };
    if (bal === 0) return { key: "paid", label: "Paid in full", bg: "#DCFCE7", fg: "#166534" };
    if (r.paid > 0) return { key: "partial", label: "Partially paid", bg: "#DBEAFE", fg: "#1E40AF" };
    // Nothing collected yet — and these are two different jobs. A quote the customer
    // accepted but nobody has billed is the OWNER's move; an invoice that's out and
    // unpaid is the CUSTOMER's. Lumping both under "Unpaid" hides the follow-up.
    return ((r.d && r.d.status) === "accepted")
      ? { key: "needsinvoice", label: "Needs invoice", bg: "#FEF3C7", fg: "#92400E" }
      : { key: "awaiting", label: "Awaiting payment", bg: "#FFE4E6", fg: "#9F1239" };
  };

  const all = rows || [];
  const shown = all.filter((r) => {
    if (filter !== "all" && stateOf(r).key !== filter) return false;
    const extra = [nameOf(r), bldgOf(r), "#" + r.o.order_no, r.o.short_code,
      (r.d && r.d.ghl_estimate_number) ? "EST-" + r.d.ghl_estimate_number : "", stateOf(r).label, fmtDate(r.o.ordered_at)].join(" ");
    return rowMatchesQuery(r.o, query, extra);
  });
  const openRow = openId ? all.find((r) => r.o.id === openId) : null;

  // Summary tiles — only orders with a known total can contribute to money figures.
  const withTotal = all.filter((r) => r.o.total_cents != null);
  const openBalance = withTotal.reduce((s, r) => s + Math.max(0, balOf(r)), 0);
  const collected = all.reduce((s, r) => s + r.paid, 0);
  // Voided rows are fetched (they stay visible in the history) but must not be counted.
  const payCount = all.reduce((s, r) => s + r.pays.filter((p) => !p.voided_at).length, 0);
  const needsInvoice = all.filter((r) => stateOf(r).key === "needsinvoice").length;
  const awaitingCount = all.filter((r) => stateOf(r).key === "awaiting").length;
  const needsTotal = all.filter((r) => r.o.total_cents == null).length;

  if (error) return <div style={S.err}>Couldn't load orders: {error}</div>;
  if (rows === null) return <div style={{ ...S.card, color: "#64748B", fontSize: 13 }}>Loading orders…</div>;

  if (openRow) return <OrderDetail row={openRow} clientId={clientId} onBack={() => setOpenId(null)} onChanged={load} stateOf={stateOf} nameOf={nameOf} bldgOf={bldgOf} balOf={balOf} />;

  const tile = (label, value, note, accent) => (
    <div style={{ ...S.card, marginBottom: 0, padding: "13px 15px", borderLeft: accent ? `3px solid ${accent}` : S.card.border }}>
      <div style={{ fontSize: 10.5, fontWeight: 700, color: "#64748B", textTransform: "uppercase", letterSpacing: 0.5 }}>{label}</div>
      <div style={{ fontSize: 23, fontWeight: 800, marginTop: 5, fontVariantNumeric: "tabular-nums", letterSpacing: -0.5 }}>{value}</div>
      <div style={{ fontSize: 11, color: "#94A3B8", marginTop: 3 }}>{note}</div>
    </div>
  );
  const chip = (id, label) => (
    <button key={id} type="button" onClick={() => setFilter(id)}
      style={{ background: filter === id ? ACCENT : "#F1F5F9", border: `1px solid ${filter === id ? ACCENT : "#E2E8F0"}`, color: filter === id ? "#FFF" : "#475569", fontSize: 12, fontWeight: 700, borderRadius: 20, padding: "6px 13px", cursor: "pointer", fontFamily: "inherit" }}>{label}</button>
  );

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(168px, 1fr))", gap: 11, marginBottom: 16 }}>
        {tile("Open balance", money(openBalance), `across ${withTotal.filter((r) => balOf(r) > 0).length} open orders`, "#F59E0B")}
        {tile("Collected", money(collected), `${payCount} payment${payCount === 1 ? "" : "s"} recorded`, "#16A34A")}
        {tile("Needs invoice", String(needsInvoice), needsInvoice ? "accepted, not billed yet" : "all billed", "#92400E")}
        {tile("Awaiting payment", String(awaitingCount), "invoiced, nothing collected", "#9F1239")}
        {needsTotal > 0 && tile("Needs a total", String(needsTotal), "set it on the order", null)}
      </div>

      <div style={S.card}>
        <div style={{ display: "flex", alignItems: "center", gap: 9, flexWrap: "wrap", marginBottom: 12 }}>
          <div style={{ ...S.h2, marginBottom: 0, marginRight: 4 }}>Orders {rows ? (query || filter !== "all" ? `(${shown.length} of ${all.length})` : `(${all.length})`) : ""}</div>
          {chip("all", "All")}{chip("needsinvoice", "Needs invoice")}{chip("awaiting", "Awaiting payment")}{chip("partial", "Partially paid")}{chip("paid", "Paid in full")}
          {needsTotal > 0 && chip("nototal", "Needs total")}
          {all.some((r) => stateOf(r).key === "over") && chip("over", "Overpaid")}
          <div style={{ marginLeft: "auto", minWidth: 240, flex: "0 1 300px" }}>
            <SearchInput value={query} onChange={setQuery} placeholder="Search orders — name, building, order #…" />
          </div>
          <button onClick={syncFromGhl} disabled={syncing} style={{ ...S.btn("#F1F5F9", "#334155"), border: "1px solid #E2E8F0", padding: "6px 12px", opacity: syncing ? 0.6 : 1 }}>{syncing ? "Syncing…" : "↻ Refresh"}</button>
        </div>

        {all.length === 0 && (
          <p style={{ fontSize: 13, color: "#64748B", padding: 12 }}>
            No orders yet. An order appears here automatically as soon as a customer accepts their quote.
          </p>
        )}
        {all.length > 0 && shown.length === 0 && (
          <p style={{ fontSize: 13, color: "#64748B", padding: 12 }}>No orders match this filter.</p>
        )}
        {shown.length > 0 && (
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead><tr>
                <th style={S.th}>Order</th><th style={S.th}>Customer</th><th style={S.th}>Building</th><th style={S.th}>Ordered</th>
                <th style={{ ...S.th, textAlign: "right" }}>Total</th><th style={{ ...S.th, textAlign: "right" }}>Paid</th>
                <th style={{ ...S.th, textAlign: "right" }}>Balance</th><th style={S.th}>Status</th><th style={S.th}></th>
              </tr></thead>
              <tbody>
                {shown.map((r) => {
                  const st = stateOf(r); const bal = balOf(r);
                  const numCell = { ...S.td, textAlign: "right", fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" };
                  return (
                    <tr key={r.o.id} onClick={() => setOpenId(r.o.id)} style={{ cursor: "pointer" }}>
                      <td style={{ ...S.td, fontWeight: 700, whiteSpace: "nowrap" }}>#{r.o.order_no}</td>
                      <td style={{ ...S.td, fontWeight: 700 }}>{nameOf(r)}
                        <div style={{ fontSize: 11, color: "#94A3B8", fontWeight: 500 }}>{(r.d && r.d.contact && r.d.contact.phone) || ""}</div></td>
                      <td style={S.td}>{bldgOf(r)}</td>
                      <td style={{ ...S.td, whiteSpace: "nowrap" }}>{fmtDate(r.o.ordered_at)}</td>
                      <td style={numCell}>{r.o.total_cents == null ? <span style={{ color: ACCENT, fontWeight: 700 }}>Set total</span> : money(r.o.total_cents)}</td>
                      <td style={numCell}>{r.paid ? money(r.paid) : <span style={{ color: "#94A3B8" }}>—</span>}</td>
                      <td style={{ ...numCell, fontWeight: bal ? 800 : 600, color: bal === 0 ? "#94A3B8" : bal < 0 ? "#9A3412" : "#1E293B" }}>
                        {bal == null ? "—" : bal < 0 ? `${money(-bal)} credit` : money(bal)}
                      </td>
                      <td style={S.td}><span style={{ background: st.bg, color: st.fg, borderRadius: 20, padding: "4px 11px", fontSize: 11, fontWeight: 700, whiteSpace: "nowrap" }}>{st.label}</span></td>
                      <td style={{ ...S.td, whiteSpace: "nowrap" }}><span style={{ color: ACCENT, fontWeight: 700, fontSize: 12 }}>Open →</span></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

// One order: the money detail + payment history + record-a-payment.
function OrderDetail({ row, clientId, onBack, onChanged, stateOf, nameOf, bldgOf, balOf }) {
  const { o, d } = row;
  const [payOpen, setPayOpen] = useState(false);
  const [amount, setAmount] = useState("");
  const [method, setMethod] = useState("cash");
  const [reference, setReference] = useState("");
  const [when, setWhen] = useState(todayLocal);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [totalDraft, setTotalDraft] = useState(o.total_cents == null ? "" : (o.total_cents / 100).toFixed(2));
  const [editTotal, setEditTotal] = useState(o.total_cents == null);
  const bal = balOf(row); const st = stateOf(row);

  const saveTotal = async () => {
    const cents = centsFrom(totalDraft);
    if (!Number.isFinite(cents) || cents <= 0) { setMsg({ err: "Enter a dollar amount, e.g. 9575.00" }); return; }
    setBusy(true); setMsg(null);
    const { error } = await sb.from("orders")
      .update({ total_cents: cents, total_source: "manual", updated_at: new Date().toISOString() }).eq("id", o.id);
    setBusy(false);
    if (error) { setMsg({ err: error.message }); return; }
    setEditTotal(false); onChanged();
  };

  const recordPayment = async () => {
    const cents = centsFrom(amount);
    if (!Number.isFinite(cents) || cents <= 0) { setMsg({ err: "Enter an amount greater than zero." }); return; }
    setBusy(true); setMsg(null);
    let uid = null;
    try { const { data } = await sb.auth.getUser(); uid = data && data.user ? data.user.id : null; } catch (_e) {}
    const { error } = await sb.from("payments").insert({
      client_id: clientId, order_id: o.id, amount_cents: cents, method,
      reference: reference.trim() || null,
      received_at: new Date(when + "T12:00:00").toISOString(),
      created_by: uid,
    });
    setBusy(false);
    if (error) { setMsg({ err: error.message }); return; }
    setPayOpen(false); setAmount(""); setReference(""); setMethod("cash");
    setMsg({ ok: "Payment recorded." });
    onChanged();
  };

  const voidPayment = async (p) => {
    if (!window.confirm(`Void this ${money(p.amount_cents)} payment? It stays in the history, marked voided.`)) return;
    const { error } = await sb.from("payments")
      .update({ voided_at: new Date().toISOString(), void_reason: "voided in portal" }).eq("id", p.id);
    if (error) { setMsg({ err: error.message }); return; }
    onChanged();
  };

  const unvoidPayment = async (p) => {
    const { error } = await sb.from("payments")
      .update({ voided_at: null, void_reason: null }).eq("id", p.id);
    if (error) { setMsg({ err: error.message }); return; }
    onChanged();
  };

  const kv = (k, v) => (
    <div style={{ display: "flex", justifyContent: "space-between", gap: 10, fontSize: 12.5, padding: "6px 0" }}>
      <span style={{ color: "#64748B" }}>{k}</span><span style={{ fontWeight: 700, textAlign: "right" }}>{v}</span>
    </div>
  );

  return (
    <div>
      <button type="button" onClick={onBack}
        style={{ background: "none", border: "none", color: ACCENT, fontSize: 12.5, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", padding: 0, marginBottom: 12 }}>← All orders</button>
      {msg && msg.err && <div style={S.err}>{msg.err}</div>}
      {msg && msg.ok && <div style={S.okMsg}>{msg.ok}</div>}

      <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1.5fr) minmax(0,1fr)", gap: 14, alignItems: "start" }} className="ss-order-grid">
        <div>
          <div style={S.card}>
            <div style={{ display: "flex", alignItems: "flex-start", gap: 12, marginBottom: 12 }}>
              <div>
                <div style={S.h2}>Order #{o.order_no} · {nameOf(row)}</div>
                <div style={{ fontSize: 12, color: "#64748B", marginTop: 3 }}>
                  Ordered {fmtDate(o.ordered_at)} · {bldgOf(row)}
                  {d && d.ghl_estimate_number ? ` · EST-${d.ghl_estimate_number}` : ""}
                </div>
              </div>
              <span style={{ marginLeft: "auto", background: st.bg, color: st.fg, borderRadius: 20, padding: "4px 12px", fontSize: 11.5, fontWeight: 700, whiteSpace: "nowrap" }}>{st.label}</span>
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {d && d.image_url && <a href={d.image_url} target="_blank" rel="noopener" style={{ ...S.btn("#F1F5F9", "#334155"), border: "1px solid #E2E8F0", textDecoration: "none" }}>View floor plan (PDF)</a>}
              {o.short_code && <a href={`${window.location.origin}/?client=${encodeURIComponent(clientId)}&id=${encodeURIComponent(o.short_code)}`} target="_blank" rel="noopener" style={{ ...S.btn("#F1F5F9", "#334155"), border: "1px solid #E2E8F0", textDecoration: "none" }}>Open design</a>}
            </div>
          </div>

          <div style={S.card}>
            <div style={{ ...S.h2, marginBottom: 8 }}>Payments</div>
            {row.pays.length === 0 && <p style={{ fontSize: 13, color: "#64748B", padding: "6px 0" }}>Nothing recorded yet.</p>}

                <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: "1px solid #F1F5F9", fontSize: 12.5, opacity: dead ? 0.65 : 1 }}>

                    {dead
                      ? <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                      : <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>}
                  </div>
                  <div>
                    <b style={{ textDecoration: dead ? "line-through" : "none" }}>{(PAY_METHODS.find((m) => m[0] === p.method) || [, p.method])[1]}</b>
                    {p.gateway === "ghl" && <span style={{ marginLeft: 6, fontSize: 10, fontWeight: 800, textTransform: "uppercase", letterSpacing: 0.5, background: "#EDE9FE", color: "#5B21B6", borderRadius: 5, padding: "2px 6px" }}>Synergy/GHL</span>}
                    {dead && <span style={{ marginLeft: 6, fontSize: 10, fontWeight: 800, textTransform: "uppercase", letterSpacing: 0.5, background: "#F1F5F9", color: "#64748B", borderRadius: 5, padding: "2px 6px" }}>Voided</span>}
                    <div style={{ fontSize: 11, color: "#94A3B8" }}>{fmtDate(p.received_at)}{p.reference ? ` · ${p.reference}` : ""}{dead ? ` · voided ${fmtDate(p.voided_at)}` : ""}</div>
                  </div>
                  <div style={{ marginLeft: "auto", fontWeight: 800, fontVariantNumeric: "tabular-nums", textDecoration: dead ? "line-through" : "none", color: dead ? "#94A3B8" : "#1E293B" }}>{money(p.amount_cents)}</div>
                  {/* Imported payments are read-only here — GHL owns them, and a local
                      void would silently come back (or diverge) on the next sync. */}
                  {p.gateway
                    ? <span title="Recorded in Synergy/GHL — manage it there" style={{ color: "#CBD5E1", fontSize: 12, fontWeight: 700 }}>—</span>
                    : <button type="button" onClick={() => (dead ? unvoidPayment(p) : voidPayment(p))} title={dead ? "Restore this payment" : "Void this payment"}
                        style={{ background: "none", border: "none", color: "#94A3B8", cursor: "pointer", fontSize: 12, fontWeight: 700, fontFamily: "inherit" }}>{dead ? "Restore" : "Void"}</button>}
                </div>
              );
            })}
          </div>
        </div>

        <div>
          <div style={{ background: "linear-gradient(135deg, #3D3672 0%, #1B7895 100%)", color: "#FFF", borderRadius: 12, padding: "16px 18px", marginBottom: 14 }}>
            <div style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.6, color: "#CFE0EC" }}>{bal != null && bal < 0 ? "Credit owed back" : "Balance due"}</div>
            <div style={{ fontSize: 29, fontWeight: 800, margin: "4px 0 2px", fontVariantNumeric: "tabular-nums", letterSpacing: -0.7 }}>
              {bal == null ? "—" : bal < 0 ? `${money(-bal)} credit` : money(bal)}
            </div>
            <div style={{ fontSize: 11.5, color: "#D6E4F0" }}>
              {o.total_cents == null ? "Set this order's total to track a balance" : `${money(row.paid)} of ${money(o.total_cents)} collected`}
            </div>
            {o.total_cents != null && (
              <button type="button" onClick={() => { setPayOpen(true); setAmount(bal > 0 ? (bal / 100).toFixed(2) : ""); }}
                style={{ ...S.btn("#75E6DA", "#22345B"), marginTop: 13 }}>Record a payment</button>
            )}
          </div>

          <div style={S.card}>
            <div style={{ ...S.h2, marginBottom: 8 }}>Order total</div>
            {editTotal ? (
              <>
                <span style={S.lbl}>Total (from your estimate)</span>
                <input style={S.input} value={totalDraft} onChange={(e) => setTotalDraft(e.target.value)} placeholder="9575.00" />
                <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                  <button onClick={saveTotal} disabled={busy} style={{ ...S.btn(ACCENT, "#FFF"), opacity: busy ? 0.6 : 1 }}>{busy ? "Saving…" : "Save total"}</button>
                  {o.total_cents != null && <button onClick={() => { setEditTotal(false); setTotalDraft((o.total_cents / 100).toFixed(2)); }} style={S.btn("#F1F5F9", "#334155")}>Cancel</button>}
                </div>
                <div style={{ fontSize: 11, color: "#94A3B8", marginTop: 8, lineHeight: 1.5 }}>
                  Totals fill in automatically from the accepted estimate. Type one here if it hasn't come through yet — your number always wins.
                </div>
              </>
            ) : (
              <>
                {kv("Total", money(o.total_cents))}
                {kv("Paid", money(row.paid))}
                {kv("Balance", bal == null ? "—" : money(bal))}
                <div style={{ fontSize: 11, color: "#94A3B8", marginTop: 6 }}>
                  {o.total_source === "ghl" ? "From the accepted estimate" : o.total_source === "manual" ? "Entered by you" : "Not set yet"}
                  {" · "}<button type="button" onClick={() => setEditTotal(true)} style={{ background: "none", border: "none", color: ACCENT, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", fontSize: 11, padding: 0 }}>Edit</button>
                </div>

          <div style={S.card}>
            <div style={{ ...S.h2, marginBottom: 8 }}>Customer</div>
            {kv("Name", nameOf(row))}
            {kv("Phone", (d && d.contact && d.contact.phone) || "—")}

      {payOpen && (

              <div style={{ fontSize: 15.5, fontWeight: 800 }}>Record a payment</div>
              <button type="button" onClick={() => setPayOpen(false)}
                style={{ marginLeft: "auto", background: "rgba(255,255,255,0.16)", border: "none", color: "#FFF", width: 26, height: 26, borderRadius: 7, cursor: "pointer", fontSize: 15, fontFamily: "inherit", lineHeight: 1 }}>×</button>

                <div style={{ display: "flex", gap: 6, marginTop: 7 }}>
                  <button type="button" onClick={() => setAmount((bal / 100).toFixed(2))} style={{ ...S.btn("#F1F5F9", "#334155"), padding: "4px 10px", fontSize: 11, border: "1px solid #E2E8F0" }}>Full balance</button>

                <button onClick={recordPayment} disabled={busy} style={{ ...S.btn("#059669", "#FFF"), flex: 1, opacity: busy ? 0.6 : 1 }}>{busy ? "Saving…" : "Record payment"}</button>
                <button onClick={() => setPayOpen(false)} style={{ ...S.btn("#F1F5F9", "#334155"), border: "1px solid #E2E8F0" }}>Cancel</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


// ─── Inventory tab (migration 075) ───
// One row per PHYSICAL building on a sales lot. The master design behind a unit is a
// designs row with status='inventory' (excluded from Designs/Contacts and from the GHL
// sync). All reads/writes go through portal-settings, so operator view-as works via the
// sb.functions targetClientId injection and writes get the server-side can_write gate.
const invMoney = (cents) => cents == null ? "—" :
  "$" + (cents / 100).toLocaleString(undefined, { minimumFractionDigits: cents % 100 ? 2 : 0, maximumFractionDigits: 2 });
// A unit displays Sold when explicitly marked, OR when any estimate sent from it has been
// accepted (or further) — a sale recorded only in the CRM still flips the row here.
const INV_SOLD_EST = new Set(["accepted", "invoiced", "delivered"]);
const invEffStatus = (u) =>
  (u.status === "sold" || (u.estimates || []).some((e) => INV_SOLD_EST.has(normStatus(e.status)))) ? "sold" : "available";
function InventoryTable({ clientId, refreshKey = 0, isAdmin = false, onOpenDesign = null, onSendEstimate = null, onNew = null }) {
  const [rows, setRows] = useState(null);      // null = loading
  const [locations, setLocations] = useState([]);
  const [error, setError] = useState(null);
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [locFilter, setLocFilter] = useState("all");
  const [expanded, setExpanded] = useState({});  // unit id -> bool
  const [busyId, setBusyId] = useState(null);
  const [msg, setMsg] = useState(null);          // { ok } | { err }

  const load = useCallback(async () => {
    setError(null);
    const { data, error: err } = await sb.functions.invoke("portal-settings", { body: { action: "list_inventory" } });
    if (err || !data || data.error) {
      setError((data && data.error) || (err ? await fnError(err) : "Could not load inventory."));
      setRows([]); return;
    }
    const units = data.units || [];
    setRows(units);
    setLocations(data.locations || []);
    // list_inventory reports each estimate's CACHED designs.status, and nothing else on
    // this tab talks to GHL — so a customer accepting in the CRM would not flip the
    // building to Sold until somebody happened to open the Designs tab. Refresh the
    // linked estimates here and re-derive. Additive: any failure just leaves the cache.
    const codes = units.flatMap((u) => (u.estimates || []).map((e) => e.shortCode)).filter(Boolean);
    if (codes.length) {
      try {
        const { data: sync } = await sb.functions.invoke("sync-design-status", { body: { shortCodes: codes } });
        const statuses = sync && sync.statuses;
        if (statuses) {
          setRows(units.map((u) => ({
            ...u,
            estimates: (u.estimates || []).map((e) => statuses[e.shortCode] ? { ...e, status: statuses[e.shortCode] } : e),
          })));
        }
      } catch (_e) { /* cached statuses stand */ }
    }
  }, [clientId]);
  useEffect(() => { load(); }, [load, refreshKey]);

  const counts = (rows || []).reduce((a, u) => { const k = invEffStatus(u); a[k] = (a[k] || 0) + 1; return a; }, {});
  const filtered = (rows || []).filter((u) => {
    if (statusFilter !== "all" && invEffStatus(u) !== statusFilter) return false;
    if (locFilter !== "all" && String(u.locationId || "") !== locFilter) return false;
    const q = query.trim().toLowerCase();
    if (!q) return true;
    const hay = ["#" + u.serial, String(u.serial), titleCase(u.style || ""), u.size || "", u.locationName || "",
      ...(u.estimates || []).map((e) => (e.name || "") + " " + (e.estimateNumber ? "EST-" + e.estimateNumber : ""))].join(" ").toLowerCase();
    return hay.includes(q);
  });

  const invoke = async (body, okMsg) => {
    const { data, error: err } = await sb.functions.invoke("portal-settings", { body });
    if (err || !data || data.error) {
      setMsg({ err: (data && data.error) || (err ? await fnError(err) : "That didn't save.") });
      return false;
    }
    if (okMsg) setMsg({ ok: okMsg });
    return data;
  };
  const markStatus = async (u, to) => {
    setBusyId(u.id); setMsg(null);
    await invoke({ action: "update_inventory", unitId: u.id, status: to },
      to === "sold" ? `#${u.serial} marked sold.` : `#${u.serial} is available again.`);
    setBusyId(null); load();
  };
  const del = async (u) => {
    if (!window.confirm(`Delete building #${u.serial}? Its floor plan and version history are removed. Estimates already sent to customers are kept (they just lose the Inventory label).`)) return;
    setBusyId(u.id); setMsg(null);
    // ONE call: delete_inventory removes the unit AND its master design (row, versions,
    // PDFs) server-side. Two calls meant a failed/abandoned second request stranded an
    // invisible orphan master that no screen could ever list or clean up.
    const r = await invoke({ action: "delete_inventory", unitId: u.id });
    if (r) {
      setMsg(r.masterDeleted === false
        ? { err: `Building #${u.serial} was removed from inventory, but its saved floor plan could not be deleted — support has been notified.` }
        : { ok: `Building #${u.serial} deleted.` });
    }
    setBusyId(null); load();
  };

  const chip = (k, label, n, on) => (
    <button key={k} type="button" aria-pressed={on} onClick={() => setStatusFilter(k)}
      style={{ display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontFamily: "inherit",
        fontSize: 12, fontWeight: 700, borderRadius: 16, padding: "5px 12px",
        background: on ? "#1E293B" : "#FFF", color: on ? "#FFF" : "#475569",
        border: `1px solid ${on ? "#1E293B" : "#E2E8F0"}` }}>
      {label}<span style={{ fontSize: 10.5, opacity: 0.75 }}>{n}</span>
    </button>
  );
  const total = (rows || []).length;
  const tag = { background: "#DBEAFF", color: "#3D3672", borderRadius: 12, fontSize: 10.5, fontWeight: 800, padding: "2px 9px", whiteSpace: "nowrap" };

  return (
    <div style={S.card}>
      <CardHead title="Inventory" count={total}
        right={<>
          <button type="button" onClick={load} style={S.btn("#F1F5F9", "#334155")}>↻ Refresh</button>

        {chip("all", "All", total, statusFilter === "all")}
        {(counts.available || 0) > 0 && chip("available", "Available", counts.available, statusFilter === "available")}
        {(counts.sold || 0) > 0 && chip("sold", "Sold", counts.sold, statusFilter === "sold")}
        {locations.length > 0 && (
          <select value={locFilter} onChange={(e) => setLocFilter(e.target.value)}
            style={{ marginLeft: "auto", fontSize: 12, fontWeight: 700, color: "#334155", border: "1px solid #E2E8F0", background: "#FFF", borderRadius: 9, padding: "6px 10px" }}>
            <option value="all">📍 All locations</option>
            {locations.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}
          </select>
        )}
      </div>
      {msg && msg.ok && <div style={{ background: "#F0FDF4", border: "1px solid #BBF7D0", color: "#15803D", borderRadius: 8, padding: "8px 12px", fontSize: 13, fontWeight: 600, marginBottom: 10 }}>{msg.ok}</div>}
      {msg && msg.err && <div style={{ ...S.err, marginBottom: 10 }}>{msg.err}</div>}
      {error && <div style={S.err}>{error}</div>}
      {rows === null && <p style={{ fontSize: 13, color: "#64748B", padding: 12 }}>Loading…</p>}
      {rows && rows.length === 0 && !error && (
        <p style={{ fontSize: 13, color: "#64748B", padding: 12 }}>
          Nothing on the lot yet. Design a building in the <strong>Designer</strong> tab and click <strong>Save to Inventory</strong> — it takes the next serial number automatically.
        </p>
      )}
      {rows && rows.length > 0 && filtered.length === 0 && (
        <p style={{ fontSize: 13, color: "#64748B", padding: 12 }}>No buildings match{query ? <> “{query}”</> : null}.</p>
      )}

        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr>
              {["Serial #", "Building", "Location", "Asking price", "Estimates", "Added", "Status", "Actions"].map((h) => (
                <th key={h} style={S.th}>{h}</th>
              ))}

            <tbody>
              {filtered.map((u) => {
                const st = invEffStatus(u);
                const ests = u.estimates || [];

                    <tr>
                      <td style={{ ...S.td, fontWeight: 800, fontVariantNumeric: "tabular-nums" }}>#{u.serial}</td>
                      <td style={S.td}><strong>{[titleCase(u.style || ""), u.size].filter(Boolean).join(" ") || "—"}</strong></td>
                      <td style={S.td}>{u.locationName ? <>{u.locationName}{u.locationCity ? <span style={{ color: "#94A3B8" }}> · {u.locationCity}</span> : null}</> : <span style={{ color: "#94A3B8" }}>—</span>}</td>
                      <td style={S.td}><strong>{invMoney(u.askingPriceCents)}</strong></td>
                      <td style={S.td}>
                        {ests.length === 0 ? <span style={{ color: "#94A3B8" }}>—</span> : (
                          <button type="button" onClick={() => setExpanded((x) => ({ ...x, [u.id]: !x[u.id] }))}
                            style={{ background: "none", border: "none", padding: 0, cursor: "pointer", fontFamily: "inherit", fontSize: "inherit", color: ACCENT, fontWeight: 700 }}>
                            {ests.length} {ests.length === 1 ? "estimate" : "estimates"} {isOpen ? "▾" : "▸"}
                          </button>
                        )}
                      </td>
                      <td style={{ ...S.td, whiteSpace: "nowrap", color: "#64748B" }}>{fmtDate(u.createdAt)}</td>
                      <td style={S.td}>
                        <span style={{ background: st === "sold" ? "#EEF2FF" : "#F0FDF4", color: st === "sold" ? "#3D3672" : "#15803D", borderRadius: 20, padding: "4px 12px", fontSize: 12, fontWeight: 700, whiteSpace: "nowrap" }}>
                          {st === "sold" ? "Sold" : "Available"}
                        </span>
                      </td>
                      <td style={{ ...S.td, whiteSpace: "nowrap" }}>
                        <button type="button" disabled={busyId === u.id}
                          onClick={() => onOpenDesign && onOpenDesign(u.shortCode, null, { unit: { unitId: u.id, askingPriceCents: u.askingPriceCents, locationId: u.locationId } })}
                          style={{ background: "none", border: "none", padding: 0, cursor: "pointer", fontFamily: "inherit", fontSize: "inherit", color: ACCENT, fontWeight: 700, marginRight: 10 }}>Open</button>
                        {st !== "sold" && (
                          <button type="button" disabled={busyId === u.id}
                            onClick={() => onSendEstimate && onSendEstimate(u)}
                            style={{ background: "none", border: "none", padding: 0, cursor: "pointer", fontFamily: "inherit", fontSize: "inherit", color: ACCENT, fontWeight: 700, marginRight: 10 }}>Send estimate</button>
                        )}
                        {u.imageUrl && ssSafeUrl(u.imageUrl) && <a href={u.imageUrl} target="_blank" rel="noopener" style={{ color: "#334155", fontWeight: 700, textDecoration: "none", marginRight: 10 }}>PDF</a>}
                        {isAdmin && (u.status === "sold"
                          ? <button type="button" disabled={busyId === u.id} onClick={() => markStatus(u, "available")}
                              style={{ background: "none", border: "none", padding: 0, cursor: "pointer", fontFamily: "inherit", fontSize: "inherit", color: "#64748B", fontWeight: 700, marginRight: 10 }}>Mark available</button>
                          : (st !== "sold" && <button type="button" disabled={busyId === u.id} onClick={() => markStatus(u, "sold")}
                              style={{ background: "none", border: "none", padding: 0, cursor: "pointer", fontFamily: "inherit", fontSize: "inherit", color: "#64748B", fontWeight: 700, marginRight: 10 }}>Mark sold</button>))}
                        {isAdmin && <button type="button" disabled={busyId === u.id} onClick={() => del(u)}

                      </td>
                    </tr>
                    {isOpen && ests.length > 0 && (
                      <tr><td colSpan={8} style={{ padding: "2px 8px 12px" }}>
                        <div style={{ background: "#F8FAFC", border: "1px solid #EDF1F6", borderRadius: 10, padding: "12px 14px" }}>
                          <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 0.5, color: "#94A3B8", textTransform: "uppercase", marginBottom: 9 }}>
                            Estimates on building #{u.serial}
                          </div>
                          {ests.map((e) => {
                            const es = normStatus(e.status);
                            const c = STATUS_COLORS[es] || STATUS_COLORS.sent;
                            const isWinner = winner && winner.shortCode === e.shortCode;
                            return (
                              <div key={e.shortCode} style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 0", fontSize: 13, flexWrap: "wrap" }}>
                                <span style={tag}>Inventory</span>
                                <strong>{e.name || "—"}</strong>
                                <span style={{ color: "#94A3B8", fontSize: 12 }}>{e.estimateNumber ? `EST-${e.estimateNumber} · ` : ""}{fmtDate(e.createdAt)}</span>
                                <span style={{ background: c.bg, color: c.fg, borderRadius: 14, padding: "2.5px 10px", fontSize: 11, fontWeight: 700 }}>
                                  {STATUS_LABELS[es]}{isWinner && st === "sold" ? " — buyer" : ""}
                                </span>
                                {st === "sold" && !isWinner && !INV_SOLD_EST.has(es) && (
                                  <span style={{ background: "#FEF3C7", color: "#92400E", borderRadius: 12, fontSize: 11, fontWeight: 700, padding: "3px 10px" }}>⚠ Building sold — offer a new build?</span>
                                )}
                                <button type="button" onClick={() => onOpenDesign && onOpenDesign(e.shortCode, null, null)}
                                  style={{ marginLeft: "auto", background: "none", border: "none", padding: 0, cursor: "pointer", fontFamily: "inherit", fontSize: "inherit", color: ACCENT, fontWeight: 700 }}>Open</button>
                              </div>
                            );
                          })}
                        </div>
                      </td></tr>
                    )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ─── Sales locations + building serial numbers (Settings → Team) ───
// Locations are where inventory buildings sit on display; the serial block sets the ONE
// shared per-builder sequence (inventory now, orders when Build Scheduling ships).
function LocationsCard() {
  const [locs, setLocs] = useState(null);        // null = loading
  const [nextSerial, setNextSerial] = useState("");
  const [form, setForm] = useState(null);        // { id?, name, street, city, state, zip } | null
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const load = useCallback(async () => {
    const { data, error } = await sb.functions.invoke("portal-settings", { body: { action: "list_locations" } });
    if (error || !data || data.error) { setMsg({ err: (data && data.error) || "Could not load locations." }); setLocs([]); return; }
    setLocs(data.locations || []);
    setNextSerial(data.nextSerial == null ? "" : String(data.nextSerial));
  }, []);
  useEffect(() => { load(); }, [load]);
  const saveLoc = async () => {
    if (!form || !String(form.name || "").trim()) { setMsg({ err: "Give the location a name." }); return; }
    setBusy(true); setMsg(null);
    const { data, error } = await sb.functions.invoke("portal-settings", { body: { action: "save_location", ...form } });
    setBusy(false);
    if (error || !data || data.error) { setMsg({ err: (data && data.error) || "Save failed." }); return; }
    setForm(null); setMsg({ ok: "Location saved." }); load();
  };
  const delLoc = async (l) => {
    if (!window.confirm(`Remove "${l.name}"? Buildings sitting there keep existing — they'll just show no location.`)) return;
    setBusy(true); setMsg(null);
    const { data, error } = await sb.functions.invoke("portal-settings", { body: { action: "delete_location", id: l.id } });
    setBusy(false);
    if (error || !data || data.error) { setMsg({ err: (data && data.error) || "Delete failed." }); return; }
    load();
  };
  const saveSerial = async () => {
    setBusy(true); setMsg(null);
    const { data, error } = await sb.functions.invoke("portal-settings", { body: { action: "save_serial_start", nextSerial: Number(nextSerial) } });
    setBusy(false);
    if (error || !data || data.error) { setMsg({ err: (data && data.error) || "Save failed." }); return; }
    setMsg({ ok: `Next building will be #${data.nextSerial}.` });
  };
  const F = form || {};
  return (
    <div style={S.card}>
      <div style={S.h2}>Sales Locations</div>
      <div style={{ fontSize: 12.5, color: "#64748B", marginBottom: 12, lineHeight: 1.5 }}>
        The lots where your buildings sit on display. Every inventory building is tracked to one of these.
      </div>
      {msg && msg.ok && <div style={{ background: "#F0FDF4", border: "1px solid #BBF7D0", color: "#15803D", borderRadius: 8, padding: "8px 12px", fontSize: 13, fontWeight: 600, marginBottom: 10 }}>{msg.ok}</div>}
      {msg && msg.err && <div style={{ ...S.err, marginBottom: 10 }}>{msg.err}</div>}
      {locs === null && <p style={{ fontSize: 13, color: "#64748B" }}>Loading…</p>}
      {locs && locs.length === 0 && <p style={{ fontSize: 13, color: "#64748B" }}>No locations yet — add your first lot below.</p>}
      {(locs || []).map((l) => (
        <div key={l.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 2px", borderBottom: "1px solid #F1F5F9", fontSize: 13, flexWrap: "wrap" }}>
          <strong style={{ minWidth: 140 }}>{l.name}</strong>
          <span style={{ color: "#64748B", flex: 1, minWidth: 200 }}>{[l.street, l.city, l.state, l.zip].filter(Boolean).join(", ") || "No address"}</span>
          <span style={{ background: "#F1F5F9", color: "#475569", borderRadius: 12, fontSize: 11, fontWeight: 700, padding: "2px 9px" }}>{l.buildings} {l.buildings === 1 ? "building" : "buildings"}</span>
          <button type="button" onClick={() => { setForm({ id: l.id, name: l.name, street: l.street || "", city: l.city || "", state: l.state || "", zip: l.zip || "" }); }} disabled={busy}
            style={{ background: "none", border: "none", padding: 0, cursor: "pointer", fontFamily: "inherit", fontSize: "inherit", color: ACCENT, fontWeight: 700 }}>Edit</button>
          <button type="button" onClick={() => delLoc(l)} disabled={busy}
            style={{ background: "none", border: "none", padding: 0, cursor: "pointer", fontFamily: "inherit", fontSize: "inherit", color: "#94A3B8", fontWeight: 700 }}>Remove</button>
        </div>
      ))}
      {form ? (
        <div style={{ background: "#F8FAFC", border: "1px dashed #CBD5E1", borderRadius: 10, padding: "13px 14px", marginTop: 12 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 10, marginBottom: 10 }}>
            <div><span style={S.lbl}>Location name</span><input style={S.input} value={F.name} onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))} placeholder="e.g. Hwy 65 Display" /></div>
            <div><span style={S.lbl}>Street</span><input style={S.input} value={F.street} onChange={(e) => setForm((f) => ({ ...f, street: e.target.value }))} /></div>
            <div><span style={S.lbl}>City</span><input style={S.input} value={F.city} onChange={(e) => setForm((f) => ({ ...f, city: e.target.value }))} /></div>
            <div><span style={S.lbl}>State</span><input style={S.input} value={F.state} onChange={(e) => setForm((f) => ({ ...f, state: e.target.value }))} /></div>
            <div><span style={S.lbl}>Zip</span><input style={S.input} value={F.zip} onChange={(e) => setForm((f) => ({ ...f, zip: e.target.value.replace(/\D/g, "").slice(0, 5) }))} /></div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button type="button" onClick={saveLoc} disabled={busy} style={S.btn(ACCENT, "#FFF")}>{busy ? "Saving…" : (F.id ? "Save location" : "+ Add location")}</button>
            <button type="button" onClick={() => setForm(null)} disabled={busy} style={S.btn("#F1F5F9", "#334155")}>Cancel</button>
          </div>
        </div>
      ) : (
        <div style={{ marginTop: 12 }}>
          <button type="button" onClick={() => setForm({ name: "", street: "", city: "", state: "", zip: "" })} style={S.btn(ACCENT, "#FFF")}>+ Add location</button>
        </div>
      )}
      <div style={{ borderTop: "1px solid #EDF1F6", margin: "18px 0 14px" }}></div>
      <div style={S.h2}>Building Serial Numbers</div>
      <div style={{ fontSize: 12.5, color: "#64748B", marginBottom: 12, lineHeight: 1.5 }}>
        Every inventory building — and, once Orders ships, every customer order — takes the next number
        in one shared sequence, in the order they're created.
      </div>
      <div style={{ display: "flex", alignItems: "flex-end", gap: 12, flexWrap: "wrap" }}>
        <div>
          <span style={S.lbl}>Next serial #</span>
          <input style={{ ...S.input, fontSize: 18, fontWeight: 800, width: 140, fontVariantNumeric: "tabular-nums" }}
            value={nextSerial} inputMode="numeric"
            onChange={(e) => setNextSerial(e.target.value.replace(/\D/g, "").slice(0, 9))} />
        </div>
        <button type="button" onClick={saveSerial} disabled={busy || !nextSerial} style={S.btn(ACCENT, "#FFF")}>Save</button>
        <span style={{ fontSize: 12, color: "#94A3B8", maxWidth: 420, lineHeight: 1.5 }}>
          Set this once to match your shop's count: if your last build was <strong>#12046</strong>, enter <strong>12047</strong>.
          It advances on its own and can never go backwards past a used number.
        </span>
      </div>
      <div style={{ background: "#EFF6FF", border: "1px solid #BFDBFE", color: "#1E3A8A", borderRadius: 10, padding: "10px 14px", fontSize: 12.5, fontWeight: 600, marginTop: 14, lineHeight: 1.5 }}>
        📍 Assigning team members to locations arrives with Build &amp; Delivery Scheduling — the location list you build here is what it will use.
      </div>
    </div>
  );
}

// ─── In-portal Designer tab ───
// Mounts the shared designer module (structure-studio.component.js, loaded before this
// block) with `embedded` chrome-suppression/gate-bypass and the tenant passed as a prop
// — the loader then skips URL parsing entirely and can never hit its bare-root

function DesignerTab({ clientId, onSaved, openDesign = null }) {

  if (!SS) {
    return <div style={{ padding: 40, textAlign: "center", color: "#64748B", fontSize: 14 }}>The designer failed to load — refresh the page. (structure-studio.component.js must be served alongside portal.html.)</div>;
  }

}

// ─── Operator Accounts tab ───
// Lists every tenant (operator-portal:list_clients, server-side app_operators gate)
// and opens one with FULL access, GHL-subaccounts style. Every list/view is audit-logged,
// and every cross-tenant read/write is re-authorized server-side against app_operators.
function AccountsTab({ viewing, onOpen, onEditUser, usersRefreshKey = 0 }) {
  const [clients, setClients] = useState(null); // null = loading
  const [error, setError] = useState(null);
  const [query, setQuery] = useState("");
  // Users are fetched PER TENANT, only when a row is expanded — opening the tab must not pull
  // every user's name, email and phone into the browser, and each expansion is audit-logged
  // against the tenant it belongs to. `users[clientId] === undefined` means "not loaded yet".
  const [open, setOpen] = useState({});
  const [users, setUsers] = useState({});
  const [userErr, setUserErr] = useState({});

  // In-flight guard. Expand-all fires one request per tenant at once, and a second click
  // (or a refresh landing mid-expand) would otherwise duplicate every one of them.
  const inFlight = useRef({});

  // Per-user reset state, keyed by userId. Kept per-user rather than as one shared flag so
  // resetting person A doesn't grey out the button next to person B.
  const [resetBusy, setResetBusy] = useState({});
  const [resetInfo, setResetInfo] = useState({});

  const sendReset = async (clientId, u) => {
    if (resetBusy[u.userId]) return;
    setResetBusy((b) => ({ ...b, [u.userId]: true }));
    setResetInfo((r) => ({ ...r, [u.userId]: null }));
    try {
      const { data, error: err } = await sb.functions.invoke("operator-portal", {
        body: { action: "send_reset_link", clientId, userId: u.userId },
      });
      if (err) {
        let msg = err.message;
        try { const ctx = await err.context.json(); if (ctx && ctx.error) msg = ctx.error; } catch (_e) {}
        setResetInfo((r) => ({ ...r, [u.userId]: { error: msg || "Could not send the reset link." } }));
        return;
      }
      setResetInfo((r) => ({ ...r, [u.userId]: data || {} }));
    } finally {
      setResetBusy((b) => { const n = { ...b }; delete n[u.userId]; return n; });
    }
  };

  const loadUsers = useCallback(async (clientId) => {
    if (inFlight.current[clientId]) return;
    inFlight.current[clientId] = true;
    setUserErr((e) => ({ ...e, [clientId]: null }));
    try {
      const { data, error: err } = await sb.functions.invoke("operator-portal", { body: { action: "list_users", clientId } });
      if (err) {
        let msg = err.message;
        try { const ctx = await err.context.json(); if (ctx && ctx.error) msg = ctx.error; } catch (_e) {}
        setUserErr((e) => ({ ...e, [clientId]: msg || "Could not load users." }));
        setUsers((u) => ({ ...u, [clientId]: [] }));
        return;
      }
      setUsers((u) => ({ ...u, [clientId]: Array.isArray(data && data.users) ? data.users : [] }));
    } finally {
      // Always released, including on the error path — otherwise one failure would leave
      // that tenant permanently unrefreshable for the rest of the session.
      delete inFlight.current[clientId];
    }
  }, []);

  const toggle = (clientId) => {
    const next = !open[clientId];
    setOpen((o) => ({ ...o, [clientId]: next }));
    if (next && users[clientId] === undefined) loadUsers(clientId);
  };

  const q = query.trim().toLowerCase();
  const filtered = (clients || []).filter((c) => !q || c.clientId.toLowerCase().includes(q) || (c.companyName || "").toLowerCase().includes(q));

  // Expand/collapse acts on what is CURRENTLY FILTERED, not the whole list — after a search
  // for "barns", "Expand all" that also opened every hidden tenant would be a surprise (and
  // would fetch personal details for accounts you are not looking at).
  const expandAll = () => {
    setOpen((o) => {
      const next = { ...o };
      filtered.forEach((c) => { next[c.clientId] = true; });
      return next;
    });
    filtered.forEach((c) => { if (users[c.clientId] === undefined) loadUsers(c.clientId); });
  };
  const collapseAll = () => setOpen({});
  const openCount = filtered.filter((c) => open[c.clientId]).length;

  // After an edit, re-fetch only the tenants currently expanded — the edited name has to
  // appear without collapsing what the operator was looking at.
  useEffect(() => {
    if (!usersRefreshKey) return;
    Object.keys(open).filter((k) => open[k]).forEach((k) => loadUsers(k));
  }, [usersRefreshKey]);

  const roleChip = (r) => ({
    fontSize: 9.5, fontWeight: 800, textTransform: "uppercase", borderRadius: 5, padding: "1px 5px",
    color: r === "owner" ? "#065F46" : r === "admin" ? "#1E40AF" : "#475569",
    background: r === "owner" ? "#D1FAE5" : r === "admin" ? "#DBEAFE" : "#F1F5F9",
    border: `1px solid ${r === "owner" ? "#6EE7B7" : r === "admin" ? "#93C5FD" : "#E2E8F0"}`,
  });

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const { data, error: err } = await sb.functions.invoke("operator-portal", { body: { action: "list_clients" } });
      if (cancelled) return;
      if (err) {
        let msg = err.message;
        try { const ctx = await err.context.json(); if (ctx && ctx.error) msg = ctx.error; } catch (_e) {}
        setError(msg || "Could not load accounts."); setClients([]); return;
      }
      // Null-guard the body: a 200 with no/unexpected payload must show an error, not
      // leave the tab spinning on clients === null forever.
      if (!data || !Array.isArray(data.clients)) {
        setError("Synergy returned no account list — reload to try again."); setClients([]); return;
      }
      setClients(data.clients);
    })();
    return () => { cancelled = true; };
  }, []);


  return (
    <div style={S.card}>
      <CardHead
        title="Builder accounts"
        count={clients ? (query ? `${filtered.length} of ${clients.length}` : clients.length) : null}
        desc="Open any builder's portal and work in it as they would — designs, contacts, structures, options, colours, branding, connection and billing. Changes are LIVE in their account and every action is audit-logged. Design status badges show cached values."
        right={<>
          {/* Acts on the filtered set, and each is disabled when it would do nothing — so the
              control tells you the current state instead of being a pair of dead buttons. */}
          <button type="button" onClick={expandAll} disabled={!filtered.length || openCount === filtered.length}
            title="Show the users under every account listed"
            style={{ ...S.btn("#F1F5F9", openCount === filtered.length || !filtered.length ? "#CBD5E1" : "#334155"), padding: "7px 11px", fontSize: 12 }}>
            Expand all
          </button>

                                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 6 }}>

                                  <div style={{ fontSize: 11, color: "#94A3B8", marginTop: 5 }}>

                          </tr>

}

// ─── Dashboard shell ───
// ═══ Operator Admin console (native) ═════════════════════════════════════════
// Ported out of admin.html's iframe on 2026-07-30. Carolyn, 2026-07-29: "can't we just
// bring admin in here instead of iframing it?" / "What I would rather do is like I did
// for settings."
//
// Three things about this port are load-bearing:
//
// 1. It is built from PORTAL's primitives (S, CardHead, SearchInput, PasswordInput), not
//    admin.html's. admin.html declares its own `S`, `ACCENT`, `PasswordInput` and CSV
//    helpers at top level; pasting those in would throw "Identifier 'S' has already been
//    declared", which kills this entire script — not just the Admin tab. So they are not
//    ported at all, and the reuse is also what makes Admin *look* like Settings.
// 2. There is NO password login. A JWT operator is authorized by app_operators membership
//    (_shared/adminAuth.ts). The password survives only as step-up on the three actions
//    whose blast radius is bigger than one tenant.
// 3. The client being administered is deliberately NOT the portal's `viewing` tenant.
//    admin-catalog takes clientId straight from the body with no session cross-check, so
//    binding them would let "open Junior Barns to look at a design" silently re-aim the
//    delete-client confirm. They stay separate, and the chosen client is on screen in the
//    banner next to every destructive control.

// Port of admin.html's api(). Kept (rather than using an inline invoke) for the
// error.context unwrap: supabase-js reports every non-2xx as the opaque "Edge Function
// returned a non-2xx status code", and the real {error} body is only on the raw Response.
// The .clone() matters — the body can only be read once.
async function adminApi(action, body, adminPassword) {
  const { data, error } = await sb.functions.invoke("admin-catalog", {
    body: { action, ...(adminPassword ? { adminPassword } : {}), ...(body || {}) },
    // Only step-up calls opt out of the session-expiry intercept — those are the ones where a
    // 401 means "wrong operator password", not "dead JWT" (see SS_NO_EXPIRY_HEADER). An adminApi
    // call WITHOUT a password still 401s only on a real expiry, so it must keep the guard.
    ...(adminPassword ? { headers: { [SS_NO_EXPIRY_HEADER]: "1" } } : {}),
  });
  if (error) {
    let msg = error.message || "request failed";
    let status = 0;
    try {
      const ctx = error.context;
      if (ctx) {
        status = ctx.status || 0;
        if (typeof ctx.json === "function") {
          const b = await (typeof ctx.clone === "function" ? ctx.clone() : ctx).json();
          if (b && b.error) msg = b.error;
        }
      }
    } catch (_) { /* fall back to the generic message */ }
    const e = new Error(msg);
    e.status = status;
    throw e;
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

function slugify(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40); }

function DoorIcon({ double = false }) {
  return (
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="1.5" />
      {double && <line x1="12" y1="3" x2="12" y2="21" />}
      <circle cx={double ? 10.2 : 16.5} cy="12" r="0.9" fill="currentColor" stroke="none" />
      {double && <circle cx="13.8" cy="12" r="0.9" fill="currentColor" stroke="none" />}
    </svg>
  );
}

// A tiny glyph per layout-item kind, so a 40-pill grid is scannable by shape as well as
// by label. Falls back to a dot for anything unrecognised — a new master item must never
// render as a blank.
function layoutItemGlyph(it) {
  const k = String((it && (it.item_key || it.key)) || "").toLowerCase();
  if (k.indexOf("double") !== -1 && k.indexOf("door") !== -1) return <DoorIcon double />;
  if (k.indexOf("door") !== -1) return <DoorIcon />;
  if (k.indexOf("window") !== -1) {
    return (<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1.5" /><line x1="12" y1="4" x2="12" y2="20" /><line x1="3" y1="12" x2="21" y2="12" /></svg>);
  }
  if (k.indexOf("ramp") !== -1) {
    return (<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3 19h18L3 9z" /></svg>);
  }
  if (k.indexOf("loft") !== -1 || k.indexOf("shelf") !== -1) {
    return (<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" aria-hidden="true"><line x1="3" y1="8" x2="21" y2="8" /><line x1="3" y1="15" x2="21" y2="15" /><line x1="6" y1="8" x2="6" y2="15" /><line x1="18" y1="8" x2="18" y2="15" /></svg>);
  }
  return (<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true"><circle cx="12" cy="12" r="4" /></svg>);
}

// Portal's chip vocabulary (CardHead's count chip, S.card hairlines) rather than
// admin.html's 2px-ACCENT-border pills, which read as buttons rather than state.
function AdmChip({ tone = "neutral", children, title }) {
  const T = {
    on:      { background: "#DBEAFF", color: "#3D3672", border: "1px solid #C3D9F7" },
    good:    { background: "#DCFCE7", color: "#15803D", border: "1px solid #86EFAC" },
    warn:    { background: "#FEF3C7", color: "#92400E", border: "1px solid #FCD34D" },
    danger:  { background: "#FEE2E2", color: "#991B1B", border: "1px solid #FCA5A5" },
    neutral: { background: "#F1F5F9", color: "#64748B", border: "1px solid #E2E8F0" },
  }[tone] || {};
  return <span title={title} style={{ ...T, fontSize: 11, fontWeight: 800, borderRadius: 6, padding: "2px 7px", whiteSpace: "nowrap" }}>{children}</span>;
}

const ADM_ROW = { display: "flex", alignItems: "center", gap: 10, padding: "9px 2px", borderBottom: "1px solid #F1F5F9" };

// Initials tile, same construction as the Accounts tab's — an operator recognises tenants
// by the same mark in both places.
function AdmTile({ name, size = 34 }) {
  return (
    <div style={{ width: size, height: size, borderRadius: Math.round(size / 4), background: "#F1F5F9", display: "flex", alignItems: "center", justifyContent: "center", fontSize: size <= 30 ? 11 : 12, fontWeight: 800, color: "#475569", flexShrink: 0 }}>
      {String(name || "?").split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase()}
    </div>
  );
}

// Which features a discount covers. HOISTED to module scope on purpose: in admin.html this
// was declared inside AdminApp, making it a new component type on every render — its inputs
// remount (and would lose focus) the moment anyone gives it local state.
function FeatureScope({ features, all, setAll, picked, setPicked, disabled }) {
  return (
    <div style={{ marginTop: 8, opacity: disabled ? 0.5 : 1, pointerEvents: disabled ? "none" : "auto" }}>
      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", fontSize: 13, color: "#1E293B" }}>
        <label style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
          <input type="radio" checked={all} onChange={() => setAll(true)} />
          <span>Every feature</span>
        </label>
        <label style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
          <input type="radio" checked={!all} onChange={() => setAll(false)} />
          <span>Only the ones I pick</span>
        </label>
      </div>
      {!all && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: "6px 16px", marginTop: 8, paddingLeft: 2 }}>
          {features.length === 0 && <span style={{ fontSize: 12, color: "#B91C1C" }}>No billable features found.</span>}
          {features.map((f) => (
            <label key={f.feature} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: "#334155", cursor: "pointer" }}>
              <input type="checkbox" checked={picked.indexOf(f.feature) !== -1}
                onChange={(e) => setPicked(e.target.checked ? picked.concat([f.feature]) : picked.filter((x) => x !== f.feature))} />
              <span>{f.name}{f.required ? " (required)" : ""}{f.availability === "coming_soon" ? " — soon" : ""}</span>
            </label>
          ))}
        </div>
      )}
      {!all && picked.length === 0 && (
        <div style={{ fontSize: 11.5, color: "#B91C1C", marginTop: 6 }}>
          Pick at least one feature, or choose "Every feature" — an empty list means no discount applies anywhere.
        </div>
      )}
    </div>
  );
}

// ── Dialogs ──────────────────────────────────────────────────────────────────
// Same overlay shape as ProfileDialog and PricingCsv's modals; position:fixed is safe from
// this depth because no ancestor sets transform/filter/contain.
function AdmOverlay({ onClose, maxWidth = 520, labelledBy, children }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <div onClick={onClose} role="presentation"
      style={{ position: "fixed", inset: 0, background: "rgba(15,23,42,0.5)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 1000 }}>
      <div role="dialog" aria-modal="true" aria-labelledby={labelledBy} onClick={(e) => e.stopPropagation()}
        style={{ background: "#FFF", borderRadius: 12, padding: 22, maxWidth, width: "100%", boxShadow: "0 20px 50px rgba(0,0,0,0.25)" }}>
        {children}
      </div>
    </div>
  );
}

function AdmClientPicker({ clients, current, onPick, onClose }) {
  const [q, setQ] = useState("");
  const [hi, setHi] = useState(0);
  const term = q.trim().toLowerCase();
  const list = (clients || []).filter((c) => !term
    || String(c.company_name || "").toLowerCase().indexOf(term) !== -1
    || String(c.client_id || "").toLowerCase().indexOf(term) !== -1);
  useEffect(() => { setHi(0); }, [q]);
  const onKey = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setHi((i) => Math.min(i + 1, list.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setHi((i) => Math.max(i - 1, 0)); }
    else if (e.key === "Enter" && list[hi]) { e.preventDefault(); onPick(list[hi].client_id); }
  };
  return (
    <AdmOverlay onClose={onClose} labelledBy="adm-picker-ttl">
      <div id="adm-picker-ttl" style={{ fontSize: 17, fontWeight: 800, color: "#1E293B", marginBottom: 4 }}>Choose a builder</div>
      <div style={{ fontSize: 12.5, color: "#64748B", marginBottom: 14 }}>Everything on the builder-scoped tabs is about whoever is selected here.</div>
      <div onKeyDown={onKey}>
        <SearchInput value={q} onChange={setQ} placeholder="Search builders…" />
      </div>
      <div style={{ maxHeight: 380, overflowY: "auto", margin: "0 -4px" }}>
        {list.length === 0 && (
          <div style={{ fontSize: 13, color: "#94A3B8", padding: "14px 6px" }}>
            {term ? `No builders match “${q}”.` : "No builders yet."}
          </div>
        )}
        {list.map((c, i) => (
          <button key={c.client_id} type="button" onMouseEnter={() => setHi(i)} onClick={() => onPick(c.client_id)}
            style={{ ...ADM_ROW, width: "100%", textAlign: "left", font: "inherit", cursor: "pointer", border: "none",
              borderBottom: "1px solid #F1F5F9", background: i === hi ? "#F8FAFC" : "transparent", padding: "9px 6px" }}>
            <AdmTile name={c.company_name || c.client_id} />
            <div style={{ minWidth: 0, flex: 1 }}>
              <div style={{ fontSize: 13.5, fontWeight: 700, color: "#1E293B" }}>{c.company_name || c.client_id}</div>
              <div style={{ fontSize: 11.5, color: "#94A3B8" }}>{c.client_id}</div>
            </div>
            {c.client_id === current && <AdmChip tone="on">Current</AdmChip>}
            {c.billingExempt ? <AdmChip tone="good" title="Not billed">Comped</AdmChip>
              : c.discountPercent > 0 ? <AdmChip tone="on" title="Account discount">−{c.discountPercent}%</AdmChip> : null}
          </button>
        ))}
      </div>
      <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 16 }}>
        <button type="button" onClick={onClose} style={S.btn("#F1F5F9", "#334155")}>Cancel</button>
      </div>
    </AdmOverlay>
  );
}

// One destructive action = one dialog = one password prompt. There is deliberately no
// second "now enter your password" modal and no cached password: delete_client is terminal
// (the tenant is gone, so "the same action again" cannot happen), so a cache would avoid
// zero prompts and would reintroduce a resident secret.
function AdmDeleteDialog({ client, onClose, onDeleted }) {
  const [typed, setTyped] = useState("");
  const [pwd, setPwd] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [attempts, setAttempts] = useState(0);
  const id = client.client_id;
  const locked = attempts >= 3;
  const ready = typed.trim() === id && pwd.length > 0 && !busy && !locked;
  const submit = async () => {
    if (!ready) return;
    setBusy(true); setErr(null);
    try {
      const r = await adminApi("delete_client", { clientId: id, confirmClientId: typed.trim() }, pwd);
      setPwd("");
      onDeleted(id, r);
    } catch (e) {
      // Split by kind. An auth failure clears the password and asks again; ANY other
      // failure keeps it typed, so a validation error or a 500 never costs the operator a
      // retype — that is the "asked twice for the same action" failure this avoids.
      const authish = e.status === 401 || e.status === 403 || /password/i.test(e.message || "");
      if (authish) { setPwd(""); setAttempts((n) => n + 1); }
      setErr(e.message || "Could not delete this builder.");
      setBusy(false);
    }
  };
  return (
    <AdmOverlay onClose={busy ? () => {} : onClose} maxWidth={460} labelledBy="adm-del-ttl">
      <div id="adm-del-ttl" style={{ fontSize: 17, fontWeight: 700, color: "#991B1B", marginBottom: 10 }}>
        Delete {client.company_name || id} permanently?
      </div>
      <div style={{ fontSize: 13.5, color: "#475569", lineHeight: 1.55, marginBottom: 16 }}>
        This erases <strong>{id}</strong> from nine tables, deletes every login attached to it, and empties
        its stored images and branding. Their designer link stops working immediately. <strong>This cannot
        be undone.</strong> To stop offering the account without destroying its data, set a paused billing
        posture instead.
      </div>
      {err && <div style={S.err}>{err}</div>}
      {locked && (
        <div style={{ background: "#FEF3C7", border: "1px solid #F59E0B", borderRadius: 8, padding: "10px 14px", color: "#92400E", fontSize: 12.5, fontWeight: 600, marginBottom: 12, lineHeight: 1.5 }}>
          Stop. Two more wrong attempts will lock this IP out of the operator password for up to six hours —
          including the break-glass console at <code>/admin</code> and the settings writer, which share the
          same ledger. Close this and check the password before trying again.
        </div>
      )}
      <label style={S.lbl}>Type <code>{id}</code> to confirm</label>
      <input value={typed} onChange={(e) => setTyped(e.target.value)} disabled={busy || locked}
        onKeyDown={(e) => { if (e.key === "Enter") submit(); }} placeholder={id}
        style={{ ...S.input, marginBottom: 12 }} autoFocus />
      <label style={S.lbl}>Operator password</label>
      <PasswordInput value={pwd} onChange={(e) => setPwd(e.target.value)} disabled={busy || locked}
        onKeyDown={(e) => { if (e.key === "Enter") submit(); }} style={{ marginBottom: 4 }} />
      <div style={{ fontSize: 11, color: "#94A3B8", marginBottom: 18 }}>
        Deleting a tenant still asks for the shared password even though you're signed in — its blast radius
        is bigger than the one account.
      </div>
      <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", flexWrap: "wrap" }}>
        <button type="button" onClick={onClose} disabled={busy} style={S.btn("#F1F5F9", "#334155")}>Cancel</button>
        <button type="button" onClick={submit} disabled={!ready} title={!ready ? "Type the builder id and the operator password" : undefined}
          style={{ ...S.btn(ready ? "#DC2626" : "#FCA5A5", "#FFF"), cursor: ready ? "pointer" : "not-allowed" }}>
          {busy ? "Deleting…" : "Delete permanently"}
        </button>
      </div>
    </AdmOverlay>
  );
}

// ── The shell ────────────────────────────────────────────────────────────────
// Six sub-tabs, split by SCOPE — which is the thing the old flat toolbar hid. "Layout
// Items" wrote one tenant's row while "Master Items" read the platform-wide palette, and
// they sat adjacent in one undifferentiated pill row with nothing saying so. The tab order
// is also the onboarding order: create the client, give the owner a login, give them
// styles, then items, then prices.
const ADM_TABS = [
  ["clients", "Builders",        "Every tenant on the platform — search, create, and open",       "global"],
  ["account", "Account",        "Owner logins, billing posture, and deletion",                   "client"],
  ["styles",  "Styles & Sizes", "Building styles this builder offers, and the sizes under each",  "client"],
  ["items",   "Items",          "Which placeable layout items this builder gets",                 "client"],
  ["pricing", "Pricing",        "Bulk price and inclusion import/export by CSV",                 "client"],
  ["master",  "Master Catalog", "The global layout-item palette every builder draws from",        "global"],
];

function AdminShell({ onOpenAccount, sub: subProp = null, onSub = null }) {
  const [clients, setClients] = useState(null);   // null = loading
  const [features, setFeatures] = useState([]);
  const [master, setMaster] = useState(null);
  const [sel, setSel] = useState("");             // the administered client — NOT `viewing`
  const [subState, setSubState] = useState("clients");
  const setSub = onSub || setSubState;
  const sub = (onSub ? subProp : subState) || ADM_TABS[0][0];
  const [msg, setMsg] = useState(null);           // { ok } | { err }
  const [pickerOpen, setPickerOpen] = useState(false);
  const [bootErr, setBootErr] = useState(null);
  const promptedFor = useRef({});                 // so the picker nags at most once per tab

  const flash = (m) => { setMsg(m); if (m && m.ok) setTimeout(() => setMsg(null), 6000); };
  const selRow = (clients || []).find((c) => c.client_id === sel) || null;
  const active = ADM_TABS.find((t) => t[0] === sub) || ADM_TABS[0];
  const needsClient = active[3] === "client";

  const loadClients = useCallback(async () => {
    const c = await adminApi("list_clients");
    setClients(c.clients || []);
    setFeatures(c.features || []);
    return c.clients || [];
  }, []);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const [list, m] = await Promise.all([adminApi("list_clients"), adminApi("get_master")]);
        if (cancelled) return;
        setClients(list.clients || []);
        setFeatures(list.features || []);
        setMaster(m);
        // Restore the last-administered client, but only if it still exists — a tenant
        // deleted in another session must not come back as a selection.
        try {
          const saved = sessionStorage.getItem("ss.admin.clientId");
          if (saved && (list.clients || []).some((c) => c.client_id === saved)) setSel(saved);
        } catch (_e) { /* private mode */ }
      } catch (e) {
        if (!cancelled) { setBootErr(e.message || "Could not load the operator console."); setClients([]); }
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const pickClient = (cid) => {
    setSel(cid);
    setMsg(null);
    setPickerOpen(false);
    try { sessionStorage.setItem("ss.admin.clientId", cid); } catch (_e) {}
    if (sub === "clients") setSub("account");
  };

  // Clicking a client-scoped tab with nothing selected opens the picker ONCE. The tab is
  // never disabled — a disabled tab is a dead end that teaches nothing.
  useEffect(() => {
    if (needsClient && !sel && clients && !promptedFor.current[sub]) {
      promptedFor.current[sub] = true;
      setPickerOpen(true);
    }
  }, [sub, sel, clients, needsClient]);

  return (
    <div>
      {/* Banner. Settings' exact treatment, but it earns the repetition of the topbar title
          by carrying the administered client — visible from every sub-tab, so an operator
          can never lose track of who the next write lands on. */}
      <div style={{ background: "linear-gradient(135deg, #3D3672 0%, #1B7895 100%)", borderRadius: 14, padding: "20px 22px", color: "#FFF", marginBottom: 4 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
          <div style={{ width: 44, height: 44, borderRadius: 11, background: "rgba(255,255,255,0.14)", border: "1px solid rgba(255,255,255,0.28)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, color: "#FFF" }}>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#FFF" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
          </div>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 20, fontWeight: 800, lineHeight: 1.15 }}>Admin</div>
            <div style={{ fontSize: 12.5, color: "#D6E4F0", marginTop: 2 }}>The operator console — every tenant's catalog, setup and onboarding. Changes here are live in a builder's account.</div>
          </div>
          <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 10, background: "rgba(255,255,255,0.12)", border: "1px solid rgba(255,255,255,0.26)", borderRadius: 10, padding: "8px 12px" }}>
            {selRow ? (
              <>
                <AdmTile name={selRow.company_name || selRow.client_id} size={28} />
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 14, fontWeight: 800, color: "#FFF", whiteSpace: "nowrap" }}>{selRow.company_name || selRow.client_id}</div>
                  <div style={{ fontSize: 11.5, color: "#C9DCEA" }}>{selRow.client_id}</div>
                </div>
                <button type="button" onClick={() => setPickerOpen(true)}
                  style={{ fontFamily: "inherit", background: "transparent", border: "1px solid rgba(255,255,255,0.4)", color: "#FFF", borderRadius: 8, padding: "5px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                  Change
                </button>
              </>
            ) : (
              <>
                <div style={{ fontSize: 13, fontWeight: 700, color: "#D6E4F0" }}>No builder selected</div>
                <button type="button" onClick={() => setPickerOpen(true)} disabled={!clients}
                  style={{ fontFamily: "inherit", background: "transparent", border: "1px solid rgba(255,255,255,0.4)", color: "#FFF", borderRadius: 8, padding: "5px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer", opacity: clients ? 1 : 0.5 }}>
                  Choose builder
                </button>
              </>
            )}
          </div>
        </div>
      </div>

      {/* Sub-navigation. Real <button>s, unlike admin.html's <div onClick> tabs, which were
          not focusable and had no Enter/Space. The divider is the whole point of the
          reorganisation: everything left of it is about one client, everything right of it
          is platform-wide. */}
      <div style={{ display: "flex", gap: 2, flexWrap: "wrap", borderBottom: "2px solid #E2E8F0", marginBottom: 14 }}>
