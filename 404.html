<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Page not found — StructureStudio</title>
<!-- Served for any unknown path by Workers static assets (not_found_handling
     "404-page" in the wrangler configs). Styled after offline.html; deliberately
     no scripts and no external assets — this page must render when nothing else
     could be found. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F8FAFC;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#FFF;border:1px solid #E2E8F0;border-radius:16px;padding:36px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.06)}
.badge{width:56px;height:56px;border-radius:14px;background:#75E6DA;color:#3D3672;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
h1{font-size:20px;font-weight:800;color:#1E293B;margin-bottom:8px}
p{font-size:14px;color:#64748B;line-height:1.6;margin-bottom:20px}
a.btn{display:inline-block;background:#3D3672;color:#FFF;text-decoration:none;border-radius:9px;padding:11px 22px;font-size:14px;font-weight:700}
a.btn:hover{background:#2B4C7E}
</style></head>
<body>
  <div class="card">
    <div class="badge">SS</div>
    <h1>Page not found</h1>
    <p>This page doesn&rsquo;t exist &mdash; the link may be old or mistyped.</p>
    <a class="btn" href="/portal.html">Go to the portal</a>
  </div>
</body></html>
